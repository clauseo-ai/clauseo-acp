# Every budget the plan sets, one [[budget]] table per metric. `cargo xtask check` validates each row;
# `cargo xtask buildtime` compares its probes with the rows it measures.
#
# id           snake_case, unique
# metric       what is measured
# limit        the most it may be, in `unit`
# unit         s, ms, MB, KB or count
# gate         pr (blocks merges), release (blocks release tags), alert (reports only),
#              local (fails locally, alerts in CI)
# measured_by  the tool or method
# status       unmeasured or measured: whether this repo's own tooling has measured the row
# measured     optional: the last measured value, in `unit` (for unmeasured rows, an earlier lab number)
# measured_on  optional, required with measured: os-arch-machine kind, never a private host name
# source       the plan section the budget comes from
#
# Not a row yet: sandbox overhead per agent. Its budget is set after measuring our own launcher and
# proxy (synthesis §4; doc 21).

