# What a crate whose Crates-table row in ARCHITECTURE.md lists `fs`, `process` or `any I/O`
# may not call or name. clippy reads only the nearest clippy.toml, so each such crate has
# `crates/<name>/clippy.toml`: the root clippy.toml with these two arrays appended to its own
# (root entries first). `cargo xtask check` (core-io) fails when that file is missing or parses
# to anything else, and its fix prints the file to write. An exception is
# `#[expect(clippy::disallowed_methods, reason = "..")]` (or `disallowed_types`) at the call.
#
# Read from the std source of the pinned toolchain, 1.99.0 (rust-src, library/std/src): fs.rs,
# env.rs, process.rs, net/, os/unix/{fs.rs,process.rs,net/} and os/windows/{fs.rs,process.rs}.
# It names every stable public function and type (traits included) of std::fs, std::env,
# std::process and std::net, and of std::os::{unix,windows}::{fs,net,process}, written out
# because clippy bans items, not modules; then the disk, clock and stream reads outside them.
# Left out:
# - unstable items (std::fs::Dir, std::os::windows::net, ...): stable Rust cannot name them;
# - the core::net types std::net re-exports (IpAddr, Ipv4Addr, Ipv6Addr, SocketAddr,
#   SocketAddrV4, SocketAddrV6, AddrParseError): clippy matches the item, so banning them would
#   ban core::net's own data types, which do no I/O;
# - the constants of std::env::consts, which clippy cannot ban and which read nothing at run time;
# - methods of the types below and of their extension traits: they need a value of a banned type;
# - std::time::Instant::now and std::time::SystemTime::now, which the root clippy.toml bans.
# allow-invalid = true marks the std::os::unix and std::os::windows entries: clippy warns about a
# path that does not resolve on the target it builds for, and each of those modules exists on
# one family only.
# 63 disallowed-methods and 56 disallowed-types entries.

