[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
dunce.workspace = true
# The docs check reads Markdown with it: code spans, links, reference definitions, code blocks.
pulldown-cmark = { version = "0.13.4", default-features = false }
# The tauri-config check: `span-locations` gives the line of a syntax error in build.rs.
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
# The pins check parses workflows and lefthook.yml with it: events with line numbers, anchors.
saphyr-parser = "0.2.2"
# The graph checks match a registry declaration to the version its requirement allows.
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# `setup --binaries` checks each downloaded release asset against its pinned sha256.
sha2 = "0.10.9"
# The docs check splits the `cargo xtask` commands in the docs into words as a shell does.
shlex = "2.0.1"
# The tauri-config check parses `crates/desktop/build.rs` before it reads its tokens. The
# expect-allowlist check parses every .rs file and walks it with `syn::visit` (`visit`).
syn = { version = "3.0.9", features = ["full", "visit"] }
toml = "1"
