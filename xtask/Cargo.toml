[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
# The docs check reads Markdown with it: code spans, links, reference definitions, code blocks.
pulldown-cmark = { version = "0.13.4", default-features = false }
# The core-io check: `span-locations` gives real line numbers to the tokens syn parses.
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# `setup --binaries` checks each downloaded release asset against its pinned sha256.
sha2 = "0.10.9"
# The core-io check parses the Rust sources of the crates that must not do I/O.
syn = { version = "3.0.9", features = ["full", "visit"] }
toml = "1"
