packages:
  - "app"
  - "components"
  - "e2e"

# The one home of a version two packages share; each names it as "catalog:".
catalog:
  "@playwright/test": "1.64.0"
  "@types/react": "19.2.18"
  "@types/react-dom": "19.2.7"
  "@typescript/native": "npm:typescript@7.0.2"
  # ui/app: the room's accessibility checks, its tests and window.__clauseoAxe (src/room/dev-hooks.ts)
  axe-core: "4.14.0"
  react: "19.2.8"
  react-dom: "19.2.8"
  vitest: "4.1.11"

minimumReleaseAge: 10080 # 7 days, in minutes; pnpm 11 default is 1440
minimumReleaseAgeExclude: [] # add exact name@version only for urgent security fixes, with a dated comment
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds: # empty: add a package only when an install fails without it, with a comment saying why
savePrefix: "" # exact versions in package.json
# Off: pnpm's up-to-date shortcut skips the devPreinstall hook, which makes ui/app/components (see scripts/components-link.mjs).
optimisticRepeatInstall: false
# decode-named-character-reference: micromark's entity decoder, replaced for every consumer of the answer renderer.
# Its browser build decoded `&amp;` by assigning HTML to an element, which Trusted Types refuses (the answer's React
# root would unmount), and its other build carries the whole HTML table (~10 KB brotli). The patched index.js knows
# ~150 common names at once and imports the table (character-entities) lazily, as its own chunk; the `browser`
# condition is gone and index.dom.js re-exports index.js. Checked by ui/components/src/markdown/entities.test.ts.
# axe-core: Color's methods are defined on its prototype with Object.defineProperty instead of assigned, so axe loads
# under Tauri's freezePrototype (tauri.conf.json): with Object.prototype frozen, assigning `toString` there throws in
# strict code (the override mistake), and Vite's ES module chunk is strict, so window.__clauseoAxe() always failed in the
# app. Same value, enumerable and writable as the assignment made it. Checked by ui/app/src/room/axe-frozen.test.ts.
patchedDependencies:
  axe-core@4.14.0: patches/axe-core@4.14.0.patch
  decode-named-character-reference@1.3.0: patches/decode-named-character-reference@1.3.0.patch
