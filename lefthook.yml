pre-commit:
  parallel: true
  commands:
    fmt:      { glob: "*.rs",   run: "cargo fmt -- --check {staged_files}" }
    typos:    { run: "typos {staged_files}" }
    taplo:    { glob: "*.toml", run: "taplo fmt --check {staged_files}" }
    gitleaks: { run: gitleaks git --staged --redact --no-banner }
    oxfmt:    { root: "ui/app/", glob: "*.{ts,tsx,js,mjs,cjs,json,html,css,md}", run: "pnpm exec oxfmt --check {staged_files}" }
    oxlint:   { root: "ui/app/", glob: "*.{ts,tsx,js,mjs,cjs}", run: "pnpm exec oxlint {staged_files}" }
pre-push:
  commands:
    check: { run: cargo xtask check --quick }
