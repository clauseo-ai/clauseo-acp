pre-commit:
  parallel: true
  commands:
    fmt:      { glob: "*.rs",   run: "cargo fmt -- --check {staged_files}" }
    typos:    { run: "typos --force-exclude {staged_files}" }
    taplo:    { glob: "*.toml", run: "taplo fmt --check {staged_files}" }
    gitleaks: { run: gitleaks git --staged --redact --no-banner }
    # lefthook 2.2.1: `root` runs the command there and `glob` matches the path under it (`./app/src/App.tsx`),
    # so `**/` reaches nested files. `exclude` matches the repo path (`ui/pnpm-lock.yaml`). oxfmt and oxlint
    # refuse a file list of only ignored files, so the lockfile and the generated bindings.ts (which both tools
    # ignore, and which every protocol change regenerates) are excluded.
    oxfmt:    { root: "ui/", glob: "**/*.{ts,tsx,js,mjs,cjs,json,jsonc,yaml,yml,html,css,md}", exclude: ["**/pnpm-lock.yaml", "**/transport/bindings.ts"], run: "pnpm run fmt:check {staged_files}" }
    # The type-aware script, as `cargo xtask check` runs it, so the hook and the check fail on the same rules.
    oxlint:   { root: "ui/app/", glob: "**/*.{ts,tsx,js,mjs,cjs}", exclude: ["**/transport/bindings.ts"], run: "pnpm run lint:types {staged_files}" }
    # The same script on ui/components, through the link ui/app/components, the way `lint:types` reaches it
    # (oxlint refuses a path with `..`), so each staged path gets `components/` in front.
    oxlint-components: { root: "ui/components/", glob: "**/*.{ts,tsx,js,mjs,cjs}", run: "for f in {staged_files}; do set -- \"$@\" \"components/$f\"; done; pnpm -C ../app run lint:types \"$@\"" }
pre-push:
  commands:
    # CI mode, as fast-lane runs it, so a clippy warning fails the push as it fails CI (#210). CI mode
    # also gives nextest the ci profile (one retry; a test that passes only on it shows as FLAKY) and
    # runs the ui steps even where pnpm is missing. `CI=0 git push` runs the check in local mode.
    # A push of deletes only (`git push origin --delete <branch>`) sends no commits and passes
    # without it: the script reads git's ref lines, which `use_stdin` passes on. pre-push-test.sh
    # tests both, through lefthook.
    check: { use_stdin: true, run: "bash .github/scripts/pre-push.sh" }
