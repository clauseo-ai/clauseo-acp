pre-commit:
  parallel: true
  commands:
    fmt:      { glob: "*.rs",   run: "cargo fmt -- --check {staged_files}" }
    typos:    { run: "typos --force-exclude {staged_files}" }
    taplo:    { glob: "*.toml", run: "taplo fmt --check {staged_files}" }
    gitleaks: { run: gitleaks git --staged --redact --no-banner }
    # lefthook 2.2.1: `root` runs the command there and `glob` matches the path under it (`./app/src/App.tsx`),
    # so `**/` reaches nested files. `exclude` matches the repo path (`ui/pnpm-lock.yaml`). oxfmt refuses
    # a file list of only ignored files, so the lockfile is excluded.
    oxfmt:    { root: "ui/", glob: "**/*.{ts,tsx,js,mjs,cjs,json,jsonc,yaml,yml,html,css,md}", exclude: "**/pnpm-lock.yaml", run: "pnpm run fmt:check {staged_files}" }
    # The type-aware script, as `cargo xtask check` runs it, so the hook and the check fail on the same rules.
    oxlint:   { root: "ui/app/", glob: "**/*.{ts,tsx,js,mjs,cjs}", run: "pnpm run lint:types {staged_files}" }
    # The same script on ui/components, through the link ui/app/components, the way `lint:types` reaches it
    # (oxlint refuses a path with `..`), so each staged path gets `components/` in front.
    oxlint-components: { root: "ui/components/", glob: "**/*.{ts,tsx,js,mjs,cjs}", run: "for f in {staged_files}; do set -- \"$@\" \"components/$f\"; done; pnpm -C ../app run lint:types \"$@\"" }
pre-push:
  commands:
    check: { run: cargo xtask check --quick }
