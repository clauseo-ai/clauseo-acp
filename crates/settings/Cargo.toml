[package]
name = "clauseo-settings"
version = "0.1.0"
description = "Clauseo's settings: the schema, the folders it uses, settings.json and the policy layer."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
serde_json_lenient = { workspace = true, features = [
  "preserve_order",
  "raw_value",
] }
schemars = { workspace = true, features = ["std", "derive", "indexmap2"] }
thiserror = { workspace = true }
tracing = { workspace = true }
# NFKC for the misnamed-section rule (policy names).
unicode-normalization = { workspace = true }
# The key names in macOS managed preferences files; plain Rust, so tested on every OS.
plist = { workspace = true }

# The registry and the known folders.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_System_Com",
] }

# The login user's name from the real user id, for its managed preferences file (macOS); built
# on every Unix so it is tested off macOS too.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["user"] }

# Managed preferences.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { workspace = true, features = ["CFPreferences"] }

[dev-dependencies]
insta = { workspace = true, features = ["json", "redactions"] }

[lints]
workspace = true
