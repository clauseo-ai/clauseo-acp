[package]
name = "clauseo-matters"
version = "0.1.0"
description = "Matter folders and their history: shadow git repositories, checkpoints and undo."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exports `test_support`: a pretend Word process for the stale owner-file rule, which this
# crate's and host's tests turn on (dev-dependencies only, never the app).
test-support = []

[dependencies]
clauseo-protocol = { path = "../protocol" }
# index: the stat cache (a git index file); revision: walking the timeline; sha1: gix's own
# collision-detecting SHA-1. Nothing else: changes come from this crate's own walk.
gix = { workspace = true, features = ["index", "revision", "sha1"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
# NFC for the safety matches on names: owner files and refused or claimed folders
# (decision 0007, Unicode names).
unicode-normalization = { workspace = true }
tracing = { workspace = true }
# clippy.toml bans std's canonicalize in favour of dunce's, for the refused-folder check.
dunce = { workspace = true }

# The durability sequence: plain fsync, F_BARRIERFSYNC and one F_FULLFSYNC per checkpoint;
# mount: `MNT_LOCAL` in `statfs`'s flags, for a folder on a network drive (place.rs).
# The stale owner-file rule's `F_GETLK` (locks/stale.rs) is `fs` too.
[target.'cfg(target_os = "macos")'.dependencies]
nix = { workspace = true, features = ["fs", "mount"] }

# The running Word processes and their starts, for the stale owner-file rule (locks/stale.rs).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
clauseo-process = { path = "../process" }

# `SetFileAttributesW`, to hide `.clauseo` (write/windows.rs), and `GetVolumePathNameW` with
# `GetDriveTypeW` for a network drive (place/windows.rs); the workspace's one `windows` line.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
# Itself with test-support, so its tests reach `test_support` with no flag.
clauseo-matters = { path = ".", features = ["test-support"] }
criterion = { workspace = true, features = ["cargo_bench_support"] }

[[bench]]
name = "checkpoint"
harness = false

[[bench]]
name = "read"
harness = false

[[bench]]
name = "papers"
harness = false

[lints]
workspace = true
