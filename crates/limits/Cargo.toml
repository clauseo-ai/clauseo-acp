[package]
name = "clauseo-limits"
version = "0.1.0"
description = "Plan usage readers (the Claude usage helper, the Codex reader) and the limits model."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# G16's live tests only (tests/live.rs): `ProcessReaders::with_stdout_tap`, a copy of each read's
# raw stdout. Only this crate's own dev-dependency below turns it on.
live-tap = []

[dependencies]
clauseo-protocol = { path = "../protocol" }
clauseo-codex_appserver = { path = "../codex_appserver" }
clauseo-process = { path = "../process" }
clauseo-settings = { path = "../settings" }
futures = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Itself with live-tap, so the live tests reach `with_stdout_tap` with no flag.
clauseo-limits = { path = ".", features = ["live-tap"] }
clauseo-process = { path = "../process", features = ["test-support"] }
clauseo-fake_agent = { path = "../fake_agent" }
# The install layout `agents` writes, for the path rules' test (tests/readers/agents_layout.rs).
clauseo-agents = { path = "../agents" }
# Waits, without polling, for the end of a killed reader's stdout (tests/readers/harness.rs).
async-io = { workspace = true }

[lints]
workspace = true
