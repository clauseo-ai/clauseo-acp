# The agent-browser sidecar the desktop bundles in release builds (ADR 0029, "Bundling (desktop)").
#
# Read by four things, all of which must agree with it:
#   - crates/desktop/sidecars/agent-browser.mjs, `fetchAgentBrowser(triple, destPath)`, which the
#     release script (.github/scripts/sidecars.mjs) calls once per target. It reads this file with
#     its own small parser, so keep to the format below.
#   - crates/desktop/sidecars/agent-browser-build.mjs, which builds our binaries from the upstream
#     source this file pins (see below).
#   - ci.yml's real-Chrome gate, which reads the x86_64 Linux table with awk.
#   - the `agent_browser_pin` test in crates/desktop (crates/desktop/src/agent_browser_pin.rs),
#     which parses it with the toml crate.
#
# Format: five keys come before the first table, each once.
#   - `version` is upstream's release tag without the `v`.
#   - `patched_tag` names our release of the build, agent-browser-v<version>-clauseo.<n>, n
#     counting up from 1 for each rebuild of the same version.
#   - `upstream_commit` is the commit upstream's tag v<version> points at (40 lowercase hex), and
#     `upstream_tarball_sha256` the SHA-256 of GitHub's source archive of that commit,
#     https://github.com/vercel-labs/agent-browser/archive/<upstream_commit>.tar.gz.
#   - `rustc_commit` is the commit-hash `rustc -vV` prints for the toolchain our build uses
#     (rust-toolchain.toml's channel); agent-browser-build.mjs refuses to build with another.
# Each table after them is one Rust target triple, with exactly two keys: `url` (the asset's
# download URL) and `sha256` (the asset's SHA-256, 64 lowercase hex characters). A triple with no
# build holds `none = true` instead, and the script then leaves that triple's sidecar out. Values
# are double quoted strings or `true`; no other syntax (no inline tables, arrays or multi-line
# strings). Each asset is a raw binary (no archive).
#
# macOS and Windows take our build: upstream's source at upstream_commit plus the patches in
# crates/desktop/agent-browser/patches/, built per triple (natively, except x64 macOS,
# cross-compiled on an ARM64 Mac) by .github/workflows/agent-browser-build.yml and published as a
# pre-release of this repository. A url names that release's asset agent-browser-<triple> (.exe
# on Windows), under https://github.com/clauseo-ai/clauseo-acp/releases/download/<patched_tag>/,
# and its sha256 is the one the workflow prints; the release trusts this hash, not a rebuild
# (crates/desktop/agent-browser/README.md says why a rebuild may differ). A sha256 of 64 zeros is
# the placeholder before the workflow has run, and the fetch refuses it.
#
# Linux keeps upstream's binary for now. release.yml builds a tier-2 Linux release (release.yml:468)
# and puts upstream's agent-browser inside the shipped .deb (measured at release.yml:842ff). So a
# Linux build today carries upstream's binary, whose stream server is on: an unauthenticated
# loopback listener that can drive the browser, and the browser guard lets it run (crates/mcp
# env.rs:43-48). No Linux release ships that listener: the launch build turns the browser off on
# Linux (PR browser-off-linux) until our patched Linux binary, release
# agent-browser-v0.41.1-clauseo.2 (Linux x86_64 only), is pinned. Its url is under
# https://github.com/vercel-labs/agent-browser/releases/download/v<version>/, and its hashes were
# taken from the release's downloads and match the digests GitHub lists for its assets (v0.41.1,
# Apache-2.0). The fetch accepts either kind of url for any triple; the agent_browser_pin test
# pins today's split (macOS and Windows ours, Linux upstream's).

version = "0.41.1"
patched_tag = "agent-browser-v0.41.1-clauseo.3"
upstream_commit = "5868f7c05020e047c00e68e4abf9253cce864f41"
upstream_tarball_sha256 = "ca59c4590a5a265d106c494d7726b9cde8575536d31834709dd525da8d778f6f"
rustc_commit = "b940084d7eb6a299eb4bfeb8e34901bc051e7ac4"

# Our build, see the header. The sha256 is the one the workflow printed and its build record names.
[aarch64-apple-darwin]
url = "https://github.com/clauseo-ai/clauseo-acp/releases/download/agent-browser-v0.41.1-clauseo.3/agent-browser-aarch64-apple-darwin"
sha256 = "95669a5156a2887eaf22d84783f569da4f16931205efbcd5b607507e00fbe8e8"

# Our build, cross-compiled on an ARM64 Mac. The sha256 is the one the workflow printed.
[x86_64-apple-darwin]
url = "https://github.com/clauseo-ai/clauseo-acp/releases/download/agent-browser-v0.41.1-clauseo.3/agent-browser-x86_64-apple-darwin"
sha256 = "cf147cec954e438e509fc613c2e4ffa10ffa657c1466b484bb396670ad721310"

# Upstream's binary, shipped in the Linux .deb with the stream server on (see the header).
[x86_64-unknown-linux-gnu]
url = "https://github.com/vercel-labs/agent-browser/releases/download/v0.41.1/agent-browser-linux-x64"
sha256 = "2a89295b62ddd497986a9a80b52e1dbe4c1f6bd68ffde67eaae82eec2206af61"

# Upstream's binary, as above.
[aarch64-unknown-linux-gnu]
url = "https://github.com/vercel-labs/agent-browser/releases/download/v0.41.1/agent-browser-linux-arm64"
sha256 = "f0b3bdaa40abf2a5111ec08e6d242110aaf56045ef5108cbc633bacc8e53ca17"

# Our build, see the header. The sha256 is the one the workflow printed and its build record names.
[x86_64-pc-windows-msvc]
url = "https://github.com/clauseo-ai/clauseo-acp/releases/download/agent-browser-v0.41.1-clauseo.3/agent-browser-x86_64-pc-windows-msvc.exe"
sha256 = "e89261bd641296e8731620fa047151ba682a77988f6494f14904b6a9801b9f23"

# Our build, native ARM64 (no x64 emulation). The sha256 is the one the workflow printed.
[aarch64-pc-windows-msvc]
url = "https://github.com/clauseo-ai/clauseo-acp/releases/download/agent-browser-v0.41.1-clauseo.3/agent-browser-aarch64-pc-windows-msvc.exe"
sha256 = "4ce67d31672fabf602f32779b8a3874dc525834ec2e303e3bd4bc24767020ded"
