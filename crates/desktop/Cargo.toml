[package]
name = "clauseo-desktop"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

[features]
# The end-to-end build (src/e2e.rs), never on by default: on Windows the webview opens a DevTools
# port for Playwright; on every OS `pick_folder` reads E2E_MATTER_DIR and the "always allow"
# confirm reads E2E_CONFIRM_ALWAYS instead of drawing a dialog.
e2e = []
# The speed scoreboard's macOS build (src/marks.rs), never on by default: e2e, plus the page plays
# the scoreboard session itself and reports through `marks_memory` and `marks_finish`, which
# writes the run to MARKS_OUT and quits. e2e alone also stamps channel events with their receive
# time, sets the page's perf globals and adds `perf_channel_bytes` (src/e2e.rs).
marks = ["e2e"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
tauri-runtime.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-deep-link.workspace = true
tauri-plugin-window-state.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-os.workspace = true
tauri-plugin-notification.workspace = true
serde_json.workspace = true
# The confirms (src/dialogs.rs), as tauri-plugin-dialog builds rfd; it is that plugin's own copy.
rfd.workspace = true
serde = { workspace = true, features = ["derive"] }
# The session host and what starting it takes: settings, the launcher, the boundary types.
clauseo-host = { path = "../host" }
clauseo-protocol = { path = "../protocol" }
clauseo-settings = { path = "../settings" }
clauseo-process = { path = "../process" }
# Clauseo's launch profile, adapted to the host's ProfileHook (src/profile.rs, 0030).
clauseo-profile = { path = "../profile" }
# Agent installs, sign-in and the API keys (src/setup/, R20 P5b, 0048); the keys held in memory
# as Zeroizing text; the sign-in line's plan words, as limits names them.
clauseo-agents = { path = "../agents" }
zeroize = { workspace = true }
clauseo-limits = { path = "../limits" }
# The paid data connectors (src/connectors.rs, R24): the keychain store, the connector's config
# and the account, handed to the host with the case-law relays.
clauseo-connectors = { path = "../connectors" }
# The sandbox: on Windows, the sandbox user record (src/jailed/windows.rs); on every OS, its
# folder's name, which the uninstaller's deletion keeps (src/delete_app_data/walk.rs). The host
# already builds it everywhere.
clauseo-sandbox = { path = "../sandbox" }
# The profile's start-up warnings (a skill left out, no profile).
tracing = { workspace = true }
# Polling host subscriptions on Tauri's runtime; the bridge's watchdog timer.
futures = { workspace = true }
async-io = { workspace = true }
# Finding the quotes and backslashes to escape when an event is split into fragments.
memchr = { workspace = true }
# open_external's link check (src/open.rs): the scheme, the host in its ASCII form.
url = { workspace = true }
# open_file's containment check resolves paths; clippy.toml bans std's canonicalize.
dunce = { workspace = true }
# The command ids the bridge mints for `answer_permission` and the focus refresh.
uuid = { workspace = true, features = ["v7"] }
# The anonymous usage counts (src/counts.rs, 0036): opened here, handed to the host, ticked and sent.
clauseo-counts = { path = "../counts" }
# The counts' upload (src/counts/upload.rs): HTTPS over rustls with ring (the updater's provider,
# so no second one), the OS's certificate check, and the system proxy. TLS 1.2 too, for the
# inspecting proxies some firms run.
reqwest = { workspace = true, features = [
  "rustls-no-provider",
  "system-proxy",
] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }

# The native window over the room's maximise button, for Snap Layouts
# (src/window_frame/windows.rs): the window and its class, the top-level window's subclass, mouse
# capture and leave tracking, the window's DPI, and this module's handle. Gdi for WNDCLASSEXW.
# The WebView2 dialog (src/webview2/windows.rs): Controls for TaskDialogIndirect, HiDpi for its
# DPI awareness, Com and Shell for ShellExecuteW. SystemInformation for GlobalMemoryStatusEx, the
# machine's total memory (src/machine_memory.rs). Time for the day cap's local day
# (src/connectors/local_day.rs): FileTimeToSystemTime and SystemTimeToTzSpecificLocalTime.
# The agent sandbox check (src/jailed/windows.rs): Foundation for HANDLE, CloseHandle and LocalFree,
# Security for GetTokenInformation and EqualSid, Security_Authorization for ConvertStringSidToSidW,
# Threading for OpenProcessToken; clauseo-sandbox (above) reads the sandbox user record. Its
# CI test (tests/jailed_windows.rs) also uses Security's CreateRestrictedToken and Threading's
# CreateProcessAsUserW.
# The uninstaller's deletion (src/delete_app_data/ops.rs): Storage_FileSystem for a linked
# `sandbox`'s reparse tag and its delete on one handle (GetFileInformationByHandleEx,
# SetFileInformationByHandle). Other crates already build the feature.
# The updater's install kind (src/update/install_kind/windows.rs): Registry for RegOpenKeyExW,
# to see the per-machine installer's uninstall key.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# open_file's default app for a type on macOS (src/open/mac_app.rs): CFString and CFURL.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { workspace = true, features = ["CFString", "CFURL"] }
# The machine's total memory on macOS (src/machine_memory.rs): sysctlbyname("hw.memsize"). The
# updater's install kind (src/update/install_kind.rs): access(2) on the .app's folder.
libc = { workspace = true }

# The day cap's local day on Linux (src/connectors/local_day.rs): localtime_r; macOS takes libc
# above.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
libc = { workspace = true }

# The updater is left out of Linux: Linux always updates through its package manager (R23), so the
# plugin is never registered there (lib.rs). Its adapter (src/update/plugin.rs) is built there in
# tests only, through the dev-dependency below.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-updater.workspace = true

[dev-dependencies]
# The TypeScript bindings (src/commands/bindings.rs) are written by a unit test, so tauri-specta,
# specta and protocol's `specta` feature stay out of the app: the commands carry
# `#[cfg_attr(test, specta::specta)]`, and tauri's `specta` feature types the Channel.
tauri-specta = { workspace = true, features = ["typescript"] }
specta = { workspace = true, features = ["derive", "function"] }
specta-typescript = { workspace = true }
clauseo-protocol = { path = "../protocol", features = ["specta"] }
# The scripted agent for the permission tests (its binary is built in a workspace run).
clauseo-fake_agent = { path = "../fake_agent" }
# The setup tests (src/setup/tests/): the in-memory keychain and test installs.
clauseo-agents = { path = "../agents", features = ["test-support"] }
clauseo-host = { path = "../host", features = ["test-support"] }
# The mock runtime, to see what Tauri itself rejects with.
tauri = { workspace = true, features = ["test", "specta"] }
# The agent-browser pin's test (src/agent_browser_pin.rs) parses crates/desktop/agent-browser.toml
# with the toml crate (xtask's version) and checks its version with semver (already in the tree).
toml = "1"
semver = "1"
# The setup tests (src/setup/tests.rs) capture the log lines, to see no secret in them.
tracing-subscriber = { workspace = true, features = ["fmt"] }
# The canary test (tests/canary.rs) unzips each counts body it captured to search it.
flate2 = { workspace = true }
# The updater's adapter and its latest.json fixtures (src/update/tests.rs) on every OS, Linux
# included, where the app itself leaves the plugin out.
tauri-plugin-updater.workspace = true

# The deletion's Windows tests (src/delete_app_data/tests/make.rs) set a reparse point that is no
# link with DeviceIoControl (System_IO), to see it kept.
[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_System_IO"] }
