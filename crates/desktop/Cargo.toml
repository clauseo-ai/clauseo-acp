[package]
name = "clauseo-desktop"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

[features]
# The end-to-end build (src/e2e.rs), never on by default: on Windows the webview opens a DevTools
# port for Playwright; on every OS `pick_folder` reads E2E_MATTER_DIR and the "always allow"
# confirm reads E2E_CONFIRM_ALWAYS instead of drawing a dialog.
e2e = []
# The speed scoreboard's macOS build (src/marks.rs), never on by default: e2e, plus the page plays
# the scoreboard session itself and reports through `marks_memory` and `marks_finish`, which
# writes the run to MARKS_OUT and quits. e2e alone also stamps channel events with their receive
# time, sets the page's perf globals and adds `perf_channel_bytes` (src/e2e.rs).
marks = ["e2e"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
tauri-runtime.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-deep-link.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-window-state.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-os.workspace = true
tauri-plugin-notification.workspace = true
serde_json.workspace = true
# The confirms (src/dialogs.rs), as tauri-plugin-dialog builds rfd; it is that plugin's own copy.
rfd.workspace = true
serde = { workspace = true, features = ["derive"] }
# The session host and what starting it takes: settings, the launcher, the boundary types.
clauseo-host = { path = "../host" }
clauseo-protocol = { path = "../protocol" }
clauseo-settings = { path = "../settings" }
clauseo-process = { path = "../process" }
# Clauseo's launch profile, adapted to the host's ProfileHook (src/profile.rs, 0030).
clauseo-profile = { path = "../profile" }
# The profile's start-up warnings (a skill left out, no profile).
tracing = { workspace = true }
# Polling host subscriptions on Tauri's runtime; the bridge's watchdog timer.
futures = { workspace = true }
async-io = { workspace = true }
# Finding the quotes and backslashes to escape when an event is split into fragments.
memchr = { workspace = true }
# open_external's link check (src/open.rs): the scheme, the host in its ASCII form.
url = { workspace = true }
# open_file's containment check resolves paths; clippy.toml bans std's canonicalize.
dunce = { workspace = true }
# The command ids the bridge mints for `answer_permission` and the focus refresh.
uuid = { workspace = true, features = ["v7"] }

# The native window over the room's maximise button, for Snap Layouts
# (src/window_frame/windows.rs): the window and its class, the top-level window's subclass, mouse
# capture and leave tracking, the window's DPI, and this module's handle. Gdi for WNDCLASSEXW.
# The WebView2 dialog (src/webview2/windows.rs): Controls for TaskDialogIndirect, HiDpi for its
# DPI awareness, Com and Shell for ShellExecuteW.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# open_file's default app for a type on macOS (src/open/mac_app.rs): CFString and CFURL.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { workspace = true, features = ["CFString", "CFURL"] }

[dev-dependencies]
# The TypeScript bindings (src/commands/bindings.rs) are written by a unit test, so tauri-specta,
# specta and protocol's `specta` feature stay out of the app: the commands carry
# `#[cfg_attr(test, specta::specta)]`, and tauri's `specta` feature types the Channel.
tauri-specta = { workspace = true, features = ["typescript"] }
specta = { workspace = true, features = ["derive", "function"] }
specta-typescript = { workspace = true }
clauseo-protocol = { path = "../protocol", features = ["specta"] }
# The scripted agent for the permission tests (its binary is built in a workspace run).
clauseo-fake_agent = { path = "../fake_agent" }
# The limits tests (src/bridge/tests/limits.rs): a scripted limits reader, and the host's
# ManualClock to pass the 5 minutes a `Shown` refresh waits for. No reader process starts.
clauseo-limits = { path = "../limits" }
clauseo-host = { path = "../host", features = ["test-support"] }
# The mock runtime, to see what Tauri itself rejects with.
tauri = { workspace = true, features = ["test", "specta"] }
