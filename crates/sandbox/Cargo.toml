[package]
name = "clauseo-sandbox"
version = "0.1.0"
description = "The agent jail: the policy, the link scan, tier detection, the denial types and the per-OS launchers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exports `windows::test_dacl`, a tests' folder with a protected DACL, for the host's tests.
test-support = []

[dependencies]
clauseo-protocol = { path = "../protocol" }
clauseo-process = { path = "../process" }
thiserror = { workspace = true }
tracing = { workspace = true }
# Denials print as JSON lines in the examples and travel to `host` (R18).
serde = { workspace = true, features = ["derive"] }
# clippy.toml bans std's canonicalize in favour of dunce's.
dunce = { workspace = true }
# Path comparisons fold Unicode normalisation and case on macOS, as APFS does
# (src/policy/names.rs): canonical caseless matching, NFD of the full case fold of NFD.
unicode-normalization = { workspace = true }
caseless = { workspace = true }
# The egress proxy (src/proxy.rs): its thread runs async-io's block_on over an async-executor
# LocalExecutor; DNS and the upstream lookup run on blocking's pool; httparse reads request and
# response heads; url turns host names to ASCII (IDN) and parses http:// targets; psl refuses a
# firm wildcard on a public suffix; getrandom, base64 and subtle make and check the token.
async-executor = { workspace = true }
async-io = { workspace = true }
blocking = { workspace = true }
futures = { workspace = true }
httparse = { workspace = true }
url = { workspace = true }
psl = { workspace = true }
getrandom = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
# Tier B's files, read and written on every OS: the ACL ledger, matters.json and setup.json.
serde_json = { workspace = true }
# The elevated set-up's pool passwords are wiped from memory on drop (src/windows/setup).
zeroize = { workspace = true }
# The egress proxy's upstream: proxy URLs, and the logs of an ignored setting or a failed lookup.
# (url and tracing are listed above.)

# The watcher (src/macos/watch.rs): `log stream` started as a child, its ndjson lines read on a
# thread of its own with a once-a-second tick, each line parsed as JSON.
# The upstream lookup's proxy settings and PAC runs (src/proxy/upstream/macos.rs).
[target.'cfg(target_os = "macos")'.dependencies]
async-process = { workspace = true }
objc2-cf-network = { workspace = true, features = ["std", "CFProxySupport"] }
objc2-core-foundation = { workspace = true, features = [
  "CFArray",
  "CFDate",
  "CFDictionary",
  "CFError",
  "CFNumber",
  "CFRunLoop",
  "CFStream",
  "CFString",
  "CFURL",
] }

# The process's soft open-file limit, which bounds the proxies' socket cap (src/proxy/load.rs);
# the browser socket folder's owner check (geteuid) and its lock file (open, flock).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

# The proxy's listeners bind with SO_EXCLUSIVEADDRUSE (src/ports.rs).
# The upstream lookup's WinHTTP calls (src/proxy/upstream/windows.rs).
# The folder check's file, volume and security calls (src/windows.rs and its tests): CreateFileW,
# GetFinalPathNameByHandleW, GetVolumePathNameW, GetDriveTypeW (DRIVE_REMOTE), the volume's
# FILE_PERSISTENT_ACLS flag, GetFileSecurityW and AccessCheck on a duplicated token
# (GetCurrentProcess and OpenProcessToken from Win32_System_Threading), and the test's SDDL and
# SetNamedSecurityInfoW. Tier B's records (src/windows/{record,detect}.rs): RegGetValueW for the
# sandbox user record and the build number (System_Registry), the token's user and
# ConvertSidToStringSidW, and IsWow64Process2's machine type (System_SystemInformation);
# DeviceIoControl for the tests' junctions (System_IO). The walk (src/windows/acl/object.rs):
# NtCreateFile relative to a folder's handle (Wdk_Foundation, Wdk_Storage_FileSystem). The
# set-aside's scan (src/windows/set_aside/ntfs/scan.rs): CompareStringOrdinal, to compare names as
# NTFS does (Win32_Globalization). The change journal (src/windows/clean_close/ntfs.rs):
# FSCTL_QUERY_USN_JOURNAL, FSCTL_READ_UNPRIVILEGED_USN_JOURNAL and its structs, and the storage
# bus from IOCTL_STORAGE_QUERY_PROPERTY (Win32_System_Ioctl). The set-up's accounts and group
# (src/windows/setup/accounts.rs): NetUserAdd and the other Net* calls (NetManagement).
[target.'cfg(windows)'.dependencies]
socket2 = { workspace = true }
windows = { workspace = true, features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_NetworkManagement_NetManagement",
  "Win32_Networking_WinHttp",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
# The Seatbelt profile snapshots.
insta = { workspace = true }
# The jail tests run fake_agent through the launcher.
clauseo-fake_agent = { path = "../fake_agent" }
# ManualTimer, so the shutdown test decides when the ladder's waits end.
clauseo-process = { path = "../process", features = ["test-support"] }

# The jail tests drive the launched programs, wait for a jailed tree's exits with kqueue, and
# open a pty outside the jail (`term`, and `fs` for its name).
[target.'cfg(target_os = "macos")'.dev-dependencies]
nix = { workspace = true, features = ["event", "term", "fs", "signal"] }

[lints]
workspace = true
