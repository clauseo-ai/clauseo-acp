<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Clauseo</title>
<style>/* Values from Clauseo's design system (ui/components/src/styles), copied because this page loads nothing. Each
custom property is the token of the same name: colour and depth from tokens-colour.css (day :root, night
[data-theme=night]), type from tokens-type.css, space, radii and motion from tokens-parts.css. */
:root{
--ground:#e5e2dc;--surface:#fdfcfa;--primary:#23201d;--muted:#48423b;--select:#e2d9c4;
--green-tint:#e3eee6;--green-text:#22603a;--red-tint:#f6e3e0;--red-text:#9e2b22;
--brand:#a3482f;--brand-night:#d07455;--divide-strong:rgba(56,44,30,.12);
--e2:inset 0 1px 0 #fff,0 1px 2px rgba(56,44,30,.08),0 4px 10px -6px rgba(56,44,30,.12),0 30px 64px -30px rgba(56,44,30,.38),18px 26px 56px -30px rgba(56,44,30,.26);
--font-latin:"Anek Latin","Anek Devanagari","Segoe UI",system-ui,sans-serif;
--font-deva:"Anek Devanagari","Anek Latin Hi","Nirmala UI","Kohinoor Devanagari",system-ui,sans-serif;
--t17:1.0625rem;--t18:1.125rem;--t22:1.375rem;--t26:1.625rem;
--lh-reply:27px;--lh-read:29px;--lh-lead-narrow:30px;--lh-lead:34px;
--w-ui:450;--w-chrome:560;--wd-wide:110%;--wd-read:104%;--tr-lead:-.014em;--tr-read:.002em;
--s1:4px;--s2:8px;--s4:16px;--s6:24px;--s8:32px;--s10:40px;--r-surface:18px;
--ease-arrive:cubic-bezier(.16,1,.3,1);--dur-arrive:220ms}
/* night */
@media (prefers-color-scheme:dark){:root{
--ground:#1b1a18;--surface:#3d3c39;--primary:#ecebe9;--muted:#cbcac8;--select:#575552;
--green-tint:#294433;--green-text:#a1dfb6;--red-tint:#55332f;--red-text:#f9c1ba;--divide-strong:rgba(255,255,255,.1);
--e2:inset 0 1px 0 rgba(255,255,255,.13),0 1px 2px rgba(0,0,0,.32),0 4px 10px -6px rgba(0,0,0,.42),0 30px 64px -30px rgba(0,0,0,.8),18px 26px 56px -30px rgba(0,0,0,.66)}
.comma{fill:var(--brand-night)}}
/* Hindi: taller lines, no tracking (tokens-type.css :root:lang(hi)) */
[lang=hi]{font-family:var(--font-deva);--lh-reply:29px;--lh-read:31px;--lh-lead-narrow:36px;--lh-lead:42px;--tr-lead:0;--tr-read:0}
html{background:var(--ground);color:var(--primary);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-synthesis:none}
body{box-sizing:border-box;min-height:100vh;margin:0;padding:var(--s6);display:grid;place-items:center;font:var(--w-ui) var(--t18)/var(--lh-read) var(--font-latin)}
::selection{background:var(--select);color:var(--primary)}
main{width:100%;max-width:46rem;margin-bottom:var(--s8)}
.lockup{display:block;width:116px;height:auto;margin:0 0 var(--s6) var(--s10)}
.word{fill:var(--primary)}
.comma{fill:var(--brand)}
.sheet{padding:var(--s10);border-radius:var(--r-surface);background:var(--surface);box-shadow:var(--e2)}
.state{display:block;width:48px;height:48px;margin-bottom:var(--s8);border-radius:50%;fill:none;stroke-width:1.1;stroke-linecap:square}
.ok .state{background:var(--green-tint);stroke:var(--green-text)}
.no .state{background:var(--red-tint);stroke:var(--red-text);stroke-width:1.25;stroke-linecap:round}
.langs{display:grid;grid-template-columns:1fr 1fr;align-items:baseline}
.langs>div{padding-right:var(--s8)}
.langs>[lang]{padding:0 0 0 var(--s8);box-shadow:inset 1px 0 0 var(--divide-strong)}
h1,.lead{margin:0 0 var(--s2);font-size:var(--t26);line-height:var(--lh-lead);font-weight:var(--w-chrome);font-stretch:var(--wd-wide);letter-spacing:var(--tr-lead);color:var(--primary);text-wrap:balance}
p{margin:0;color:var(--muted);font-stretch:var(--wd-read);letter-spacing:var(--tr-read);text-wrap:pretty}
.no p{color:var(--primary)}
@media (max-width:640px){
.sheet{padding:var(--s8) var(--s6)}
.lockup{margin-left:var(--s6)}
.langs{grid-template-columns:1fr}
.langs>div{padding:0 0 var(--s6)}
.langs>[lang]{padding:var(--s6) 0 0;box-shadow:inset 0 1px 0 var(--divide-strong)}}
@media (max-width:480px){
body{padding:var(--s4)}
h1,.lead{font-size:var(--t22);line-height:var(--lh-lead-narrow)}
p{font-size:var(--t17);line-height:var(--lh-reply)}}
/* the tick draws itself once (tokens-parts.css --dur-arrive) */
@media (prefers-reduced-motion:no-preference){.ok .state path{stroke-dasharray:1;animation:draw var(--dur-arrive) var(--ease-arrive) .15s backwards}}
@keyframes draw{from{stroke-dashoffset:1}}</style>
</head>
