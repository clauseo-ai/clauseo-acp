[package]
name = "clauseo-connectors"
version = "0.1.0"
description = "The paid connectors' OAuth client, keychain token store, refresh, revocation, account and recharge API, liveness and price."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The fake connector (`fake`), `MemoryStore`, `ManualClock` and `Origin::Fake`, for this crate's
# tests and R24's. Never on in the app.
test-support = []
# `Origin::Staging` and the staging host (https://data-staging.clauseo.chat), for desktop's
# `staging-connector` build (docs/connector-staging.md) and the tests. Off, a build holds no
# staging host at all, which release.yml's binary scan relies on.
staging = []
# `Origin::Local` and the connector's local test server (http://127.0.0.1:8793, the Mac mini's),
# for desktop's `local-connector` build and the tests. The one origin plain http may reach. Off,
# a build holds no such address.
local = []

[dependencies]
serde = { workspace = true, features = ["derive"] }
# `raw_value`: an MCP answer is kept as its raw JSON, never built as a tree (mcp.rs).
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
# rustls with the platform verifier; the provider is rustls's `ring`, set in `http.rs`.
ureq = { workspace = true, features = [
  "rustls-no-provider",
  "platform-verifier",
] }
rustls = { workspace = true, features = ["ring", "std", "tls12", "logging"] }
sha2 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true, features = [
  "std",
  "std_rng",
  "os_rng",
  "thread_rng",
] }
zeroize = { workspace = true, features = ["std"] }

# keyring 4's `v1` feature picks the store per OS: Keychain Services on macOS, Credential Manager on
# Windows (and the Secret Service on Linux, which is why keyring is not a Linux dependency at all:
# Linux is not a product target, and `KeyringStore` there answers `StoreError::Unsupported`).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
keyring = { workspace = true, features = ["v1"] }

[target.'cfg(windows)'.dependencies]
# `bind_loopback_exclusive`: SO_EXCLUSIVEADDRUSE (decision 9).
windows = { workspace = true, features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
# Itself with test-support, so `cargo nextest run -p clauseo-connectors` and the workspace run
# build the fake connector and `MemoryStore` with no flag. Not staging: the workspace's test build
# unifies features, so it would put the staging host in the app binary that
# crates/desktop/tests/staging_host.rs scans. `Origin::Staging`'s tests run with
# `--features staging` (ci.yml).
clauseo-connectors = { path = ".", features = ["test-support"] }
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }
tracing-log = { workspace = true, features = ["std", "log-tracer"] }
criterion = { workspace = true }

[[bench]]
name = "signin"
harness = false

[lints]
workspace = true
