[package]
name = "clauseo-profile"
version = "0.1.0"
description = "Clauseo's launch profile: the instructions, each agent's options, the browser server and the skills, as plain values and files."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `test_support::tree_text`, the snapshot tool R22's render snapshots reuse.
test-support = []

[dependencies]
clauseo-protocol = { path = "../protocol" }
clauseo-process = { path = "../process" }
clauseo-settings = { path = "../settings" }
dunce = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# A skill added from a link or a skills.sh name (src/packs/source/remote.rs): the link parsed.
url = { workspace = true }
# A skill added from a .zip (src/packs/source/unzip.rs), unpacked under caps, deflate only, at
# clauseo-host's version; flate2's zlib-rs backend (already in the lock) does the inflating.
zip = { version = "9.2.2", default-features = false, features = [
  "deflate-flate2-zlib-rs",
] }

# The skill packs' read (src/packs/read.rs): open with O_NOFOLLOW, through rustix's safe call.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

# The skill packs' read on Windows (src/packs/windows.rs): CreateFileW with
# FILE_FLAG_OPEN_REPARSE_POINT, GetFileInformationByHandle for the attributes and link count, and
# GetFinalPathNameByHandleW.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
# Itself with test-support, so the tests reach `tree_text` with no flag.
clauseo-profile = { path = ".", features = ["test-support"] }
clauseo-process = { path = "../process", features = ["test-support"] }
futures = { workspace = true, features = ["executor"] }
insta = { workspace = true, features = ["json"] }

[lints]
workspace = true
