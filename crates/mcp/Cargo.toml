[package]
name = "clauseo-mcp"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "clauseo-mcp"
path = "src/main.rs"

# serde and serde_json, and `windows` on Windows (below): the guard reads JSON-RPC lines as
# `serde_json::Value`, and the connector reads only a line's `id` and `method` (`connector/head.rs`),
# through serde's derive. No HTTP client, socket crate, async runtime or tauri; `tests/guard/deps.rs`
# fails on any of them, and ARCHITECTURE.md's row bans them.
[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Windows only: agent-browser runs in a Job Object the guard owns, so a refused port, and the
# guard's own exit, end its detached daemon and Chrome (src/browser_guard/job.rs). The features
# are the workspace line's: the job, the suspended start and the thread resume.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
