[package]
name = "clauseo-mcp"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Tests only: the guard's idle stop can be shortened through `CLAUSEO_TEST_GUARD_IDLE_MS`
# (src/browser_guard/session.rs). Never on in a shipped build.
[features]
test-support = []

[[bin]]
name = "clauseo-mcp"
path = "src/main.rs"

# serde and serde_json, `nix` on Unix and `windows` on Windows (below): the guard reads JSON-RPC lines as
# `serde_json::Value`, and the connector reads only a line's `id` and `method` (`connector/head.rs`),
# through serde's derive. No HTTP client, socket crate, async runtime or tauri; `tests/guard/deps.rs`
# fails on any of them, and ARCHITECTURE.md's row bans them.
[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Unix only: `killpg` and `kill` for the guard's Chrome process group and agent-browser's
# detached daemon, and the pid of the process listening on the daemon's socket (`socket`:
# SO_PEERCRED, LOCAL_PEERPID), in src/browser_guard/chrome.rs and reaper.rs, through nix's safe
# wrappers. nix needs only libc, bitflags and cfg-if; no socket crate.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["socket"] }

# Windows only: Chrome and agent-browser run in a Job Object the guard owns, so a refused port,
# and the guard's own exit, end Chrome and agent-browser's detached daemon
# (src/browser_guard/job.rs); a Toolhelp snapshot and a process handle wait for the guard's
# parent (src/browser_guard/parent/windows.rs). The workspace line's features, plus
# `Win32_Storage_FileSystem` for `MoveFileExW`, the download move that never replaces a file
# (src/write/windows.rs).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Storage_FileSystem"] }

# Itself with test-support, so the guard the tests run reads the test's idle stop.
[dev-dependencies]
clauseo-mcp = { path = ".", features = ["test-support"] }
