[package]
name = "clauseo-mcp"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "clauseo-mcp"
path = "src/main.rs"

# serde_json only (it brings serde), and `windows` on Windows (below): the guard reads JSON-RPC
# lines as `serde_json::Value`. No HTTP client, socket crate, async runtime or tauri; `tests/guard/deps.rs` fails on any of them, and
# ARCHITECTURE.md's row bans them.
[dependencies]
serde_json = { workspace = true }

# Windows only: agent-browser runs in a Job Object the guard owns, so a refused port, and the
# guard's own exit, end its detached daemon and Chrome (src/browser_guard/job.rs). The features
# are the workspace line's: the job, the suspended start and the thread resume.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
