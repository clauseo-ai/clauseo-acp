[package]
name = "clauseo-mcp"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Tests only: the guard's idle stop can be shortened through `CLAUSEO_TEST_GUARD_IDLE_MS`
# (src/browser_guard/session.rs). Never on in a shipped build.
[features]
test-support = []

[[bin]]
name = "clauseo-mcp"
path = "src/main.rs"

# serde and serde_json, `nix` on Unix and `windows` on Windows (below): the guard reads JSON-RPC lines as
# `serde_json::Value`, and the connector reads only a line's `id` and `method` (`connector/head.rs`),
# through serde's derive. No HTTP client, socket crate, async runtime or tauri; `tests/guard/deps.rs`
# fails on any of them, and ARCHITECTURE.md's row bans them.
[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# The DevTools relay's secret (src/browser_guard/devtools/handshake.rs): 256 bits from the OS's
# random source (ProcessPrng on Windows, getrandom(2) on Linux). Already in the workspace for the
# egress proxy's token; it needs only cfg-if and libc (r-efi and wasip2 on other targets).
getrandom = { workspace = true }

# Unix only: `killpg` and `kill` for the guard's Chrome process group and agent-browser's
# detached daemon, and the pid of the process listening on the daemon's socket (`socket`:
# SO_PEERCRED, LOCAL_PEERPID), in src/browser_guard/chrome.rs and reaper.rs, and the kept Chrome
# profile's files written and the folder listed relative to a folder opened once (`fs`: openat,
# renameat, unlinkat; `dir`: fdopendir; in src/write/unix.rs), and the effective user, whose
# root refuses the browser on Linux (`user`: geteuid; src/browser_guard/chrome/sandbox.rs), through nix's safe wrappers. nix needs only libc, bitflags and cfg-if; no
# socket crate. Route 2 (decision record 0060): `fs`'s `fcntl` and `nix::libc::dup2` put the
# browser's DevTools pipe at fds 3 and 4 (src/browser_guard/chrome/pipe.rs), and `process` brings
# Linux's `prctl::set_dumpable` (src/browser_guard/harden.rs).
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = [
  "socket",
  "fs",
  "dir",
  "user",
  "process",
] }

# macOS only: `getxattr` and `setxattr` for a download's `com.apple.quarantine` mark
# (src/browser_guard/downloads/marks.rs, src/write/mac.rs). libc is already nix's dependency.
[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

# Windows only: Chrome and agent-browser are created in a Job Object the guard owns
# (`CreateProcessW` with a job list), so a refused port, and the guard's own exit, end Chrome and
# agent-browser's detached daemon (src/browser_guard/job.rs, job/spawn.rs); a Toolhelp snapshot
# and a process handle wait for the guard's parent (src/browser_guard/parent/windows.rs). The
# workspace line's features, plus `Win32_Storage_FileSystem` for `SetFileInformationByHandle`, the
# download move and rename that never replace a file, and `CreateFileW`, a child's `NUL`;
# `Wdk_Foundation`, `Wdk_Storage_FileSystem` and `Win32_System_IO` for `NtCreateFile`, which makes a
# file relative to the downloads folder's handle and opens a copy's `Zone.Identifier` relative to
# the copy's handle (src/write/windows.rs).
# `Win32_System_SystemInformation` is for `GetWindowsDirectoryW` and `GetSystemDirectoryW`, the
# folders a child's `SystemRoot`, `windir` and `ComSpec` default to
# (src/browser_guard/job/spawn.rs).
# Route 2 (decision record 0060): `Win32_System_Pipes` for `CreatePipe`,
# the browser's DevTools pipe (src/browser_guard/chrome/pipe.rs); `Win32_System_Registry` for
# `RegGetValueW`, the firm's `RemoteDebuggingAllowed` policy (src/browser_guard/browsers/policy.rs);
# `Win32_Networking_WinSock` for the relay's listener with `SO_EXCLUSIVEADDRUSE` set before its
# bind (src/browser_guard/devtools/listen.rs); `Win32_NetworkManagement_IpHelper` for
# `GetExtendedTcpTable`, the owner of a relay client's socket (src/browser_guard/devtools/peer.rs).
# All in the `windows` crate already here.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
] }

# Itself with test-support, so the guard the tests run reads the test's idle stop.
[dev-dependencies]
clauseo-mcp = { path = ".", features = ["test-support"] }
