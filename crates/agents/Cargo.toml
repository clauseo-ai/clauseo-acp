[package]
name = "clauseo-agents"
version = "0.1.0"
description = "Installs the agents' ACP adapters with no terminal (Node, resumable checked downloads, npm ci, receipts) and signs the lawyer in through each vendor's own login."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Tests only: `InstallConfig::resolver`, a host-name resolver standing in for the OS's. Only this
# crate's own dev-dependency below turns it on. It also brings rcgen, which `testing`'s
# TLS-inspecting proxy uses to make its CA and leaf certificates at test time.
test-support = ["dep:rcgen"]

[dependencies]
clauseo-protocol = { path = "../protocol" }
clauseo-process = { path = "../process" }
# Codex's `account/read` result (`GetAccountResponse`), read for the signed-in account's email
# and plan; S18's sign-in starts `codex app-server` through it.
clauseo-codex_appserver = { path = "../codex_appserver" }
async-channel = { workspace = true, features = ["std"] }
base64 = "0.22.1"
dunce = { workspace = true }
flate2 = "1.1.10"
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true, features = ["std"] }
tar = { version = "0.4.46", default-features = false }
thiserror = { workspace = true }
ureq = { version = "3.5.0", default-features = false, features = [
  "rustls",
  "platform-verifier",
] }
# The pasted sign-in code (S18) and the API keys (R20) are zeroed when dropped.
zeroize = { workspace = true }
zip = { version = "9.2.2", default-features = false, features = [
  "deflate-flate2",
] }

# The rustls ureq already uses (0.23.46): a TLS failure reaches `download` as an io error
# wrapping `rustls::Error`, and `testing`'s proxy terminates TLS with its server side.
rustls = { version = "0.23.46", default-features = false, features = [
  "ring",
  "std",
] }
# Test support only (see the feature above): MIT OR Apache-2.0.
rcgen = { version = "0.14.10", optional = true, default-features = false, features = [
  "crypto",
  "pem",
  "ring",
] }

# `keys`: keyring 4's `v1` feature picks the store per OS: Keychain Services on macOS, Credential
# Manager on Windows (and the Secret Service on Linux, which is why keyring is not a Linux
# dependency at all: Linux is not a product target, and `keys` there has no keychain).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
keyring = { workspace = true, features = ["v1"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Storage_FileSystem",
  # sysproxy: Internet Settings' ProxyEnable and ProxyServer.
  "Win32_System_Registry",
] }

[dev-dependencies]
# Itself with test-support, so the tests reach `InstallConfig::resolver` with no flag.
clauseo-agents = { path = ".", features = ["test-support"] }
clauseo-process = { path = "../process", features = ["test-support"] }
# The example finds the data folder as the app does.
clauseo-settings = { path = "../settings" }
# The sign-in tests run its Claude and Codex CLI modes as the adapters.
clauseo-fake_agent = { path = "../fake_agent" }

[lints]
workspace = true
