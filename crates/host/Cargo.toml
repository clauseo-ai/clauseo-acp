[package]
name = "clauseo-host"
version = "0.1.0"
description = "The Clauseo session host: one thread and executor serving commands, turns, coalescing, subscriptions and per-turn checkpoints."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exports `ManualClock`, `SequentialIds`, `HostConfig::with_patch_window_bytes`,
# `HostHandle::abort_for_test`, `TestProxy`, `HostConfig::with_browser_executable`,
# `HostConfig::profile_hook` and `HostConfig::agent_path_prepend` for this crate's tests and its
# dependents' tests.
test-support = []

[dependencies]
clauseo-protocol = { path = "../protocol" }
clauseo-reducer = { path = "../reducer" }
clauseo-store = { path = "../store" }
clauseo-matters = { path = "../matters" }
clauseo-process = { path = "../process" }
clauseo-acp = { path = "../acp" }
clauseo-settings = { path = "../settings" }
clauseo-limits = { path = "../limits" }
# The launch profile's placeholders and skill writes (decision record 0030).
clauseo-profile = { path = "../profile" }
# The anonymous usage counts' call sites and the privacy switches (decision record 0036).
clauseo-counts = { path = "../counts" }
clauseo-search = { path = "../search" }
# The browser's per-session socket folder and loopback port claims, and the start-up sweep
# (decision record 0029, stage C's `BrowserSocketDir` and `ports`), and the Windows folder check
# of a matter folder (src/agent/folder_support.rs).
clauseo-sandbox = { path = "../sandbox" }
# Random agent-browser session names on Windows (`browser/session.rs`).
getrandom = { workspace = true }
async-channel = { workspace = true, features = ["std"] }
async-io = { workspace = true }
# `executor` for `LocalPool` (QR11.2); the root line's default features include it already.
futures = { workspace = true, features = ["executor"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
tracing = { workspace = true }
thiserror = { workspace = true }
# The matter folder check on a prompt's file (std's canonicalize is banned in clippy.toml).
dunce = { workspace = true }
# The trust hash of the pre-write guard's Codex hook (agent/loads/codex.rs).
sha2 = { workspace = true }
# The pre-write guard's name check composes names (NFC) on macOS, as APFS compares them.
unicode-normalization = { workspace = true }

[dev-dependencies]
# Itself with test-support, so its tests reach ManualClock and SequentialIds with no flag.
clauseo-host = { path = ".", features = ["test-support"] }
clauseo-fake_agent = { path = "../fake_agent" }
# `pretend_word_running_since_epoch`: the tests' owner files stay held through the stale rule.
clauseo-matters = { path = "../matters", features = ["test-support"] }
# `running` and `kill`: the cancel tests watch the processes the agent started.
clauseo-process = { path = "../process", features = ["test-support"] }
clauseo-profile = { path = "../profile", features = ["test-support"] }
# The reopen bench's fixture.
clauseo-store = { path = "../store", features = ["test-support"] }
proptest = { workspace = true }
# The Word round trip test's reads of a .docx: its zip entry and the document's XML.
flate2 = { workspace = true }
quick-xml = { workspace = true }
# The search test that checks an aborted host closed search.sqlite (no connection left open).
rusqlite = { workspace = true }
criterion = { workspace = true }

# The host's Windows folder-check tests give a folder a protected DACL (`windows::test_dacl`).
[target.'cfg(windows)'.dev-dependencies]
clauseo-sandbox = { path = "../sandbox", features = ["test-support"] }

[[bench]]
name = "reopen"
harness = false

[lints]
workspace = true
