[profile.default]
slow-timeout = { period = "10s", terminate-after = 3 } # unit tests are fast; 30 s kills a hung test
fail-fast = false

# The `elevated_` tests (D-B16, split §8) make and delete local accounts, groups and HKLM keys,
# so they run one at a time whatever --test-threads says. Set in default, so ci and quarantine
# inherit it; CI's elevated step also passes --test-threads 1.
[test-groups]
elevated = { max-threads = 1 }
real-chrome = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(/(^|::)elevated_/)'
test-group = 'elevated'

# The store's tests wait on real syncs (synchronous=FULL), so they run at the disk's speed, not
# the CPU's. On the Windows runner the disk once stalled for about 140 s (issue #83, run
# 41131302912 attempt 1): store tests were 25 to 57 times slower from 21:37:38 to 21:39:16, and
# xtask tests that write to the temp folder stayed slow until about 21:40:00, while tests that
# touch no disk kept their speed. A test slowed only while a stall of S seconds lasts ends within
# S plus its usual time, whatever the slowdown: 140 s plus 8.9 s, the slowest store test on a good
# Windows run before #83's fixes, is under 160 s. A hung test still ends there.
# Applies to the ci profile too, which inherits default's overrides.
[[profile.default.overrides]]
filter = 'package(clauseo-store)'
slow-timeout = { period = "10s", terminate-after = 16 }

# The desktop tests that start a host run at the disk's speed too: each first start makes the
# store and the Scratch matter, 16 new files and 32 syncs. In run 41676394591 (merge group for
# #282) the Windows runner's disk stalled for about 165 s from the start of the run (issue #83):
# every test that touched the disk ran 30 to 110 times slower and the rest at their usual speed,
# and seven of these tests, 0.3 to 0.5 s on a good run, passed 30 s on both tries. The store's
# 160 s bound holds them too; each of their waits has its own 120 s bound
# (`test_support::STEP_WAIT`), so a hung one fails naming its step before nextest kills it. The
# rest of the crate keeps 30 s.
[[profile.default.overrides]]
filter = 'package(clauseo-desktop) & test(/^(bridge::tests|host_start::tests|settings_window::tests|commands::tests|test_support)::/)'
slow-timeout = { period = "10s", terminate-after = 16 }

# The agents install tests are the first in the run to touch the disk and start processes
# (node --version, npm ci): they start about 2 to 20 s into it, right after the test build. On
# the Windows runner something stalls them all at once early in some runs and frees them all at
# the same instant: in run 41840642164 (merge group, 4 slots all install tests) from 14:12:25 to
# 14:15:56, so 11 tests passed 30 s on both tries; in runs 41766104932, 41779592803, 41784225212
# and 41839450755 for 25 to 55 s, one retry each. low_disk_is_disk_full_before_any_request, which
# makes no request and runs no npm, was among them; the same tests take 0.1 to 4.4 s on a good
# Windows run (41834252183). It is the issue #83 shape, so the store's 160 s bound applies. Each
# test's stderr names its phases with UTC times (`testing::trace`), so a timeout shows where the
# time went.
[[profile.default.overrides]]
filter = 'package(clauseo-agents) & binary(install)'
slow-timeout = { period = "10s", terminate-after = 16 }

# G16's live tests read real accounts: the Claude reader's own 25 s and the Codex reader's 10 s
# timeouts, plus Node's and the vendor CLI's start-up, overrun 30 s; 90 s still ends a hung read.
[[profile.default.overrides]]
filter = 'package(clauseo-limits) & binary(live)'
slow-timeout = { period = "30s", terminate-after = 3 }

# The sandbox's 20,000-link jail tests write 40,000 files each before they time the walk and
# the jailed start (about 8 s on an idle Mac mini); 90 s still ends a hung one.
[[profile.default.overrides]]
filter = 'package(clauseo-sandbox) & binary(jail) & test(/twenty_thousand/)'
slow-timeout = { period = "30s", terminate-after = 3 }

# The sandbox's tier B timing row (ignored; run on a Windows VM with --run-ignored) makes 50,000
# files, then times three walks over them: about 11 s, 10 s and 10 s each on the S15 PR3 VM run at
# fca0bf0ca, plus the file creation, so 30 s killed it on 3 of 3 tries. 600 s still ends a hung one.
[[profile.default.overrides]]
filter = 'package(clauseo-sandbox) & test(=windows::apply::ntfs_tests::timing_first_propagation_and_fix_costs)'
slow-timeout = { period = "60s", terminate-after = 10 }

# host's window-specs test launches the host and fake_agent once for every scenario the window's
# e2e specs play, one after another, so it grows with each new spec: about 2.3 s on Linux and
# macOS, 15 s on the Windows x64 runner, and past 30 s on both tries on Windows ARM64 (merge
# group run 41827767038, for #352). 90 s still ends a hung one.
[[profile.default.overrides]]
filter = 'package(clauseo-host) & binary(host) & test(/^e2e_scenarios::/)'
slow-timeout = { period = "30s", terminate-after = 3 }

# counts' compile-fail test runs trybuild, which checks the crate and its dev-dependencies (the
# windows crate, protocol, settings, proptest) in a target folder of its own before it compiles
# each case. On the Windows runner that alone took 16 s and the whole test passed 30 s (PR #259,
# run 41608436654, both tries); a cold local run on Linux took 215 s. 240 s still ends a hung one.
# That build is a full cargo build, which takes every core it can get, so the test runs alone:
# in the merge-group run 41712908024 on Windows it overlapped host's relaunch tests, which are
# sensitive to timing, and starved them of CPU until both failed at relaunch.rs:97 on both tries.
[[profile.default.overrides]]
filter = 'package(clauseo-counts) & binary(closed)'
slow-timeout = { period = "60s", terminate-after = 4 }
threads-required = "num-cpus"

# xtask's buildtime tests that run real cargo builds in a fresh worktree or target folder: a few
# seconds on Linux, but on the loaded Windows runner four of them passed 30 s on both tries and
# ejected #350's merge group (run 41871459180), as they had flaked on 11-03; core_io's clippy test,
# which runs clippy on a planted crate, passed 30 s on both tries on Windows x64 in #379's run
# (job 126782296836). Slow by design, not flaky, so a longer bound instead of quarantine; 120 s
# still ends a hung one.
[[profile.default.overrides]]
filter = 'package(xtask) & (test(/^buildtime::(worktree|profile)::tests::/) | test(/^checks::core_io::tests::clippy::/))'
slow-timeout = { period = "30s", terminate-after = 4 }

# The guard's real-Chrome tests (crates/mcp/tests/guard/real_chrome.rs; they run where
# CLAUSEO_TEST_AGENT_BROWSER is set, CI's Linux job) each start Chrome, 11 or 12 processes. Run side
# by side on the loaded runner, Chrome took more than 10 s to listen once its start was logged, and
# a_guard_killed_while_chrome_starts_leaves_no_chrome failed its first try in four merge groups
# after #534 (first run 42223670975). They run one at a time; the test's wait for Chrome to listen
# is 60 s, and 120 s still ends a hung one.
[[profile.default.overrides]]
filter = 'package(clauseo-mcp) & binary(guard) & test(/^real_chrome::/)'
slow-timeout = { period = "30s", terminate-after = 4 }
test-group = 'real-chrome'

[profile.ci]
# One retry in CI only (local runs use the default profile and keep none), so a test that fails
# once under the runner's load does not eject a pull request from the merge queue. Flakes are still
# bugs: a test that passes only on its retry shows as FLAKY in the log and in junit.xml, and goes on
# the flaky-test tracking issue for its owner to fix. Reproduce with SEED.
retries = 1
failure-output = "immediate-final"
junit = { path = "junit.xml" }

# Quarantine: tests that failed and then passed on their retry, or ejected a merge group they had
# nothing to do with, are left out of the ci profile (pull requests, merge groups, main's push and
# the pre-push hook's CI mode) until their owner fixes them; the nightly `quarantine` job in ci.yml
# still runs them (profile quarantine below), so it shows when one is fixed. Each entry names its
# tracking issue; an entry comes out in the fix's pull request. The same expression is in both
# profiles: keep them equal.
#   - xtask::bin/xtask process::tests::tree::a_leftover_gets_sigterm_when_the_command_exits_and_the_run_ends_when_it_does: failed then passed on retry 1 time since 2026-11-04; first https://github.com/clauseo-ai/clauseo-acp/actions/runs/41912294482/job/126862999903 (autoquarantine)
#   - clauseo-mcp::guard real_chrome::a_guard_killed_while_chrome_starts_leaves_no_chrome: failed then passed on retry 1 time since 2026-11-06; first https://github.com/clauseo-ai/clauseo-acp/actions/runs/42261112174/job/128041078438 (autoquarantine)
default-filter = 'not (package(xtask) & binary(xtask) & test(=process::tests::tree::a_leftover_gets_sigterm_when_the_command_exits_and_the_run_ends_when_it_does) | package(clauseo-mcp) & binary(guard) & test(=real_chrome::a_guard_killed_while_chrome_starts_leaves_no_chrome))'
# The Windows overrides are their profile's line plus the tests quarantined on Windows
# only; the hourly auto-quarantine reads and writes all four lines, so keep them.
[[profile.ci.overrides]]
platform = 'cfg(windows)'
default-filter = 'not (package(xtask) & binary(xtask) & test(=process::tests::tree::a_leftover_gets_sigterm_when_the_command_exits_and_the_run_ends_when_it_does) | package(clauseo-mcp) & binary(guard) & test(=real_chrome::a_guard_killed_while_chrome_starts_leaves_no_chrome))'

# The quarantined tests alone (see profile ci), run nightly by ci.yml's `quarantine` job, with the
# ci profile's timeouts and retry, so a fixed one shows as passing.
[profile.quarantine]
retries = 1
failure-output = "immediate-final"
default-filter = 'package(xtask) & binary(xtask) & test(=process::tests::tree::a_leftover_gets_sigterm_when_the_command_exits_and_the_run_ends_when_it_does) | package(clauseo-mcp) & binary(guard) & test(=real_chrome::a_guard_killed_while_chrome_starts_leaves_no_chrome)'
[[profile.quarantine.overrides]]
platform = 'cfg(windows)'
default-filter = 'package(xtask) & binary(xtask) & test(=process::tests::tree::a_leftover_gets_sigterm_when_the_command_exits_and_the_run_ends_when_it_does) | package(clauseo-mcp) & binary(guard) & test(=real_chrome::a_guard_killed_while_chrome_starts_leaves_no_chrome)'
