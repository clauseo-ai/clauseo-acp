[profile.default]
slow-timeout = { period = "10s", terminate-after = 3 } # unit tests are fast; 30 s kills a hung test
fail-fast = false

# The store's tests wait on real syncs (synchronous=FULL), so they run at the disk's speed, not
# the CPU's. On the Windows runner the disk once stalled for about 140 s (issue #83, run
# 41131302912 attempt 1): store tests were 25 to 57 times slower from 21:37:38 to 21:39:16, and
# xtask tests that write to the temp folder stayed slow until about 21:40:00, while tests that
# touch no disk kept their speed. A test slowed only while a stall of S seconds lasts ends within
# S plus its usual time, whatever the slowdown: 140 s plus 8.9 s, the slowest store test on a good
# Windows run before #83's fixes, is under 160 s. A hung test still ends there.
# Applies to the ci profile too, which inherits default's overrides.
[[profile.default.overrides]]
filter = 'package(clauseo-store)'
slow-timeout = { period = "10s", terminate-after = 16 }

# The desktop tests that start a host run at the disk's speed too: each first start makes the
# store and the Scratch matter, 16 new files and 32 syncs. In run 41676394591 (merge group for
# #282) the Windows runner's disk stalled for about 165 s from the start of the run (issue #83):
# every test that touched the disk ran 30 to 110 times slower and the rest at their usual speed,
# and seven of these tests, 0.3 to 0.5 s on a good run, passed 30 s on both tries. The store's
# 160 s bound holds them too; each of their waits has its own 120 s bound
# (`test_support::STEP_WAIT`), so a hung one fails naming its step before nextest kills it. The
# rest of the crate keeps 30 s.
[[profile.default.overrides]]
filter = 'package(clauseo-desktop) & test(/^(bridge::tests|host_start::tests|settings_window::tests|commands::tests|test_support)::/)'
slow-timeout = { period = "10s", terminate-after = 16 }

# G16's live tests read real accounts: the Claude reader's own 25 s and the Codex reader's 10 s
# timeouts, plus Node's and the vendor CLI's start-up, overrun 30 s; 90 s still ends a hung read.
[[profile.default.overrides]]
filter = 'package(clauseo-limits) & binary(live)'
slow-timeout = { period = "30s", terminate-after = 3 }

# The sandbox's 20,000-link jail tests write 40,000 files each before they time the walk and
# the jailed start (about 8 s on an idle Mac mini); 90 s still ends a hung one.
[[profile.default.overrides]]
filter = 'package(clauseo-sandbox) & binary(jail) & test(/twenty_thousand/)'
slow-timeout = { period = "30s", terminate-after = 3 }

[profile.ci]
# One retry in CI only (local runs use the default profile and keep none), so a test that fails
# once under the runner's load does not eject a pull request from the merge queue. Flakes are still
# bugs: a test that passes only on its retry shows as FLAKY in the log and in junit.xml, and goes on
# the flaky-test tracking issue for its owner to fix. Reproduce with SEED.
retries = 1
failure-output = "immediate-final"
junit = { path = "junit.xml" }
