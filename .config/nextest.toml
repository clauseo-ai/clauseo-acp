[profile.default]
slow-timeout = { period = "10s", terminate-after = 3 } # unit tests are fast; 30 s kills a hung test
fail-fast = false

# The store's tests wait on real syncs (synchronous=FULL), so they run at the disk's speed, not
# the CPU's. On the Windows runner the disk once stalled for about 140 s (issue #83, run
# 41131302912 attempt 1): store tests were 25 to 57 times slower from 21:37:38 to 21:39:16, and
# xtask tests that write to the temp folder stayed slow until about 21:40:00, while tests that
# touch no disk kept their speed. A test slowed only while a stall of S seconds lasts ends within
# S plus its usual time, whatever the slowdown: 140 s plus 8.9 s, the slowest store test on a good
# Windows run before #83's fixes, is under 160 s. A hung test still ends there.
# Applies to the ci profile too, which inherits default's overrides.
[[profile.default.overrides]]
filter = 'package(clauseo-store)'
slow-timeout = { period = "10s", terminate-after = 16 }

# The desktop tests that start a host run at the disk's speed too: each first start makes the
# store and the Scratch matter, 16 new files and 32 syncs. In run 41676394591 (merge group for
# #282) the Windows runner's disk stalled for about 165 s from the start of the run (issue #83):
# every test that touched the disk ran 30 to 110 times slower and the rest at their usual speed,
# and seven of these tests, 0.3 to 0.5 s on a good run, passed 30 s on both tries. The store's
# 160 s bound holds them too; each of their waits has its own 120 s bound
# (`test_support::STEP_WAIT`), so a hung one fails naming its step before nextest kills it. The
# rest of the crate keeps 30 s.
[[profile.default.overrides]]
filter = 'package(clauseo-desktop) & test(/^(bridge::tests|host_start::tests|settings_window::tests|commands::tests|test_support)::/)'
slow-timeout = { period = "10s", terminate-after = 16 }

# G16's live tests read real accounts: the Claude reader's own 25 s and the Codex reader's 10 s
# timeouts, plus Node's and the vendor CLI's start-up, overrun 30 s; 90 s still ends a hung read.
[[profile.default.overrides]]
filter = 'package(clauseo-limits) & binary(live)'
slow-timeout = { period = "30s", terminate-after = 3 }

# The sandbox's 20,000-link jail tests write 40,000 files each before they time the walk and
# the jailed start (about 8 s on an idle Mac mini); 90 s still ends a hung one.
[[profile.default.overrides]]
filter = 'package(clauseo-sandbox) & binary(jail) & test(/twenty_thousand/)'
slow-timeout = { period = "30s", terminate-after = 3 }

# counts' compile-fail test runs trybuild, which checks the crate and its dev-dependencies (the
# windows crate, protocol, settings, proptest) in a target folder of its own before it compiles
# each case. On the Windows runner that alone took 16 s and the whole test passed 30 s (PR #259,
# run 41608436654, both tries); a cold local run on Linux took 215 s. 240 s still ends a hung one.
# That build is a full cargo build, which takes every core it can get, so the test runs alone:
# in the merge-group run 41712908024 on Windows it overlapped host's relaunch tests, which are
# sensitive to timing, and starved them of CPU until both failed at relaunch.rs:97 on both tries.
[[profile.default.overrides]]
filter = 'package(clauseo-counts) & binary(closed)'
slow-timeout = { period = "60s", terminate-after = 4 }
threads-required = "num-cpus"

[profile.ci]
# One retry in CI only (local runs use the default profile and keep none), so a test that fails
# once under the runner's load does not eject a pull request from the merge queue. Flakes are still
# bugs: a test that passes only on its retry shows as FLAKY in the log and in junit.xml, and goes on
# the flaky-test tracking issue for its owner to fix. Reproduce with SEED.
retries = 1
failure-output = "immediate-final"
junit = { path = "junit.xml" }

# Quarantine: tests that failed and then passed on their retry, or ejected a merge group they had
# nothing to do with, are left out of the ci profile (pull requests, merge groups, main's push and
# the pre-push hook's CI mode) until their owner fixes them; the nightly `quarantine` job in ci.yml
# still runs them (profile quarantine below), so it shows when one is fixed. Each entry names its
# tracking issue; an entry comes out in the fix's pull request. The same expression is in both
# profiles: keep them equal.
#   - agents install tests: stall all at once on loaded runners, 11 timed out on Windows x64 in
#     run 41840642164 (stage D's #366 gives them 160 s)
#   - host search supersede race: search.rs:323 before the index settles (host's fix in progress)
#   - host window-specs scenarios: past 30 s on Windows ARM64 (#357 gives them 90 s)
#   - sandbox proxy limits: a freed port reused before the refused-connect check (stage C's #358)
#   - desktop bridge cap: flaky on 11-04
default-filter = 'not (package(clauseo-agents) & binary(install) | package(clauseo-host) & binary(host) & test(=search::a_newer_search_cancels_older_ones_and_a_late_answer_is_dropped) | package(clauseo-host) & binary(host) & test(/^e2e_scenarios::/) | package(clauseo-sandbox) & test(=proxy::tests::limits::dropping_the_handle_closes_both_ports_and_every_tunnel) | package(clauseo-desktop) & test(=bridge::tests::past_the_cap_the_driver_pauses_and_resubscribes_once_acks_catch_up))'

# The quarantined tests alone (see profile ci), run nightly by ci.yml's `quarantine` job, with the
# ci profile's timeouts and retry, so a fixed one shows as passing.
[profile.quarantine]
retries = 1
failure-output = "immediate-final"
default-filter = 'package(clauseo-agents) & binary(install) | package(clauseo-host) & binary(host) & test(=search::a_newer_search_cancels_older_ones_and_a_late_answer_is_dropped) | package(clauseo-host) & binary(host) & test(/^e2e_scenarios::/) | package(clauseo-sandbox) & test(=proxy::tests::limits::dropping_the_handle_closes_both_ports_and_every_tunnel) | package(clauseo-desktop) & test(=bridge::tests::past_the_cap_the_driver_pauses_and_resubscribes_once_acks_catch_up)'
