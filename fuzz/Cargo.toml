[package]
name = "clauseo-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace, so the repo's root workspace never builds or resolves this crate.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
clauseo-acp = { path = "../crates/acp", features = ["fuzzing"] }
clauseo-protocol = { path = "../crates/protocol" }
clauseo-reducer = { path = "../crates/reducer" }
clauseo-store = { path = "../crates/store" }
clauseo-settings = { path = "../crates/settings" }
clauseo-matters = { path = "../crates/matters" }
futures = "0.3.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
serde_json_lenient = "0.2"
rmp-serde = "1.3.1"
rusqlite = { version = "0.41", features = ["bundled", "blob"] }
zstd = { version = "0.14.3", default-features = false }
sha1_smol = "1"
# zip_marks: the tracked-changes scan's own dependencies, at clauseo-host's versions and features
# (zip_marks.rs compiles crates/host/src/revisions/marks.rs as a module), and roxmltree, the
# oracle's XML parser, which shares no code with quick-xml.
zip = { version = "9.2.2", default-features = false, features = [
  "deflate-flate2",
] }
# as clauseo-host has it: its default features give zip's deflate a backend
flate2 = "1.1.10"
quick-xml = "0.42.0"
roxmltree = "0.21"

[profile.release]
debug = 1

[[bin]]
name = "acp_stdout"
path = "fuzz_targets/acp_stdout.rs"
test = false
doc = false
bench = false

[[bin]]
name = "acp_skipped_update"
path = "fuzz_targets/acp_skipped_update.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_decode"
path = "fuzz_targets/protocol_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reducer_snapshot"
path = "fuzz_targets/reducer_snapshot.rs"
test = false
doc = false
bench = false

[[bin]]
name = "store_read"
path = "fuzz_targets/store_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "settings_parse"
path = "fuzz_targets/settings_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "matters_read"
path = "fuzz_targets/matters_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "matters_objects"
path = "fuzz_targets/matters_objects.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zip_marks"
path = "fuzz_targets/zip_marks.rs"
test = false
doc = false
bench = false
