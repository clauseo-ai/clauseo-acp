[package]
name = "clauseo-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace, so the repo's root workspace never builds or resolves this crate.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
clauseo-acp = { path = "../crates/acp" }
clauseo-protocol = { path = "../crates/protocol" }
clauseo-reducer = { path = "../crates/reducer" }
clauseo-store = { path = "../crates/store" }
clauseo-settings = { path = "../crates/settings" }
clauseo-matters = { path = "../crates/matters" }
futures = "0.3.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
serde_json_lenient = "0.2"
rmp-serde = "1.3.1"
rusqlite = { version = "0.40", features = ["bundled", "blob"] }
zstd = { version = "0.14.3", default-features = false }
sha1_smol = "1"

# The repo's clippy.toml bans the std file calls that write through the crate's write module.
# The harnesses write only their own fixtures and scratch folders, so they allow those calls.
[lints.clippy]
disallowed_methods = "allow"

[profile.release]
debug = 1

[[bin]]
name = "acp_stdout"
path = "fuzz_targets/acp_stdout.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_decode"
path = "fuzz_targets/protocol_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reducer_snapshot"
path = "fuzz_targets/reducer_snapshot.rs"
test = false
doc = false
bench = false

[[bin]]
name = "store_read"
path = "fuzz_targets/store_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "settings_parse"
path = "fuzz_targets/settings_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "matters_read"
path = "fuzz_targets/matters_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "matters_objects"
path = "fuzz_targets/matters_objects.rs"
test = false
doc = false
bench = false
