[graph]
all-features = true
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]

[advisories]
yanked = "deny"
# Each ignore entry: { id = "RUSTSEC-…", reason = "…, revisit by YYYY-MM-DD" }
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained; linux only, via glib-macros 0.18 -> gtk 0.18 -> muda -> tauri, revisit by 2027-01-18" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained (merged into zbus 6); linux only, via zbus 5 -> tauri-plugin-notification, -opener, -single-instance, revisit by 2027-01-18" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained (merged into zbus 6); linux only, via zbus 5 -> tauri-plugin-notification, -opener, -single-instance, revisit by 2027-01-18" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained (merged into zbus 6); linux only, via zvariant 5 -> zbus 5 -> tauri-plugin-notification, -opener, -single-instance, revisit by 2027-01-18" },
]

[licenses]
# Each licence must allow distribution inside a GPL-3.0 binary.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",                        # file-level copyleft, compatible with GPL-3 via its secondary-licence clause
  "CDLA-Permissive-2.0",
]
# Not allowed: every copyleft licence (GPL, LGPL, AGPL in any version), so a build can always also
# ship under other terms. MPL-2.0 above is the one exception: its copyleft stays inside its own files.
# Also out: SSPL, BUSL, CC-BY-NC and any "Commons Clause" (not open source), and OpenSSL/SSLeay (the old
# OpenSSL licence is GPL-incompatible per the FSF).
confidence-threshold = 0.93
private = { ignore = true } # our publish = false crates

[bans]
multiple-versions = "warn" # Tauri pulls duplicates; review the list at each toolchain bump.
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "openssl-sys", reason = "use rustls; no system OpenSSL on Windows laptops" },
  # zbus 5 (linux D-Bus, via tauri-plugin-notification, -opener, -single-instance) is the one crate allowed to use it.
  { crate = "async-trait", wrappers = [
    "zbus",
  ], reason = "house style: no async traits across crates" },
  { crate = "rust-ini@>=0.21.3", reason = "deep-link 2.6.2 fails on Linux; drop when deep-link 2.6.3 is out" },
]

# devtools let script in the page open the inspector, and `protocol-asset` serves files from disk to
# the webview. cargo-deny checks the features cargo resolves for every target above, so a crate that
# turns one on anywhere in the graph (a registry, git or excluded path crate included) fails here.
[[bans.features]]
crate = "tauri"
deny = ["devtools", "protocol-asset"]

[[bans.features]]
crate = "tauri-runtime"
deny = ["devtools"]

[[bans.features]]
crate = "tauri-runtime-wry"
deny = ["devtools"]

[[bans.features]]
crate = "wry"
deny = ["devtools"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
