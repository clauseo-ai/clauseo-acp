[graph]
all-features = true
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]

[advisories]
yanked = "deny"
# Each ignore entry: { id = "RUSTSEC-…", reason = "…, revisit by YYYY-MM-DD" }
ignore = []

[licenses]
# Each licence must allow distribution inside a GPL-3.0 binary. No LGPL or GPL dependencies, so a
# build can always also ship under other terms.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",                        # file-level copyleft, compatible with GPL-3 via its secondary-licence clause
  "CDLA-Permissive-2.0",
]
# Not allowed: AGPL-3.0 (network clause would bind every firm deployment; Zed bans it too),
# GPL-2.0-only and LGPL-2.1-only (incompatible with GPL-3), SSPL, BUSL, OpenSSL/SSLeay (old OpenSSL licence
# is GPL-incompatible per the FSF; Zed allows it, we do not), CC-BY-NC, any "Commons Clause".
confidence-threshold = 0.93
private = { ignore = true } # our publish = false crates

[bans]
multiple-versions = "warn" # Tauri pulls duplicates; review the list at each toolchain bump.
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "openssl-sys", reason = "use rustls; no system OpenSSL on Windows laptops" },
  { crate = "async-trait", reason = "house style: no async traits across crates" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
