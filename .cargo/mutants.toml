# cargo-mutants reads this file by default (cargo-mutants 27.1.0, src/config.rs:104,
# `read_tree_config` joins `.cargo/mutants.toml` to the workspace root). `cargo xtask mutants`
# runs it on the lines a branch changed; see xtask/src/mutants.rs.
#
# Every exclusion (`exclude_re`, `exclude_globs`) needs a comment saying why no test can tell the
# mutant apart, and the code owner approves it (CODEOWNERS: /.cargo/).

# The tests run nextest, as `cargo xtask check` does, so they see .config/nextest.toml.
test_tool = "nextest"

# A mutant is caught at its first failing test; running the rest of the suite only costs time.
# .config/nextest.toml sets fail-fast = false for people, and this flag overrides it here.
additional_cargo_test_args = ["--fail-fast"]

# No `features`: they would go to every mutant's build, and cargo refuses a protocol feature for
# any other package, so every xtask or desktop mutant would come back unviable. Only
# crates/protocol/src/wire.rs needs protocol's specta feature (`WireFormat` and its tests);
# `cargo xtask mutants` leaves it out of the main pass and mutates it in a second pass with the
# feature on (xtask/src/mutants/pass.rs).

# Each build runs in a copy of the tree. Leave out what .gitignore leaves out (target/,
# node_modules/, dist/), which would otherwise be copied for every job: the default is false.
gitignore = true

# Copy `.git` too: xtask's tests list the repo with `git ls-files` and read the merge-base with
# origin/main, which fail in a copy without it. The default is false.
copy_vcs = true

# xtask/src/process/windows.rs is compiled only for Windows (`#[cfg(windows)]` in process.rs), so
# on macOS and Linux, where `cargo xtask mutants` runs, a mutant there builds the same binary and no
# test can tell it apart. Its code runs only in a Windows build (S1's Windows CI job).
# crates/desktop/src/e2e.rs is the same: it is compiled only for Windows with the `e2e` feature
# (`#[cfg(all(windows, feature = "e2e"))]` in lib.rs). Its code runs only in e2e-windows.yml, whose
# smoke test checks the webview arguments it passes.
#
# Likewise each OS shim of clauseo-settings is compiled for its OS only (`#[cfg(windows)]` or
# `#[cfg(target_os = "macos")]` on the `mod` line), and its read-only tests run in the Windows CI
# jobs and on macOS. The parsers they feed are in other files and are mutated as usual.
exclude_globs = [
  "xtask/src/process/windows.rs",
  "crates/desktop/src/e2e.rs",
  "crates/settings/src/policy/windows.rs",
  "crates/settings/src/policy/macos.rs",
  "crates/settings/src/system/windows.rs",
]

# No test can make these happen without fault injection in std (xtask/src/process/running.rs):
# - `Running::keep` only keeps the error of a failed pipe read, wait or killpg, which a live
#   child's pipes and group never give.
# - `read_all` retries a read that failed with EINTR, which `interrupted` tells apart. xtask
#   installs no signal handler, so a pipe read is never interrupted and the retry never runs.
#   Only the mutants of `interrupted` and of the match guard that calls it are excluded; any
#   other comparison in `read_all` is still mutated.
exclude_re = [
  'running\.rs:\d+:\d+: replace Running::keep with \(\)$',
  'running\.rs:\d+:\d+: replace match guard interrupted\(&error\) with (true|false) in read_all$',
  'running\.rs:\d+:\d+: replace interrupted -> bool with (true|false)$',
  'running\.rs:\d+:\d+: replace == with != in interrupted$',
  # `open_main_window` runs only when the app starts, and no test of the desktop crate starts the
  # app. Replaced with `Ok(())`, the app opens no window; e2e-windows.yml's smoke test catches that
  # (no `#app-root`), but on Windows only, outside the mutants run.
  'crates/desktop/src/lib\.rs:\d+:\d+: replace open_main_window -> tauri::Result<\(\)> with Ok\(\(\)\)$',
  # Protocol (crates/protocol). No test can tell these mutants apart from the code:
  # - `BlobHash::from_str` joins a high and a low hex digit with `(high << 4) | low`. Each digit is
  #   0 to 15 (`hex_value` gives 0-9 and 10-15), so the high digit's low four bits are zero and
  #   `|` and `^` give the same byte for every input. (`+` would too, but cargo-mutants never
  #   turns `|` into `+`: it replaces `|` only with `^` and `&`, and `&` is caught.)
  'ids\.rs:\d+:\d+: replace \| with \^ in <impl FromStr for BlobHash>::from_str$',
  # clauseo-settings' `SystemDirs` (crates/settings/src/system.rs) asks the real OS for its
  # folders. Off Windows, `home` is `std::env::home_dir`, which no test may read (tests read no
  # real home folder), and `known_folder` returns `None` with no caller there; on Windows both
  # call the known-folder shim excluded above.
  'crates/settings/src/system\.rs:\d+:\d+: replace <impl PlatformDirs for SystemDirs>::(home|known_folder) -> Option<PathBuf> with ',
  # clauseo-settings' `write_atomic` (crates/settings/src/files.rs) reads the target's metadata to
  # keep its permissions, and only a non-NotFound error from that read reaches the arm this
  # mutant makes `false`. `link_target` made the same call on the same path just before, so that
  # error needs a race between the two calls or an I/O fault. No test makes one without fault
  # injection, and EACCES on the file itself needs no read permission for metadata.
  'crates/settings/src/files\.rs:\d+:\d+: replace match guard error\.kind\(\) != io::ErrorKind::NotFound with false in <impl Files for SystemFiles>::write_atomic$',
  # crates/acp/src/line.rs, `LineSplitter`'s read buffer (`READ_BUFFER_BYTES`, 64 KiB): its size only
  # changes how many reads a line takes. The splitter keeps lines whole across reads and checks the cap
  # on the joined line, so only speed changes. The column is pinned because the name has no function
  # to tell it apart from the `* with +` on `MAX_LINE_BYTES`, which a test catches.
  'crates/acp/src/line\.rs:\d+:37: replace \* with \+$',
  # crates/acp/src/line.rs, `LineSplitter::next_line`: the check that a line fits in one buffer (`partial`
  # empty) can never fire. `fill_buf` returns at most 64 KiB, below `MAX_LINE_BYTES`, so `>`, `==` and
  # `>=` are all false. Longer lines are checked through `partial`, which the existing tests catch.
  # The line pin keeps the `partial` checks below it (which tests catch) mutated. If the code
  # moves, the entry stops matching and the mutant comes back as missed, not hidden.
  'crates/acp/src/line\.rs:164:35: replace > with (==|>=) in LineSplitter<R>::next_line$',
  # crates/acp/src/map.rs, `quarantine_unknown_blocks`: schema 1.11.0 decodes `CompactionUpdate.summary`
  # so an unknown block is skipped, never an error, and the summary is not mapped. The arm matters only
  # if the SDK's decode gets stricter; re-check on an SDK bump.
  'crates/acp/src/map\.rs:\d+:\d+: delete match arm Some\("compaction_update"\) in quarantine_unknown_blocks$',
  # crates/acp/src/map.rs, `push_parts`: for a text of exactly `MAX_TEXT_CHUNK_BYTES`, `split_text` returns
  # one part equal to the text, so the host gets the same event either way. Only an extra copy differs.
  'crates/acp/src/map\.rs:\d+:\d+: replace > with >= in push_parts$',
  # crates/acp/src/driver.rs, `Debug for Driver`: the output is the fixed word `Driver`, and nothing
  # formats a `Driver` with Debug, so no behaviour depends on it. Only a test of the wording itself
  # could tell the mutant apart.
  'crates/acp/src/driver\.rs:\d+:\d+: replace <impl std::fmt::Debug for Driver>::fmt -> std::fmt::Result with Ok\(Default::default\(\)\)$',
  # crates/acp/src/line/envelope.rs, `EnvelopeVisitor::expecting`: it only builds the text of a
  # serde type error, and `incoming` drops that error, so no behaviour depends on the text. Only a
  # test of serde's error wording could tell the mutant apart.
  'crates/acp/src/line/envelope\.rs:\d+:\d+: replace <impl Visitor<\x27de> for EnvelopeVisitor>::expecting -> fmt::Result with Ok\(Default::default\(\)\)$',
  # crates/acp/src/line/envelope.rs, `KeyVisitor::expecting`: JSON object keys are always
  # strings, so no type error is reported through it, and `incoming` would drop the text anyway.
  # Only a test of serde's error wording could tell the mutant apart.
  'crates/acp/src/line/envelope\.rs:\d+:\d+: replace <impl Visitor<\x27_> for KeyVisitor>::expecting -> fmt::Result with Ok\(Default::default\(\)\)$',
  # crates/acp/src/line/envelope.rs, `ShapeOf::expecting`: `ShapeOf` handles every JSON type through
  # `deserialize_any`, so no type error happens, and `incoming` would drop the text anyway. Only a
  # test of serde's error wording could tell the mutant apart.
  'crates/acp/src/line/envelope\.rs:\d+:\d+: replace <impl Visitor<\x27de> for ShapeOf>::expecting -> fmt::Result with Ok\(Default::default\(\)\)$',
  # crates/process/src/stderr.rs, `READ` (the pump's read size): equivalent apart from speed. The size
  # only sizes the pump's buffer; every byte still goes into the ring in order, and `LineSplitter` cuts
  # lines at `MAX_LINE` however the bytes arrive. The column is pinned because the `* with +` on
  # `MAX_LINE` (`16 * 1024`) is a different mutant, and a test catches it.
  'crates/process/src/stderr\.rs:\d+:24: replace \* with \+$',
  # crates/reducer/src/split.rs, `cut`: the condition is only a shortcut before the char walk below, which
  # gives the same split when the shortcut is skipped.
  'crates/reducer/src/split\.rs:\d+:\d+: replace \|\| with && in cut$',
  # crates/reducer/src/split.rs, `cut`: with `text.len() > budget` the second clause can never be true
  # (escaping never shortens text), so the char walk runs for every text the shortcut misses, and gives
  # the same split.
  'crates/reducer/src/split\.rs:\d+:24: replace <= with > in cut$',
  # crates/reducer/src/snapshot.rs, `DurableEntries::serialize`: `durable_len <= text.len()` always holds,
  # so the extra cases are wholly durable texts, written through `DurableText` with the whole text. Same bytes.
  'crates/reducer/src/snapshot\.rs:\d+:\d+: replace match guard meta\.durable_len < text\.text\.len\(\) with true in <impl Serialize for DurableEntries<\x27_>>::serialize$',
  # crates/reducer/src/snapshot.rs, `DurableEntries::serialize`: `<=` only adds `durable_len == len`, written
  # through `DurableText` with the whole text, so the bytes are the same.
  'crates/reducer/src/snapshot\.rs:\d+:\d+: replace < with <= in <impl Serialize for DurableEntries<\x27_>>::serialize$',
  # crates/store/src/codec.rs, `key`: `stream_id << 32` has its low 32 bits zero and `seq` is a `u32`, so
  # `|` and `^` give the same bits for every input `key` accepts.
  'crates/store/src/codec\.rs:\d+:\d+: replace \| with \^ in key$',
  # crates/store/src/fixtures.rs, `reopen_20k`: the loop's `start` is only ever 1 + 250k, 18,002 or
  # 18,251 + 250k, never a multiple of 250, so `(start + 1) / 250` and `(start - 1) / 250` agree for every
  # value it takes, and `start / 250` agrees with `(start - 1) / 250` for the same reason.
  'crates/store/src/fixtures\.rs:\d+:31: replace - with (\+|/) in reopen_20k$',
  # crates/store/src/fixtures.rs, `text`: the loop stops once the text reaches 400 bytes, the
  # mutant's (`<=`) once it passes 400, and `truncate(400)` then gives the same 400-byte prefix of
  # the same repeated sentence.
  'crates/store/src/fixtures\.rs:\d+:\d+: replace < with <= in text$',
  # crates/store/src/read.rs, `rows`: `capacity` is only `Vec::with_capacity`'s hint (capped at 65,536),
  # so the rows read and returned are the same for every value of it.
  'crates/store/src/read\.rs:\d+:\d+: replace < with (==|<=|>) in rows$',
  # crates/store/src/read.rs, `rows`: the same capacity hint. `high + low` could overflow i64 only for
  # stream ids of 2^30 or more, which no test or user reaches.
  'crates/store/src/read\.rs:\d+:\d+: replace - with (\+|/) in rows$',
  # crates/store/src/open.rs, `migrate`: the rollback runs only on the error path, and `open_writer` then
  # drops the connection; closing a SQLite connection rolls back its open transaction, so the file ends
  # the same either way.
  'crates/store/src/open\.rs:\d+:\d+: delete ! in migrate$',
  # crates/store/src/read.rs, `read_after`: at `after == u32::MAX` the original computes `low = high`, an
  # empty range, so both versions return no envelopes.
  'crates/store/src/read\.rs:\d+:\d+: replace > with >= in read_after$',
  # crates/store/src/read.rs, `read_after`: `first_key(id)` has its low 32 bits zero, so `|` and `^` with
  # `0xFFFF_FFFF` agree.
  'crates/store/src/read\.rs:\d+:\d+: replace \| with \^ in read_after$',
  # crates/store/src/read.rs, `reopen_in`: `last_seq` fits 32 bits (the key refuses more), so `|` and `^` agree.
  'crates/store/src/read\.rs:\d+:\d+: replace \| with \^ in reopen_in$',
  # crates/store/src/writer.rs, `Writer::commit_group`: a lone commit in a savepoint fails the same way and
  # reaches the same replies and the same file; only the statements run differ.
  'crates/store/src/writer\.rs:\d+:\d+: replace > with >= in Writer::commit_group$',
  #
  # Platform code (clauseo-acp-private#139). Mutants of the Windows-only and macOS-only code that
  # mutants-platform.yml tests on its own OS, which no OS's tests can tell apart: equivalent, or
  # unobservable, on every OS that compiles the code. A mutant missed only because of one job's OS
  # (not compiled there, or caught on another OS) goes in that job's `skip_re` in
  # mutants-platform.yml instead, never here. Each comment gives the reason in one line.
  #
  # crates/process/src/os/windows.rs (Windows only), `prepare`: CREATE_SUSPENDED and CREATE_NO_WINDOW share no bit.
  'crates/process/src/os/windows\.rs:\d+:47: replace \| with \^ in prepare$',
  # `resume`: `running` is read only when no thread resumed, and a suspended child has no running thread.
  'crates/process/src/os/windows\.rs:\d+:47: replace \+= with (-=|\*=) in resume$',
  # `resume`, `resumed == 0 && running > 0`: running is 0 in a suspended child, so it is false either way.
  'crates/process/src/os/windows\.rs:\d+:\d+: replace && with \|\| in resume$',
  # `resume`, the `running > 0` above: it differs only on the no-thread-resumed path, which no test reaches.
  'crates/process/src/os/windows\.rs:\d+:\d+: replace > with (==|<|>=) in resume$',
  # `resume`, the `resumed == 0` above, as for `&&`; the line pin keeps the two other `==` of `resume` mutated.
  'crates/process/src/os/windows\.rs:198:16: replace == with != in resume$',
  # `resume_thread`: ResumeThread fails only on a bad handle, and returns 0 only for a running thread.
  'crates/process/src/os/windows\.rs:\d+:\d+: delete match arm (u32::MAX|0) in resume_thread$',
  # crates/matters/src/no_download.rs, `Debug for NoDownload`: a fixed word that nothing formats.
  'crates/matters/src/no_download\.rs:\d+:\d+: replace <impl std::fmt::Debug for NoDownload<\x27_>>::fmt -> std::fmt::Result with Ok\(Default::default\(\)\)$',
  # crates/matters/src/no_download/macos.rs (macOS only), `turn_off`: only which refusal is logged changes.
  'crates/matters/src/no_download/macos\.rs:\d+:\d+: delete ! in turn_off$',
  # crates/matters/src/probe.rs, Windows block: RECALL_ON_DATA_ACCESS and OFFLINE share no bit, so `|` is `^`.
  'crates/matters/src/probe\.rs:\d+:\d+: replace \| with \^ in <impl PlaceholderProbe for OsProbe>::is_cloud_only$',
  # crates/matters/src/write.rs, `hidden_attributes`: that branch runs only with HIDDEN clear, so `|` is `^`.
  'crates/matters/src/write\.rs:\d+:\d+: replace \| with \^ in hidden_attributes$',
  # crates/matters/src/matter/json.rs, `remove`: it returns nothing; only which failure is logged changes.
  'crates/matters/src/matter/json\.rs:\d+:\d+: replace != with == in remove$',
  # crates/matters/src/history/blob.rs, `same_file` (Unix): it differs only in a race between open and stat.
  'crates/matters/src/history/blob\.rs:\d+:\d+: replace same_file -> bool with true$',
  # `same_file`, `&&` to `||`: within one folder the device matches, so this is the same race.
  'crates/matters/src/history/blob\.rs:\d+:\d+: replace && with \|\| in same_file$',
  # `Blobs::streamed`: a read of a regular file never fails with Interrupted, so the retry never runs.
  'crates/matters/src/history/blob\.rs:\d+:\d+: replace match guard err\.kind\(\) == io::ErrorKind::Interrupted with false in Blobs::streamed$',
  # crates/matters/src/history/durable.rs, `present` (Windows): NotFound from the remove needs a race; the pin spares line 105's, which Unix catches.
  'crates/matters/src/history/durable\.rs:121:21: replace match guard err\.kind\(\) == io::ErrorKind::NotFound with false in present$',
  # crates/matters/src/locks.rs, `relative_to`: `>=` adds only the folder itself, whose matter path is None.
  'crates/matters/src/locks\.rs:\d+:\d+: replace > with >= in relative_to$',
]
