# cargo-mutants reads this file by default (cargo-mutants 27.1.0, src/config.rs:104,
# `read_tree_config` joins `.cargo/mutants.toml` to the workspace root). `cargo xtask mutants`
# runs it on the lines a branch changed; see xtask/src/mutants.rs.
#
# Every exclusion (`exclude_re`, `exclude_globs`) needs a comment saying why no test can tell the
# mutant apart, and the code owner approves it (CODEOWNERS: /.cargo/).

# The tests run nextest, as `cargo xtask check` does, so they see .config/nextest.toml.
test_tool = "nextest"

# A mutant is caught at its first failing test; running the rest of the suite only costs time.
# .config/nextest.toml sets fail-fast = false for people, and this flag overrides it here.
additional_cargo_test_args = ["--fail-fast"]

# No `features`: they would go to every mutant's build, and cargo refuses a protocol feature for
# any other package, so every xtask or desktop mutant would come back unviable. Only
# crates/protocol/src/wire.rs needs protocol's specta feature (`WireFormat` and its tests);
# `cargo xtask mutants` leaves it out of the main pass and mutates it in a second pass with the
# feature on (xtask/src/mutants/pass.rs).

# Each build runs in a copy of the tree. Leave out what .gitignore leaves out (target/,
# node_modules/, dist/), which would otherwise be copied for every job: the default is false.
gitignore = true

# Copy `.git` too: xtask's tests list the repo with `git ls-files` and read the merge-base with
# origin/main, which fail in a copy without it. The default is false.
copy_vcs = true

# xtask/src/process/windows.rs is compiled only for Windows (`#[cfg(windows)]` in process.rs), so
# on macOS and Linux, where `cargo xtask mutants` runs, a mutant there builds the same binary and no
# test can tell it apart. Its code runs only in a Windows build (S1's Windows CI job).
# crates/desktop/src/e2e.rs is the same: it is compiled only for Windows with the `e2e` feature
# (`#[cfg(all(windows, feature = "e2e"))]` in lib.rs). Its code runs only in e2e-windows.yml, whose
# smoke test checks the webview arguments it passes.
#
# Likewise each OS shim of clauseo-settings is compiled for its OS only (`#[cfg(windows)]` or
# `#[cfg(target_os = "macos")]` on the `mod` line), and its read-only tests run in the Windows CI
# jobs and on macOS. The parsers they feed are in other files and are mutated as usual.
exclude_globs = [
  "xtask/src/process/windows.rs",
  "crates/desktop/src/e2e.rs",
  "crates/settings/src/policy/windows.rs",
  "crates/settings/src/policy/macos.rs",
  "crates/settings/src/system/windows.rs",
]

# No test can make these happen without fault injection in std (xtask/src/process/running.rs):
# - `Running::keep` only keeps the error of a failed pipe read, wait or killpg, which a live
#   child's pipes and group never give.
# - `read_all` retries a read that failed with EINTR, which `interrupted` tells apart. xtask
#   installs no signal handler, so a pipe read is never interrupted and the retry never runs.
#   Only the mutants of `interrupted` and of the match guard that calls it are excluded; any
#   other comparison in `read_all` is still mutated.
exclude_re = [
  'running\.rs:\d+:\d+: replace Running::keep with \(\)$',
  'running\.rs:\d+:\d+: replace match guard interrupted\(&error\) with (true|false) in read_all$',
  'running\.rs:\d+:\d+: replace interrupted -> bool with (true|false)$',
  'running\.rs:\d+:\d+: replace == with != in interrupted$',
  # `open_main_window` runs only when the app starts, and no test of the desktop crate starts the
  # app. Replaced with `Ok(())`, the app opens no window; e2e-windows.yml's smoke test catches that
  # (no `#app-root`), but on Windows only, outside the mutants run.
  'crates/desktop/src/lib\.rs:\d+:\d+: replace open_main_window -> tauri::Result<\(\)> with Ok\(\(\)\)$',
  # Protocol (crates/protocol). No test can tell these mutants apart from the code:
  # - `BlobHash::from_str` joins a high and a low hex digit with `(high << 4) | low`. Each digit is
  #   0 to 15 (`hex_value` gives 0-9 and 10-15), so the high digit's low four bits are zero and
  #   `|` and `^` give the same byte for every input. (`+` would too, but cargo-mutants never
  #   turns `|` into `+`: it replaces `|` only with `^` and `&`, and `&` is caught.)
  'ids\.rs:\d+:\d+: replace \| with \^ in <impl FromStr for BlobHash>::from_str$',
  # clauseo-settings' `SystemDirs` (crates/settings/src/system.rs) asks the real OS for its
  # folders. Off Windows, `home` is `std::env::home_dir`, which no test may read (tests read no
  # real home folder), and `known_folder` returns `None` with no caller there; on Windows both
  # call the known-folder shim excluded above.
  'crates/settings/src/system\.rs:\d+:\d+: replace <impl PlatformDirs for SystemDirs>::(home|known_folder) -> Option<PathBuf> with ',
  # clauseo-settings' `write_atomic` (crates/settings/src/files.rs) reads the target's metadata to
  # keep its permissions, and only a non-NotFound error from that read reaches the arm this
  # mutant makes `false`. `link_target` made the same call on the same path just before, so that
  # error needs a race between the two calls or an I/O fault. No test makes one without fault
  # injection, and EACCES on the file itself needs no read permission for metadata.
  'crates/settings/src/files\.rs:\d+:\d+: replace match guard error\.kind\(\) != io::ErrorKind::NotFound with false in <impl Files for SystemFiles>::write_atomic$',
]
