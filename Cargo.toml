[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# `cargo xtask buildtime` times edits to clauseo-protocol and clauseo-reducer with cargo at the
# root, so they must be in the default members' graph; until desktop depends on them (through
# host), they are listed themselves.
default-members = ["crates/desktop", "crates/protocol", "crates/reducer"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# One Tauri release: tauri 2.12.4, its tauri-build, and the plugins published with it. The plugin
# set is fixed (`cargo xtask check` enforces it); each change forces a near-cold rebuild.
tauri = "2.12.4"
tauri-build = "2.7.3"
# Only to name `InitializationScript` in crates/desktop/src/rust_only.rs; tauri does not re-export it.
tauri-runtime = "2.12.2"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
tauri-plugin-deep-link = "2.6.2"
# No `zip` feature: it only unpacks v1-style zipped Windows installers and compressed AppImages, and
# its zip 4 dependency carries RUSTSEC-2026-0367, -0368 and -0369. macOS updates need only tar and flate2.
# So `bundle.createUpdaterArtifacts` must never be "v1Compatible": that format needs the `zip` feature.
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = [
  "rustls-tls",
  "system-proxy",
] }
tauri-plugin-window-state = "2.5.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-os = "2.4.0"
tauri-plugin-notification = "2.7.0"
# tauri::generate_context! writes the plugin configuration as serde_json values, and
# crates/desktop/src/rust_only.rs names serde_json::Value in the plugin hooks it forwards.
serde_json = "1.0.154"
# canonicalize without the `\\?\` prefix std adds on Windows, which most tools refuse; clippy.toml
# bans std's canonicalize in its favour.
dunce = "1.0.5"
# Shared with floor 2's `process` crate (S7), which adds the features it needs in its own line.
# xtask's process door (xtask/src/process/unix.rs) sends signals to process groups with
# `sys::signal::killpg`, which `signal` turns on (with `process`, for `unistd::Pid`). `process`
# also brings nix's safe spawn and exec calls (`spawn::posix_spawn*`, `unistd::exec*`); the root
# clippy.toml bans each, so children still start only through the process door.
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
# Shared with S7 likewise. Each feature turns on the Win32 calls of xtask/src/process/windows.rs:
# `Win32_Foundation` for `HANDLE` and `CloseHandle`, `Win32_Security` for `CreateJobObjectW`
# (which takes `SECURITY_ATTRIBUTES`), `Win32_System_JobObjects` for the job calls,
# `Win32_System_Threading` for `CREATE_SUSPENDED`, `OpenThread`, `ResumeThread` and the job's
# limit struct, and `Win32_System_Diagnostics_ToolHelp` for the thread snapshot.
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
] }
# clauseo-protocol: the host boundary types; xtask: the JSON it reads (features go on each
# crate's own lines).
serde = "1"
uuid = "1"
thiserror = "2.0"
compact_str = "0.10.0"
specta = "=2.0.0-rc.25"
# protocol's `specta` feature: specta-serde applies the serde attributes (the one for rc.25).
specta-serde = "=0.0.12"
# proptest: test-only. rmp-serde: the MessagePack form the store writes, and clauseo-reducer's
# snapshot bytes.
proptest = "1.12"
rmp-serde = "1.3.1"
# clauseo-store: SQLite (its crate line turns on `bundled` and `blob`; the defaults keep `cache`
# for `prepare_cached`), BLAKE3 blob hashes, zstd snapshots, and the request and reply channels
# of its writer and reader threads.
rusqlite = "0.40"
blake3 = "1.8.7"
zstd = { version = "0.14.3", default-features = false }
async-channel = { version = "2.5", default-features = false }
futures = "0.3.32"
# Benches (clauseo-store's reopen and commit).
criterion = { version = "0.8", default-features = false }
# Golden snapshots of the wire form (clauseo-protocol); the json feature goes on the crate line.
insta = "1.49"
# Bench-only, Linux only: clauseo-reducer's instruction counts under Valgrind. The
# gungraun-runner binary CI installs must be the same version.
gungraun = "0.20"
# Test-only: the TypeScript export.
specta-typescript = "=0.0.12"
# xtask's docs check, and protocol's doc-table tests (test-only there).
pulldown-cmark = { version = "0.13.5", default-features = false }
# fake_agent validates its scenarios against the SDK's v1 schema (schema 1.11.0). No features here:
# a crate that needs one turns it on in its own line.
agent-client-protocol = { version = "=3.3.0", default-features = false }
# clauseo-matters: shadow repositories in process (no git binary, no libgit2); each crate turns on
# only the gix features it needs.
gix = { version = "0.89.0", default-features = false }
tracing = "0.1.44"
# clauseo-acp (it also uses the futures and async-channel lines above): the stdout line filter
# (memchr splits lines); async-process starts fake_agent in its tests.
memchr = "2.8"
async-process = "2"
# clauseo-process (it also uses the async-process, futures, memchr, nix and windows lines above):
# the timer of its shutdown ladder.
async-io = "2"

[workspace.lints.rust]
unsafe_code = "deny"               # deny, not forbid: an FFI module overrides with #[expect(unsafe_code, reason = "…")]
missing_docs = "warn"              # every pub item; pub is rare because of the next line
unreachable_pub = "warn"           # pub(crate) by default; visibility says what the interface is
elided_lifetimes_in_paths = "warn" # Foo<'_> shows a borrow to the reader
unused_qualifications = "allow"

[workspace.lints.clippy]
# Groups: keep style on (unlike Zed) because our --quick lane is fast; pedantic on with a short allow list.
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"            # session::SessionId reads fine
must_use_candidate = "allow"                 # noise; we mark #[must_use] where dropping is a bug
missing_errors_doc = "allow"                 # the Error enum documents its variants
missing_panics_doc = "allow"                 # library code may not panic anyway
similar_names = "allow"                      # noisy on (x, y), (row, col)
return_self_not_must_use = "allow"           # builder style
too_many_arguments = "allow"                 # Zed's reason: reducing it fights the borrow checker

# Nursery picks
redundant_clone = "warn"  # Zed denies it; clones are the commonest waste
needless_collect = "warn" # allocation for nothing

# Restriction picks, each with its reason
allow_attributes = "deny"                # only #[expect], which fails when it goes stale
allow_attributes_without_reason = "deny"
unwrap_used = "deny"                     # library code returns errors (tests allowed via clippy.toml)
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"                    # use tracing; stdout belongs to binaries
print_stderr = "deny"
exit = "deny"                            # only main decides process exit
mem_forget = "deny"
let_underscore_must_use = "deny"         # Zed rule: never discard a fallible result silently
unused_result_ok = "deny"                # .ok() to drop an error is the same smell
map_err_ignore = "deny"                  # keep the source error
mod_module_files = "deny"                # foo.rs + foo/, never foo/mod.rs (Zed convention)
clone_on_ref_ptr = "warn"                # Arc::clone(&x) makes refcount traffic visible
rc_buffer = "warn"                       # Arc<str>, not Arc<String>
str_to_string = "warn"                   # to_owned() for &str, one spelling
get_unwrap = "deny"
undocumented_unsafe_blocks = "deny"      # every unsafe block has // SAFETY:
partial_pub_fields = "warn"              # a struct is either plain data or encapsulated, not half
infinite_loop = "warn"                   # a loop without break returns !
renamed_function_params = "warn"         # trait impls keep the trait's parameter names
multiple_inherent_impl = "warn"          # one inherent impl block per type
large_include_file = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"

[profile.dev]
debug = "line-tables-only"
incremental = true         # CI turns this off; set CARGO_INCREMENTAL=1 where incremental matters
[profile.dev.package."*"]
debug = false

[profile.release] # CI artifacts only
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.bench] # gungraun: Callgrind counts by symbol, so a stripped bench counts 0 instructions
strip = false
debug = true

[profile.preview] # "feel the app": 207 s cold, 11.7 s per app edit (a Linux VM)
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[profile.dbg] # debugger sessions
inherits = "dev"
debug = "full"
[profile.dbg.package."*"]
debug = "full"
