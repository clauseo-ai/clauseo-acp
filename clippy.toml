allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true
avoid-breaking-exported-api = false
too-many-lines-threshold = 120
disallowed-methods = [
  { path = "std::thread::sleep", reason = "blocks; tests use an injected clock" },
  { path = "std::process::Command::output", reason = "agents and tools are launched by the `process` crate", replacement = "async_process::Command::output" },
  { path = "std::process::Command::spawn", reason = "agents and tools are launched by the `process` crate", replacement = "async_process::Command::spawn" },
  { path = "serde_json::from_reader", reason = "slow; read to a buffer first", replacement = "serde_json::from_slice" },
  { path = "std::time::Instant::now", reason = "the core takes time as input" },
  { path = "std::time::SystemTime::now", reason = "the core takes time as input" },
  { path = "tauri::Builder::plugin", reason = "register plugins with plugin_rust_only in crates/desktop/src/rust_only.rs, which drops the script a plugin injects into the page" },
  { path = "tauri::Builder::plugin_boxed", reason = "register plugins with plugin_rust_only in crates/desktop/src/rust_only.rs, which drops the script a plugin injects into the page" },
  { path = "tauri::AppHandle::plugin", reason = "register plugins with plugin_rust_only in crates/desktop/src/rust_only.rs, which drops the script a plugin injects into the page" },
  { path = "tauri::AppHandle::plugin_boxed", reason = "register plugins with plugin_rust_only in crates/desktop/src/rust_only.rs, which drops the script a plugin injects into the page" },
  { path = "tauri::Manager::add_capability", reason = "grants webview permissions at runtime, where no check sees them; permissions live in crates/desktop/capabilities/" },
  { path = "tauri::Context::runtime_authority_mut", reason = "its add_capability grants webview permissions before the app runs, where no check sees them; permissions live in crates/desktop/capabilities/" },
  { path = "tauri::ipc::RuntimeAuthority::add_capability", reason = "grants webview permissions at runtime, where no check sees them; permissions live in crates/desktop/capabilities/" },
  { path = "tauri::Context::config_mut", reason = "tauri.conf.json is the checked config; changing it in Rust skips the tauri-config check" },
  { path = "tauri::Context::new", reason = "only generate_context! builds the context, from the checked tauri.conf.json and capabilities" },
  { path = "tauri::Context::set_assets", reason = "the app serves only the checked frontendDist that generate_context! embeds" },
  { path = "tauri_build::Attributes::capabilities_path_pattern", reason = "moves the capabilities folder away from crates/desktop/capabilities/, where the capabilities check reads them" },
  { path = "tauri::ipc::RuntimeAuthority::__allow_command", reason = "grants a command with no capability, where no check sees it; permissions live in crates/desktop/capabilities/" },
  # Writes: every std call that changes the file system; reads stay allowed. Each std::os
  # module exists on one OS family only, so allow-invalid keeps clippy quiet on the other.
  { path = "std::fs::write", reason = "files change only through the crate's write module; see AGENTS.md" },
  { path = "std::fs::create_dir", reason = "files change only through the crate's write module; see AGENTS.md" },
  { path = "std::fs::create_dir_all", reason = "files change only through the crate's write module; see AGENTS.md" },
  { path = "std::fs::remove_file", reason = "files change only through the crate's write module; see AGENTS.md" },
  { path = "std::fs::remove_dir", reason = "files change only through the crate's write module; see AGENTS.md" },
  { path = "std::fs::remove_dir_all", reason = "files change only through the crate's write module; see AGENTS.md" },
  { path = "std::fs::rename", reason = "files change only through the crate's write module; see AGENTS.md" },
  { path = "std::fs::copy", reason = "files change only through the crate's write module; see AGENTS.md" },
  { path = "std::fs::hard_link", reason = "files change only through the crate's write module; see AGENTS.md" },
  { path = "std::fs::soft_link", reason = "files change only through the crate's write module; see AGENTS.md" },
  { path = "std::fs::set_permissions", reason = "files change only through the crate's write module; see AGENTS.md" },
  { path = "std::fs::File::create", reason = "files change only through the crate's write module; see AGENTS.md" },
  { path = "std::fs::File::create_new", reason = "files change only through the crate's write module; see AGENTS.md" },
  { path = "std::fs::File::set_len", reason = "files change only through the crate's write module; see AGENTS.md" },
  { path = "std::fs::File::set_permissions", reason = "files change only through the crate's write module; see AGENTS.md" },
  { path = "std::fs::File::set_times", reason = "files change only through the crate's write module; see AGENTS.md" },
  { path = "std::fs::File::set_modified", reason = "files change only through the crate's write module; see AGENTS.md" },
  { path = "std::fs::OpenOptions::open", reason = "files change only through the crate's write module; see AGENTS.md" },
  { path = "std::fs::DirBuilder::create", reason = "files change only through the crate's write module; see AGENTS.md" },
  { path = "std::fs::set_times", reason = "files change only through the crate's write module; see AGENTS.md" },
  { path = "std::fs::set_times_nofollow", reason = "files change only through the crate's write module; see AGENTS.md" },
  { path = "std::os::unix::fs::symlink", reason = "files change only through the crate's write module; see AGENTS.md", allow-invalid = true },
  { path = "std::os::unix::fs::chown", reason = "files change only through the crate's write module; see AGENTS.md", allow-invalid = true },
  { path = "std::os::unix::fs::lchown", reason = "files change only through the crate's write module; see AGENTS.md", allow-invalid = true },
  { path = "std::os::unix::fs::fchown", reason = "files change only through the crate's write module; see AGENTS.md", allow-invalid = true },
  { path = "std::os::unix::net::UnixListener::bind", reason = "files change only through the crate's write module; see AGENTS.md", allow-invalid = true },
  { path = "std::os::unix::net::UnixListener::bind_addr", reason = "files change only through the crate's write module; see AGENTS.md", allow-invalid = true },
  { path = "std::os::unix::net::UnixDatagram::bind", reason = "files change only through the crate's write module; see AGENTS.md", allow-invalid = true },
  { path = "std::os::unix::net::UnixDatagram::bind_addr", reason = "files change only through the crate's write module; see AGENTS.md", allow-invalid = true },
  { path = "std::os::windows::fs::symlink_file", reason = "files change only through the crate's write module; see AGENTS.md", allow-invalid = true },
  { path = "std::os::windows::fs::symlink_dir", reason = "files change only through the crate's write module; see AGENTS.md", allow-invalid = true },
]
