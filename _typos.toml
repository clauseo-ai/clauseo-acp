# typos checks spelling in code, docs and file names, from `cargo xtask check` and the pre-commit
# hook. Add a word under [default.extend-words] only when it is a real name or term, never to hide a typo.
[files]
# Lock files hold only generated text (checksums, integrity hashes, package names and versions):
# nothing in them is ours to spell. MessagePack files are binary. The pre-commit hook passes
# --force-exclude, so these hold for the staged files it names too. The scoreboard scenario is
# generated: its chunks cut words at random, and its prose is checked where it is written,
# crates/fake_agent/tests/stdio/scoreboard_prose.rs. The fuzz seeds are inputs libFuzzer mutated:
# their words are cut and changed on purpose.
extend-exclude = [
  "Cargo.lock",
  "ui/pnpm-lock.yaml",
  "*.msgpack",
  "crates/fake_agent/scenarios/scoreboard.jsonl",
  "fuzz/seeds/",
]

[default]
# A code point in a stylesheet's unicode-range (U+0100-02BA) is hex, not a word.
extend-ignore-re = ["U\\+[0-9A-Fa-f]{4,6}(?:-[0-9A-Fa-f]{4,6})?"]

[default.extend-words]
# HTML's named character reference for ¤ (the currency sign), in ui/patches/'s entity decoder.
curren = "curren"
# Win32's TrackMouseEvent flags (TME_LEAVE, TME_NONCLIENT), in crates/desktop/src/window_frame/.
TME = "TME"
# The SID string alias for the built-in Administrators group (BA), in crates/desktop/src/jailed/
# and the ADR that describes the sandbox record: it must be told apart from a real SID.
BA = "BA"
# The ordinal suffix in "2nd" (the legal extras' superscripts, `2^nd^`), and Unicode's Nd (decimal number)
# category in the slug pattern of ui/components/src/markdown/slugs.ts.
nd = "nd"
# The flate2 crate (gzip), a dependency of crates/agents and crates/counts named in ARCHITECTURE.md
# and their decision records.
flate = "flate"
