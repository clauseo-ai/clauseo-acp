# Installs pinned tools as prebuilt binaries, at the versions `cargo xtask setup --list=json`
# prints, and checks each version. No version is written here: xtask/src/setup.rs is their home.
#
# - The cargo tools come from taiki-e/install-action, which checks the sha256 of each tool it
#   knows. `fallback: none` makes it fail on a tool or version it does not know, rather than fall
#   back to cargo-binstall, which checks no sha256. Their versions are then checked here, from
#   `<tool> --version`: `cargo xtask setup` would run `cargo install`, which fails on a binary it
#   did not install itself ("binary already exists in destination").
# - The binaries (gitleaks, lefthook) go through `cargo xtask setup --binaries`, which installs one
#   only when it is missing or at another version, checking the pinned sha256, and then checks its
#   version.
# - Needs the Rust toolchain installed first: the pins are read by building and running xtask.
# - Cache: before any download the tools are restored from main's Actions cache and checked
#   (tool-cache.sh says how: the binaries' release assets and the cargo tools' binaries, each
#   against its sha256 pinned in xtask/src/setup.rs, once before saving and again after
#   restoring). What is missing or does not match is downloaded as above. Only main's scheduled
#   and on-demand runs save, and only after a miss (./.github/actions/cache-save-main), so pull
#   requests and merge groups never save; the nightly prune deletes the older entries. The cache
#   service down is a warning, and everything is downloaded. On main, a cargo tool install-action
#   installed that is not its pin fails the job (tool-cache.sh fill), so a stale pin shows at once.
# - The scripts run from `$GITHUB_WORKSPACE/.github/...`, not `github.action_path`, which is a
#   backslash path on Windows.

name: Install the pinned tools
description: Installs the tools xtask/src/setup.rs pins, as prebuilt binaries, and checks them.

inputs:
  tools:
    description: >-
      Space-separated names, as `cargo xtask setup --list` prints them (cargo-nextest, gitleaks,
      ...). Empty installs every pinned tool.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # No file the steps after the restore read is written before it: actions/cache unpacks with
    # `tar -P` and no path filter, so a crafted entry could replace such a file. The pins travel as
    # a step output (json), which the runner holds, and are written to a new folder twice: once for
    # the key, and again after the restore for everything that follows (pins-after).
    - name: Read the pins from cargo xtask setup --list=json
      id: pins
      shell: bash
      env:
        NAMES: ${{ inputs.tools }}
      run: |
        set -euo pipefail
        # jq on Windows ends its lines with CRLF, so each of its outputs drops the CR.
        json=$(cargo xtask setup --list=json | jq -c . | tr -d '\r')
        # Each name given must be pinned, as `setup --only` requires.
        for name in $NAMES; do
          jq -e --arg n "$name" '[.tools[], .binaries[]] | any(.name == $n)' <<< "$json" > /dev/null \
            || { echo "::error::$name is not a pinned tool in xtask/src/setup.rs"; exit 1; }
        done
        echo "json=$json" >> "$GITHUB_OUTPUT"

    - name: The pins, for the key
      id: pins-key
      shell: bash
      env:
        PINS_JSON: ${{ steps.pins.outputs.json }}
        NAMES: ${{ inputs.tools }}
      run: bash "$GITHUB_WORKSPACE/.github/actions/install-pinned-tools/tool-cache.sh" pins

    - name: The tools cache's key
      id: cache-key
      shell: bash
      env:
        PINS_DIR: ${{ steps.pins-key.outputs.dir }}
      run: bash "$GITHUB_WORKSPACE/.github/actions/install-pinned-tools/tool-cache.sh" key

    - name: Restore the tools from main's cache
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cache-key.outputs.dir }}
        key: ${{ steps.cache-key.outputs.key }}

    - name: The pins again, written after the restore
      id: pins-after
      shell: bash
      env:
        PINS_JSON: ${{ steps.pins.outputs.json }}
        NAMES: ${{ inputs.tools }}
      run: bash "$GITHUB_WORKSPACE/.github/actions/install-pinned-tools/tool-cache.sh" pins

    - name: Check the restored tools against their checksums, and put them on PATH
      id: restored
      shell: bash
      env:
        PINS_DIR: ${{ steps.pins-after.outputs.dir }}
      run: bash "$GITHUB_WORKSPACE/.github/actions/install-pinned-tools/tool-cache.sh" restore

    # On main after a miss, the binaries' assets are downloaded here, into the folder that is saved,
    # instead of by `cargo xtask setup --binaries` (which then finds them installed).
    - name: Download the binaries' release assets into the cache folder (main, after a miss)
      if: >-
        steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      shell: bash
      env:
        PINS_DIR: ${{ steps.pins-after.outputs.dir }}
      run: bash "$GITHUB_WORKSPACE/.github/actions/install-pinned-tools/tool-cache.sh" fetch-assets

    - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
      if: steps.pins-after.outputs.spec != '' && steps.restored.outputs.cargo_tools != 'true'
      with:
        tool: ${{ steps.pins-after.outputs.spec }}
        fallback: none

    # cargo-<x> runs as `cargo <x> --version`, <x>-cli as `<x> --version`; each prints its name
    # and then its version as the second word.
    - name: Check the cargo tools' versions against the pins
      if: steps.pins-after.outputs.spec != ''
      shell: bash
      env:
        PINS_DIR: ${{ steps.pins-after.outputs.dir }}
      run: |
        set -euo pipefail
        failed=0
        while IFS=$'\t' read -r name version; do
          case "$name" in
            cargo-*) got=$(cargo "${name#cargo-}" --version | awk 'NR == 1 { print $2 }') ;;
            *) got=$("${name%-cli}" --version | awk 'NR == 1 { print $2 }') ;;
          esac
          if [ "$got" = "$version" ]; then
            echo "$name $version ok"
          else
            echo "::error::$name is at '$got', but xtask/src/setup.rs pins $version"
            failed=1
          fi
        done < "$PINS_DIR/cargo-tools.tsv"
        exit "$failed"

    - name: Install and check the binaries (cargo xtask setup --binaries)
      if: steps.pins-after.outputs.binaries != ''
      shell: bash
      env:
        ONLY: ${{ steps.pins-after.outputs.binaries }}
      run: |
        # $ONLY is "--only <name> ..." and is split on purpose.
        # shellcheck disable=SC2086
        cargo xtask setup --binaries $ONLY

    - name: Gather the installed tools into the cache folder (main, after a miss)
      id: fill
      if: >-
        steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      shell: bash
      env:
        PINS_DIR: ${{ steps.pins-after.outputs.dir }}
      run: bash "$GITHUB_WORKSPACE/.github/actions/install-pinned-tools/tool-cache.sh" fill

    - name: Save the tools (main, after a miss)
      if: steps.fill.outputs.save == 'true'
      uses: ./.github/actions/cache-save-main
      with:
        path: ${{ steps.cache-key.outputs.dir }}
        key: ${{ steps.cache-key.outputs.key }}
