# Installs the apt packages the desktop crate links against: libwebkit2gtk-4.1-dev (WebKitGTK 4.1),
# the one home of that package name, plus the packages a job passes in `extra-packages`.
#
# - No version is pinned here: apt installs the one the runner's package index offers.
# - A job must check out the repo before it uses this action, since `uses: ./...` reads the action
#   from the checkout.
# - `--no-install-recommends` installs only the packages named, so a job lists what it needs.

name: Install the Linux system packages Tauri needs
description: Runs apt-get update, then installs WebKitGTK 4.1 and any extra packages.

inputs:
  extra-packages:
    description: >-
      Space-separated apt packages installed alongside WebKitGTK, for example xvfb. Empty installs
      WebKitGTK alone.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: apt-get update, then install WebKitGTK and the extra packages
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        set -euo pipefail
        sudo apt-get update -q
        # $EXTRA_PACKAGES is a space-separated list of package names and is split on purpose.
        # shellcheck disable=SC2086
        sudo apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev $EXTRA_PACKAGES
