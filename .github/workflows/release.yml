# Release builds: one commit becomes every installer, the updater's files, latest.json and
# SHA256SUMS.txt. docs/decisions/0035-release-builds.md records why it is built this way.
# SHA256SUMS.txt covers every asset. Those include S15's sandbox tool (SANDBOX_EXE below) per
# Windows architecture with its updater-key .sig: the same exe and .sig both installers place in
# the install folder, which assemble checks, and the release notes repeat its SHA-256 for IT to
# compare a copy Defender restored from quarantine.
#
# Three modes, which `check` decides from what started the run:
# - release: a pushed tag v<X.Y.Z> on a commit on main. Builds under the environment `release`
#   and leaves a draft GitHub Release; `publish` waits for Rohan's approval (environment
#   `release-publish`), refuses unless every DMG is notarised and stapled, then publishes it.
# - test: a pushed tag test-v<X.Y.Z> on a commit of a release-test/* branch. Builds with the
#   `e2e` feature under `release-test`, signs the updater files with the throwaway test key, and
#   makes a public pre-release (a draft's assets need a signed-in download) for the updater's
#   check by hand.
# - dry: workflow_dispatch, from any ref (`gh workflow run release.yml --ref <branch>`). No
#   environment and no secret: each job that signs makes a throwaway updater key with a random
#   password in its own runner, and nothing is published. The assets end up in the run's artifact
#   dist-assets, with latest.json and SHA256SUMS.txt.
# Nothing else starts this workflow: never a pull request, so never a fork's.
#
# - The app's version lives in crates/desktop/Cargo.toml and tauri.conf.json (the desktop test
#   tests/version.rs keeps them equal); a tag must name it. No version of a tool is written here:
#   Rust comes from rust-toolchain.toml, pnpm from "packageManager", Node from "engines.node" in
#   ui/package.json, the Tauri CLI from ui/pnpm-lock.yaml.
# - Every action is pinned by commit SHA, with its tag in a comment; every job has its own
#   `permissions:`; each secret is set on the one step that uses it, never on a job. Dependencies
#   install with --frozen-lockfile and `cargo fetch --locked` before any secret is present. No
#   cache is restored or saved: a release builds cold, and the bundler downloads NSIS itself and
#   checks it against its own pinned hash.
#   .github/scripts/latest-json.test.mjs fails on a change that breaks one of these rules.
# - Release flags (here only): frame pointers on every target and a SHA-1 build id on Linux, line
#   tables only, packed split debug info. The shipped binaries stay stripped (root Cargo.toml);
#   the .dSYM, .pdb and .dwp go up as debug-files-<target>, the ui's source maps as
#   ui-sourcemaps-<version>, never in a bundle or on the Release.
# - crates/desktop/release/ holds the overlays passed with --config: release.conf.json (the
#   binary's name, Clauseo, and the ui built once by the `ui` job instead of beforeBuildCommand),
#   windows.conf.json (the uninstall hook), machine.conf.json (the perMachine installer) and
#   blocklist.conf.json (bundle.resources: the block-list snapshot, blocklist/ in the app's
#   resources). `check` fails on any other key in them. The sidecar seam writes a fourth,
#   sidecars.generated.json (bundle.externalBin only, gitignored), which every `tauri build` and
#   `tauri bundle` of a shipped build passes last.
# - The block-list snapshot: the `blocklist` job downloads clauseo-ai/blocklist's `current`
#   release, fails unless minisign verifies it with crates/blocklist/keys/stage-f.pub (the key the
#   app compiles in), and every job that builds or bundles with release.conf.json downloads it into
#   crates/desktop/blocklist/ (gitignored) first and passes blocklist.conf.json after it.
# - Tier 1 is macOS Apple silicon and Windows x64; tier 2 (Intel macOS, Windows ARM64, Linux) is
#   continue-on-error, and the release notes name a tier 2 asset that is missing.

name: release

on:
  push:
    tags: ["v*", "test-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: A dry run builds everything and publishes nothing. A release starts only from a pushed tag, so false is refused.
        type: boolean
        default: true

permissions: {}

# One run per ref at a time; a second push of the same tag waits rather than cancelling a release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
  CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: packed
  # S15's sandbox tool as the Windows installers place it beside Clauseo.exe (sidecars.mjs builds
  # it as crates/desktop/binaries/<name>-<target>.exe). The one place its name is written here and
  # in latest-json.test.mjs.
  SANDBOX_EXE: clauseo-sandbox-setup.exe

jobs:
  # What started the run, and whether it may: the mode, the version, the environment of the jobs
  # that sign, the features, the release date. Reads the repo only.
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      version: ${{ steps.mode.outputs.version }}
      tag: ${{ steps.mode.outputs.tag }}
      environment: ${{ steps.mode.outputs.environment }}
      features: ${{ steps.mode.outputs.features }}
      release_date: ${{ steps.mode.outputs.release_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide the mode, check the tag against the version and its branch
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          conf_version=$(jq -r .version crates/desktop/tauri.conf.json)
          crate_version=$(python3 -c 'import tomllib; print(tomllib.load(open("crates/desktop/Cargo.toml", "rb"))["package"]["version"])')
          [ "$conf_version" = "$crate_version" ] ||
            fail "tauri.conf.json says $conf_version, crates/desktop/Cargo.toml says $crate_version"
          tag="" release_date="" environment="" features=""
          case "$EVENT:$REF" in
            workflow_dispatch:*)
              [ "$DRY_RUN" = true ] ||
                fail "a release starts only from a pushed tag; a dispatched run is a dry run (dry_run: true)"
              mode=dry version=$conf_version ;;
            push:refs/tags/v*)
              mode=release tag=${REF#refs/tags/} version=${REF#refs/tags/v} environment=release ;;
            push:refs/tags/test-v*)
              mode=test tag=${REF#refs/tags/} version=${REF#refs/tags/test-v} environment=release-test features=e2e ;;
            *)
              fail "release.yml runs on v* and test-v* tags and workflow_dispatch, not $EVENT $REF" ;;
          esac
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] ||
            fail "version $version is not plain X.Y.Z"
          [ "$version" = "$conf_version" ] ||
            fail "tag $tag names $version; crates/desktop/Cargo.toml and tauri.conf.json say $conf_version"

          if [ "$mode" = release ]; then
            git fetch -q --no-tags origin +refs/heads/main:refs/remotes/origin/main
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main ||
              fail "$tag is on $GITHUB_SHA, which is not on main"
          fi
          if [ "$mode" = test ]; then
            git fetch -q --no-tags origin '+refs/heads/release-test/*:refs/remotes/origin/release-test/*'
            [ -n "$(git for-each-ref --contains "$GITHUB_SHA" refs/remotes/origin/release-test/)" ] ||
              fail "$tag is on $GITHUB_SHA, which is on no release-test/* branch"
          fi

          # A v* release never builds a test, measuring or test-server feature: none is asked for
          # here, and the desktop crate's default features reach none of them.
          default=$(python3 - <<'PY'
          import tomllib
          features = tomllib.load(open("crates/desktop/Cargo.toml", "rb")).get("features", {})
          seen, todo = set(), list(features.get("default", []))
          while todo:
              name = todo.pop()
              if name not in seen:
                  seen.add(name)
                  todo += features.get(name, [])
          print(" ".join(sorted(seen & {
              "e2e", "marks", "crash_test", "staging-connector", "local-connector",
          })))
          PY
          )
          [ -z "$default" ] || fail "the desktop crate's default features turn on $default"
          if [ "$mode" = release ] && [ -n "$features" ]; then
            fail "a v* release would build with --features $features"
          fi

          # The release date the app shows (DisplayInfo.release_date): the annotated tag's date,
          # else the tagged commit's, as YYYY-MM-DD in UTC. A dry run has none, as dev builds.
          if [ -n "$tag" ]; then
            git fetch -q --no-tags origin "+refs/tags/$tag:refs/tags/$tag"
            if [ "$(git cat-file -t "refs/tags/$tag")" = tag ]; then
              seconds=$(git for-each-ref --format='%(taggerdate:unix)' "refs/tags/$tag")
            else
              seconds=$(git log -1 --format=%ct "$GITHUB_SHA")
            fi
            release_date=$(date -u -d "@$seconds" +%F)
          fi

          # The updater key that signs this mode's files must have its public key: in a release
          # the app's own (plugins.updater.pubkey), in a test the throwaway one R23 commits. A
          # dry run makes its own in each signing job.
          if [ "$mode" = release ] && [ -z "$(jq -r '.plugins.updater.pubkey // ""' crates/desktop/tauri.conf.json)" ]; then
            fail "plugins.updater.pubkey in tauri.conf.json is empty; a v* release signs updates for it"
          fi
          if [ "$mode" = test ] && [ ! -s crates/desktop/release/updater-test.pub ]; then
            fail "crates/desktop/release/updater-test.pub (the test key's public key) is missing"
          fi

          {
            echo "mode=$mode"
            echo "version=$version"
            echo "tag=$tag"
            echo "environment=$environment"
            echo "features=$features"
            echo "release_date=$release_date"
          } | tee -a "$GITHUB_OUTPUT"

      # The overlays may hold only what they are for. Every sidecar, S15's included, goes through
      # .github/scripts/sidecars.mjs and its generated overlay, which the seam checks.
      - name: The release overlays hold only their own keys
        working-directory: crates/desktop/release
        run: |
          set -euo pipefail
          # Every key path to a value that is not an object, array items left out.
          leaves() {
            jq -r '[paths as $p | select(($p | all(type == "string")) and (getpath($p) | type) != "object")
              | $p | join(".")] | sort | join(" ")' "$1"
          }
          status=0
          want() {
            if [ "$(leaves "$1")" != "$2" ]; then
              echo "::error file=crates/desktop/release/$1::$1 holds $(leaves "$1"); it may hold only $2"
              status=1
            fi
          }
          want release.conf.json "build.beforeBuildCommand mainBinaryName"
          want machine.conf.json "bundle.windows.nsis.installMode"
          want windows.conf.json "bundle.windows.nsis.installerHooks"
          want blocklist.conf.json "bundle.resources.blocklist/blocklist-v1.txt.gz bundle.resources.blocklist/blocklist-v1.txt.gz.minisig"
          [ "$(jq -c .bundle.resources blocklist.conf.json)" = '{"blocklist/blocklist-v1.txt.gz":"blocklist/blocklist-v1.txt.gz","blocklist/blocklist-v1.txt.gz.minisig":"blocklist/blocklist-v1.txt.gz.minisig"}' ] ||
            { echo "::error::blocklist.conf.json must put each snapshot file at blocklist/<the same name>"; status=1; }
          [ "$(jq -r .mainBinaryName release.conf.json)" = Clauseo ] || { echo "::error::mainBinaryName is not Clauseo"; status=1; }
          [ "$(jq -r .bundle.windows.nsis.installMode machine.conf.json)" = perMachine ] ||
            { echo "::error::machine.conf.json's installMode is not perMachine"; status=1; }
          exit "$status"

  # The block-list snapshot every shipped and measuring build bundles, in every mode, a dry run
  # included: clauseo-ai/blocklist's `current` release, verified with the key the app compiles in
  # (crates/blocklist/keys/stage-f.pub) before any build takes it. A stale snapshot (generated
  # more than 24 hours before this run) is a warning, never a failure.
  blocklist:
    name: blocklist
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BASE: https://github.com/clauseo-ai/blocklist/releases/download/current
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: crates/blocklist/keys/stage-f.pub
          sparse-checkout-cone-mode: false

      - name: Install minisign
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y minisign

      - name: Download the snapshot and its signature
        run: |
          set -euo pipefail
          for file in blocklist-v1.txt.gz blocklist-v1.txt.gz.minisig; do
            curl --fail --retry 3 --location --silent --show-error -o "$file" "$BASE/$file"
          done

      # minisign checks the file's signature and the signature over the trusted comment, so the
      # comment read from its output is the signed one.
      - name: Verify the snapshot, check its trusted comment, write the summary
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          out=$(minisign -V -p crates/blocklist/keys/stage-f.pub -m blocklist-v1.txt.gz -x blocklist-v1.txt.gz.minisig) ||
            fail "minisign could not verify blocklist-v1.txt.gz with crates/blocklist/keys/stage-f.pub"
          comment=$(sed -n 's/^Trusted comment: //p' <<< "$out")
          pattern='^clauseo-blocklist v1 generated=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z) entries=([0-9]+)$'
          [[ "$comment" =~ $pattern ]] ||
            fail "the trusted comment is \"$comment\", not clauseo-blocklist v1 generated=<YYYY-MM-DDTHH:MM:SSZ> entries=<n>"
          generated=${BASH_REMATCH[1]} entries=${BASH_REMATCH[2]}
          seconds=$(date -u -d "$generated" +%s) || fail "generated=$generated is not a date"
          age=$(( $(date -u +%s) - seconds ))
          {
            echo "### Block-list snapshot"
            echo "- generated: $generated"
            echo "- entries: $entries"
            echo "- blocklist-v1.txt.gz SHA-256: $(sha256sum blocklist-v1.txt.gz | cut -d ' ' -f 1)"
            echo "- blocklist-v1.txt.gz.minisig SHA-256: $(sha256sum blocklist-v1.txt.gz.minisig | cut -d ' ' -f 1)"
            if [ "$age" -gt 86400 ]; then
              echo "- **Warning:** the snapshot was generated $(( age / 3600 )) hours before this run (more than 24)."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$age" -gt 86400 ]; then
            echo "::warning::the block-list snapshot was generated at $generated, more than 24 hours before this run"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blocklist-snapshot
          path: |
            blocklist-v1.txt.gz
            blocklist-v1.txt.gz.minisig
          if-no-files-found: error
          retention-days: 1

  # The ui, built once for every leg, so each platform embeds the same files and the source maps
  # match all of them. The maps are written hidden (no sourceMappingURL) and moved out of
  # ui/app/dist before any leg embeds it.
  ui:
    name: ui
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/package.json
          package-manager-cache: false

      - name: Install the ui workspace
        run: pnpm -C ui install --frozen-lockfile

      - name: Build the ui with hidden source maps, then move the maps out
        env:
          MAPS: ${{ runner.temp }}/ui-sourcemaps
        run: |
          set -euo pipefail
          pnpm -C ui --filter @clauseo/app exec vite build --sourcemap hidden
          cd ui/app/dist
          find . -name '*.map' -print0 | while IFS= read -r -d '' map; do
            mkdir -p "$MAPS/$(dirname "$map")"
            mv "$map" "$MAPS/$map"
          done
          [ -z "$(find . -name '*.map')" ] || { echo "::error::a source map is left in ui/app/dist"; exit 1; }
          [ -n "$(find "$MAPS" -name '*.map')" ] || { echo "::error::vite wrote no source map"; exit 1; }
          if grep -rl 'sourceMappingURL' .; then echo "::error::a file in ui/app/dist names its source map"; exit 1; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: ui/app/dist
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-sourcemaps-${{ needs.check.outputs.version }}
          path: ${{ runner.temp }}/ui-sourcemaps
          if-no-files-found: error

  # Every target from the one commit. macOS builds, bundles and signs the updater archive here;
  # Windows builds the exe once (sign-windows bundles it); Linux bundles .deb and .rpm, which never
  # update themselves, so it signs nothing and holds no secret. Only the macOS legs take the
  # environment, since only they sign here.
  build:
    name: build (${{ matrix.target }})
    needs: [check, ui, blocklist]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    continue-on-error: ${{ matrix.tier == 2 }}
    environment: ${{ matrix.signs && needs.check.outputs.environment || '' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15, tier: 1, signs: true, arch: aarch64, rustflags: "-C force-frame-pointers=yes" }
          - { target: x86_64-apple-darwin, runner: macos-15, tier: 2, signs: true, arch: x64, rustflags: "-C force-frame-pointers=yes" }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025, tier: 1, signs: false, arch: x64, rustflags: "-C force-frame-pointers=yes" }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm, tier: 2, signs: false, arch: arm64, rustflags: "-C force-frame-pointers=yes" }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04, tier: 2, signs: false, arch: amd64, rustflags: "-C force-frame-pointers=yes -C link-arg=-Wl,--build-id=sha1" }
    env:
      TARGET: ${{ matrix.target }}
      MODE: ${{ needs.check.outputs.mode }}
      # Read by the sandbox's build.rs (stage C) with CLAUSEO_UPDATER_PUBKEY below.
      CLAUSEO_RELEASE_MODE: ${{ needs.check.outputs.mode }}
      VERSION: ${{ needs.check.outputs.version }}
      FEATURES: ${{ needs.check.outputs.features }}
      RELEASE_DATE: ${{ needs.check.outputs.release_date }}
      RUSTFLAGS: ${{ matrix.rustflags }}
      RELEASE_DIR: target/${{ matrix.target }}/release
      OUT: ${{ github.workspace }}/release-out
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain from rust-toolchain.toml, and the target
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - name: Install the Linux system packages Tauri needs
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-tauri-linux-deps
        with:
          # A release build's packages come from the Ubuntu archive, never from a cache entry.
          cache: "false"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/package.json
          package-manager-cache: false

      # Before any secret: the Tauri CLI from the lock file, every crate from Cargo.lock.
      - name: Install the ui workspace and fetch the crates
        run: |
          pnpm -C ui install --frozen-lockfile
          cargo fetch --locked

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ui/app/dist

      # The verified snapshot, where blocklist.conf.json's bundle.resources point. The compile
      # needs it as well as the bundle: tauri-build copies every resource and fails on a missing one.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blocklist-snapshot
          path: crates/desktop/blocklist

      # ---- The sidecar seam ----
      # After the installs, before any secret and before the app is built (latest-json.test.mjs
      # checks both). sidecars.mjs builds or fetches each sidecar for $TARGET (clauseo-mcp with
      # this job's RUSTFLAGS and profile, clauseo-agent-browser from agent-browser's pin) as
      # crates/desktop/binaries/<name>-$TARGET (.exe on Windows), and writes
      # release/sidecars.generated.json: bundle.externalBin for exactly those. Every tauri build
      # and tauri bundle below passes it last (a merge patch replaces arrays, so it is the
      # target's whole list). S15 adds its rows to the script's table.
      # The updater public key the sandbox's build.rs builds in (stage C), before sidecars.mjs
      # compiles it, always in plugins.updater.pubkey's format (base64 of the whole minisign .pub
      # text): a release's from tauri.conf.json, a test run's updater-test.pub, which is stored in
      # that format (the scan below base64-decodes it). A dry run sets none, nor a release while tauri.conf.json has none, so
      # build.rs falls back to tauri.conf.json's placeholder and the refresh fails closed. Public
      # keys only: no secret.
      - name: The updater public key for the sandbox's build
        run: |
          set -euo pipefail
          key=""
          case "$MODE" in
            release) key=$(jq -r .plugins.updater.pubkey crates/desktop/tauri.conf.json) ;;
            test) key=$(tr -d '\r\n' < crates/desktop/release/updater-test.pub) ;;
          esac
          if [ -n "$key" ]; then
            decoded=$(printf '%s' "$key" | base64 -d | tr -d '\r')
            [ "$(printf '%s\n' "$decoded" | sed -n 1p | cut -c 1-38)" = "untrusted comment: minisign public key" ] &&
              printf '%s\n' "$decoded" | sed -n 2p | grep -q '^RW' ||
              { echo "::error::the $MODE updater key is not base64 of a minisign public key file"; exit 1; }
          fi
          if [ -n "$key" ]; then
            echo "CLAUSEO_UPDATER_PUBKEY=$key" >> "$GITHUB_ENV"
            echo "CLAUSEO_UPDATER_PUBKEY is the $MODE key"
          else
            echo "CLAUSEO_UPDATER_PUBKEY is unset ($MODE)"
          fi

      - name: Sidecars for this target
        run: |
          set -euo pipefail
          node .github/scripts/sidecars.mjs "$TARGET"
          node .github/scripts/sidecars.mjs --check

      # CLAUSEO_RELEASE_DATE is set only for a tag (release and test); unset, the app has none.
      - name: Build the app
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_DATE" ]; then export CLAUSEO_RELEASE_DATE="$RELEASE_DATE"; fi
          config=(--config release/release.conf.json --config release/blocklist.conf.json)
          if [ "$RUNNER_OS" = Windows ]; then config+=(--config release/windows.conf.json); fi
          if [ "$RUNNER_OS" = Linux ]; then
            pnpm -C ui tauri build --ci --target "$TARGET" ${FEATURES:+--features "$FEATURES"} --bundles deb,rpm \
              "${config[@]}" --config '{"bundle":{"createUpdaterArtifacts":false}}' --config release/sidecars.generated.json -- --locked
          else
            pnpm -C ui tauri build --ci --target "$TARGET" ${FEATURES:+--features "$FEATURES"} --no-bundle \
              "${config[@]}" --config release/sidecars.generated.json -- --locked
          fi

      # Only a test run's e2e build may hold the throwaway test key (crates/desktop/release/
      # updater-test.pub). Every other run's app binary, as linked and before anything signs or
      # uploads it (on Linux the deb and rpm are already built; the macOS .app's main executable
      # is this file), holds none of it: not
      # the file's base64 text, its RW... key line or its key id (B142942ACEC5F521), in ASCII or
      # UTF-16 (the NULs are dropped first). This scan, not the desktop tests, is the control.
      - name: The app binary holds no form of the test updater key
        if: env.MODE != 'test'
        run: |
          set -euo pipefail
          file=$(tr -d '\r\n' < crates/desktop/release/updater-test.pub)
          decoded=$(printf '%s' "$file" | base64 -d)
          id=$(printf '%s\n' "$decoded" | sed -n 1p | awk '{ print $NF }')
          key=$(printf '%s\n' "$decoded" | sed -n 2p | tr -d '\r')
          [ "${#id}" = 16 ] && [ "${key#RW}" != "$key" ] || { echo "::error::updater-test.pub is not a minisign public key"; exit 1; }
          exe=$RELEASE_DIR/Clauseo; [ "$RUNNER_OS" = Windows ] && exe=$exe.exe
          [ -f "$exe" ] || { echo "::error::no app binary at $exe"; exit 1; }
          for form in "$file" "$key" "$id"; do
            found=$(LC_ALL=C tr -d '\000' < "$exe" | LC_ALL=C grep -c -a -F -e "$form") || [ $? -eq 1 ]
            if [ "$found" != 0 ]; then
              echo "::error::$exe holds the test updater key"
              exit 1
            fi
          done
          echo "$exe holds no form of the test updater key"

      # The case-law connector's test servers are compiled only into desktop's staging-connector
      # and local-connector builds (docs/connector-staging.md). Every other run's app binary holds
      # neither host, in ASCII or UTF-16 (the NULs are dropped first): the bare host covers its
      # https:// or http:// form and any path. This scan, not the desktop test
      # tests/staging_host.rs (a debug test build), is the control for the shipped binary.
      - name: The app binary holds no connector test host
        run: |
          set -euo pipefail
          exe=$RELEASE_DIR/Clauseo; [ "$RUNNER_OS" = Windows ] && exe=$exe.exe
          [ -f "$exe" ] || { echo "::error::no app binary at $exe"; exit 1; }
          for pair in "staging-connector data-staging.clauseo.chat" "local-connector 127.0.0.1:8793"; do
            feature=${pair%% *} host=${pair#* }
            case " ${FEATURES//,/ } " in *" $feature "*) echo "built with $feature: $host expected"; continue;; esac
            found=$(LC_ALL=C tr -d '\000' < "$exe" | LC_ALL=C grep -c -a -F -e "$host") || [ $? -eq 1 ]
            if [ "$found" != 0 ]; then
              echo "::error::$exe holds $host, which only a $feature build may"
              exit 1
            fi
          done
          echo "$exe holds no connector test host"

      # A dry run's updater key: made here, with a random password, and gone with the runner.
      - name: Make a throwaway updater key (dry run)
        if: matrix.signs && env.MODE == 'dry'
        run: |
          set -euo pipefail
          head -c 32 /dev/urandom | base64 > "$RUNNER_TEMP/dry-updater.password"
          pnpm -s -C ui tauri signer generate --ci -p "$(cat "$RUNNER_TEMP/dry-updater.password")" \
            -w "$RUNNER_TEMP/dry-updater.key" > /dev/null

      # The public key of the key that signs, for the bundler's check; the app's own key was built
      # in from tauri.conf.json and is not changed here.
      - name: Choose the updater public key
        if: matrix.signs
        run: |
          set -euo pipefail
          case "$MODE" in
            dry) pub=$(cat "$RUNNER_TEMP/dry-updater.key.pub") ;;
            test) pub=$(cat crates/desktop/release/updater-test.pub) ;;
            release) pub=$(jq -r .plugins.updater.pubkey crates/desktop/tauri.conf.json) ;;
          esac
          jq -n --arg key "$pub" '{plugins: {updater: {pubkey: $key}}}' > "$RUNNER_TEMP/updater-key.conf.json"

      # The bundler signs the .app ad hoc (APPLE_SIGNING_IDENTITY "-") until S20a's Developer ID,
      # then the updater archive with the mode's key, which only this step holds.
      - name: Bundle the .app and the DMG, and sign the updater archive
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.check.outputs.mode == 'release' && secrets.TAURI_SIGNING_PRIVATE_KEY || needs.check.outputs.mode == 'test' && secrets.TAURI_SIGNING_PRIVATE_KEY_TEST || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.check.outputs.mode == 'release' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || needs.check.outputs.mode == 'test' && secrets.TAURI_SIGNING_PRIVATE_KEY_TEST_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [ "$MODE" = dry ]; then
            TAURI_SIGNING_PRIVATE_KEY=$(cat "$RUNNER_TEMP/dry-updater.key")
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$(cat "$RUNNER_TEMP/dry-updater.password")
            export TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::no updater key for a $MODE run"; exit 1; }
          pnpm -C ui tauri bundle --ci --target "$TARGET" ${FEATURES:+--features "$FEATURES"} --bundles app,dmg \
            --config release/release.conf.json --config release/blocklist.conf.json \
            --config "$RUNNER_TEMP/updater-key.conf.json" --config release/sidecars.generated.json

      # Each leg's assets, under the names latest-json.mjs lists (assemble renames the macOS
      # archive, which both macOS legs call Clauseo.app.tar.gz).
      - name: Collect this leg's assets
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          bundle=$RELEASE_DIR/bundle
          if [ "$RUNNER_OS" = macOS ]; then
            cp "$bundle/dmg/Clauseo_${VERSION}_${{ matrix.arch }}.dmg" "$OUT/"
            cp "$bundle/macos/Clauseo.app.tar.gz" "$bundle/macos/Clauseo.app.tar.gz.sig" "$OUT/"
          else
            cp "$bundle/deb/Clauseo_${VERSION}_amd64.deb" "$bundle/rpm/Clauseo-${VERSION}-1.x86_64.rpm" "$OUT/"
          fi
          ls -l "$OUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os != 'Windows'
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.OUT }}
          if-no-files-found: error

      # The exe exactly as linked, the sidecars as placed and the overlay that lists them, for
      # sign-windows to sign and bundle. Paths are kept from the repo root, so the download puts
      # each back where it was.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          name: windows-exe-${{ matrix.target }}
          path: |
            ${{ env.RELEASE_DIR }}/Clauseo.exe
            crates/desktop/binaries/*-${{ matrix.target }}.exe
            crates/desktop/release/sidecars.generated.json
          if-no-files-found: error

      # From the same link as the shipped binaries, for S22's symbols job. Never on the Release.
      # The globs take clauseo-mcp's .pdb, .dSYM or .dwp beside the app's (agent-browser is
      # fetched, so it has none).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-files-${{ matrix.target }}
          path: |
            ${{ env.RELEASE_DIR }}/*.dSYM
            ${{ env.RELEASE_DIR }}/*.pdb
            ${{ env.RELEASE_DIR }}/*.dwp
          if-no-files-found: error

      # budgets.toml's release_binary_size is the app binary alone; each sidecar gets its own row
      # beside it, never counted in that limit. deb_size is the .deb.
      # minimumWebview2Version in tauri.conf.json is this runner's WebView2 major version as of
      # when S20 landed, raised only on purpose. This line shows what the runner has now. It never
      # fails the job.
      - name: The runner's WebView2 version, beside minimumWebview2Version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $id = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$id",
                  "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$id",
                  "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$id"
          $pv = $keys | ForEach-Object { (Get-ItemProperty -Path $_ -ErrorAction SilentlyContinue).pv } |
            Where-Object { $_ } | Select-Object -First 1
          if (-not $pv) { $pv = 'not found' }
          $min = (Get-Content crates/desktop/tauri.conf.json -Raw | ConvertFrom-Json).bundle.windows.minimumWebview2Version
          "WebView2 Runtime on this runner: $pv; minimumWebview2Version: $min" |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # The sizes go to the log as well, where `gh run view --log` reads them. The budgets.toml
      # rows are Linux's: release_binary_size (the app binary alone), agent_browser_size and
      # clauseo_mcp_size (each sidecar), deb_total_size (the .deb as shipped) and deb_size (the
      # app's own payload: the .deb repacked without the clauseo-* sidecars in /usr/bin, gzip -6 as
      # Tauri's, so it stays comparable with the rows measured before the sidecars). dpkg-deb's
      # gzip is a little tighter than Tauri's, so the whole .deb repacked the same way is shown
      # beside it for comparison.
      - name: Sizes to the job summary
        run: |
          set -euo pipefail
          size() { wc -c < "$1" | tr -d ' '; }
          row() { echo "| $1 | $2 | $(awk -v b="$2" 'BEGIN { printf "%.2f", b / 1000000 }') |"; }
          # $1 the .deb, $2 the output, $3 "app" to leave the sidecars out.
          repack() {
            local dir=$RUNNER_TEMP/deb-repack
            rm -rf "$dir"
            dpkg-deb -R "$1" "$dir"
            if [ "$3" = app ]; then
              compgen -G "$dir/usr/bin/clauseo-*" > /dev/null ||
                { echo "::error::no clauseo-* sidecar in the .deb's /usr/bin to leave out"; exit 1; }
              rm "$dir"/usr/bin/clauseo-*
              sed -i '/ usr\/bin\/clauseo-/d' "$dir/DEBIAN/md5sums"
              [ -f "$dir/usr/bin/Clauseo" ] || { echo "::error::the repacked .deb lost usr/bin/Clauseo"; exit 1; }
            fi
            dpkg-deb -Zgzip -z6 --root-owner-group -b "$dir" "$2" > /dev/null
          }
          exe=$RELEASE_DIR/Clauseo; [ "$RUNNER_OS" = Windows ] && exe=$exe.exe
          {
            echo "### Sizes, $TARGET"
            echo "| file | bytes | MB |"
            echo "|---|---|---|"
            row "app binary (release_binary_size)" "$(size "$exe")"
            for sidecar in crates/desktop/binaries/*-"$TARGET"*; do
              [ -e "$sidecar" ] || continue
              id=""
              if [ "$RUNNER_OS" = Linux ]; then
                case "$(basename "$sidecar")" in
                  clauseo-agent-browser-*) id=" (agent_browser_size)" ;;
                  clauseo-mcp-*) id=" (clauseo_mcp_size)" ;;
                esac
              fi
              row "sidecar $(basename "$sidecar")$id" "$(size "$sidecar")"
            done
            if [ -d "$OUT" ]; then
              for asset in "$OUT"/*; do
                case "$asset" in
                  *.deb)
                    row "$(basename "$asset") (deb_total_size)" "$(size "$asset")"
                    repack "$asset" "$RUNNER_TEMP/app-only.deb" app
                    row "the .deb without its sidecars, repacked (deb_size)" "$(size "$RUNNER_TEMP/app-only.deb")"
                    repack "$asset" "$RUNNER_TEMP/whole.deb" whole
                    row "the whole .deb, repacked the same way (for comparison)" "$(size "$RUNNER_TEMP/whole.deb")"
                    ;;
                  *.sig) ;;
                  *) row "$(basename "$asset")" "$(size "$asset")" ;;
                esac
              done
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The Windows exe, as built, signed (SignPath, S20a: v* only, once vars.SIGNPATH_ENABLED is
  # true; until then it passes through), then bundled into both installers without patching the
  # signed binary, then the currentUser installer's updater signature, last.
  sign-windows:
    name: sign-windows (${{ matrix.target }})
    needs: [check, build, blocklist]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.tier == 2 }}
    environment: ${{ needs.check.outputs.environment }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, runner: windows-2025, tier: 1, arch: x64 }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm, tier: 2, arch: arm64 }
    env:
      TARGET: ${{ matrix.target }}
      MODE: ${{ needs.check.outputs.mode }}
      VERSION: ${{ needs.check.outputs.version }}
      FEATURES: ${{ needs.check.outputs.features }}
      RELEASE_DIR: target/${{ matrix.target }}/release
      OUT: ${{ github.workspace }}/release-out
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain from rust-toolchain.toml, and the target
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/package.json
          package-manager-cache: false

      # Before any secret. The bundler reads the crate graph (cargo metadata), so the crates too.
      - name: Install the ui workspace and fetch the crates
        run: |
          pnpm -C ui install --frozen-lockfile
          cargo fetch --locked

      # Clauseo.exe back in $RELEASE_DIR, the sidecars in crates/desktop/binaries/ and the
      # overlay in crates/desktop/release/, exactly as the build leg left them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-exe-${{ matrix.target }}

      - name: The downloaded overlay holds only bundle.externalBin
        run: node .github/scripts/sidecars.mjs --check

      # The same verified snapshot the build leg compiled with, for both installers.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blocklist-snapshot
          path: crates/desktop/blocklist

      # S20a signs every PE the installers take: Clauseo.exe and each file in
      # crates/desktop/binaries/ (clauseo-mcp, clauseo-agent-browser, later S15's tools), before NSIS.
      - name: SignPath, the exe and the sidecars (S20a)
        if: needs.check.outputs.mode == 'release' && vars.SIGNPATH_ENABLED == 'true'
        run: |
          echo "::error::SIGNPATH_ENABLED is true, but S20a has not added the SignPath step yet"
          exit 1

      - name: Make a throwaway updater key (dry run)
        if: env.MODE == 'dry'
        run: |
          set -euo pipefail
          head -c 32 /dev/urandom | base64 > "$RUNNER_TEMP/dry-updater.password"
          pnpm -s -C ui tauri signer generate --ci -p "$(cat "$RUNNER_TEMP/dry-updater.password")" \
            -w "$RUNNER_TEMP/dry-updater.key" > /dev/null

      # S15's sandbox tool, with the updater key the currentUser installer is signed with below,
      # after SignPath (which changes its bytes) and before NSIS: its .sig is over the bytes that
      # ship. tauri signer writes <exe>.sig beside it, for both installers and the Release.
      - name: Sign the sandbox tool for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.check.outputs.mode == 'release' && secrets.TAURI_SIGNING_PRIVATE_KEY || needs.check.outputs.mode == 'test' && secrets.TAURI_SIGNING_PRIVATE_KEY_TEST || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.check.outputs.mode == 'release' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || needs.check.outputs.mode == 'test' && secrets.TAURI_SIGNING_PRIVATE_KEY_TEST_PASSWORD || '' }}
        run: |
          set -euo pipefail
          exe=crates/desktop/binaries/${SANDBOX_EXE%.exe}-$TARGET.exe
          [ -f "$exe" ] || { echo "::error::no $exe in windows-exe-$TARGET"; exit 1; }
          if [ "$MODE" = dry ]; then
            TAURI_SIGNING_PRIVATE_KEY=$(cat "$RUNNER_TEMP/dry-updater.key")
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$(cat "$RUNNER_TEMP/dry-updater.password")
            export TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::no updater key for a $MODE run"; exit 1; }
          # tauri signer puts the signed file's base name in the trusted comment (file:<name>), and
          # the sandbox's verifier wants the installed name: sign a copy named SANDBOX_EXE, the
          # same bytes, and put its .sig where the bundle overlay expects it.
          dir=$RUNNER_TEMP/sign-$TARGET
          mkdir -p "$dir"
          cp "$exe" "$dir/$SANDBOX_EXE"
          pnpm -C ui tauri signer sign --app-version "$VERSION" "$dir/$SANDBOX_EXE"
          cmp "$exe" "$dir/$SANDBOX_EXE"
          mv "$dir/$SANDBOX_EXE.sig" "$exe.sig"

      # --no-binary-patching keeps the signed exe as signed (the updater then reads the plain
      # windows-<arch> key of latest.json); --no-sign leaves the updater signature to the last
      # step. Both installers ship the same exe, and the sidecars the overlay lists, beside it. A
      # generated bundle.resources overlay puts the sandbox tool's .sig beside it too: NSIS installs
      # resources and externalBin alike under $INSTDIR, each at its target name. That exe and .sig
      # also go on the Release as <name>-<arch>.exe and .exe.sig. A merge patch merges objects, so
      # its bundle.resources entry joins blocklist.conf.json's two rather than replacing them.
      - name: Bundle the currentUser and perMachine installers
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          nsis=$RELEASE_DIR/bundle/nsis
          sig=binaries/${SANDBOX_EXE%.exe}-$TARGET.exe.sig
          [ -f "crates/desktop/$sig" ] || { echo "::error::no crates/desktop/$sig"; exit 1; }
          node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({ bundle: { resources: { [process.argv[2]]: process.argv[3] } } }))' \
            "$RUNNER_TEMP/sandbox-sig.conf.json" "$sig" "$SANDBOX_EXE.sig"
          # makensis's warnings (an unused LangString, a macro left out, a jump to nowhere) don't fail its
          # compile, and the bundler hides makensis's output unless --verbose. So both bundles run verbose
          # into one log (each call piped to tee; pipefail keeps tauri's own exit code), which must hold
          # makensis's output, so the check can't pass on an empty log, and no "N warning(s):" summary.
          log=$RUNNER_TEMP/makensis.log
          : > "$log"
          bundle() {
            rm -rf "$nsis"
            pnpm -C ui tauri bundle --ci --verbose --target "$TARGET" ${FEATURES:+--features "$FEATURES"} --bundles nsis \
              --no-binary-patching --no-sign --config release/release.conf.json --config release/blocklist.conf.json \
              --config release/windows.conf.json "$@" \
              --config "$RUNNER_TEMP/sandbox-sig.conf.json" --config release/sidecars.generated.json
          }
          bundle 2>&1 | tee -a "$log"
          mv "$nsis/Clauseo_${VERSION}_${{ matrix.arch }}-setup.exe" "$OUT/"
          bundle --config release/machine.conf.json 2>&1 | tee -a "$log"
          mv "$nsis/Clauseo_${VERSION}_${{ matrix.arch }}-setup.exe" "$OUT/Clauseo_${VERSION}_${{ matrix.arch }}-machine-setup.exe"
          if ! grep -Eq 'Processing script file|Output: ".*\.exe"' "$log"; then
            echo "::error::no makensis output in the bundle log, so its warnings can't be checked"
            exit 1
          fi
          # Not anchored: the bundler may prefix each line of makensis's output with its own log tag.
          if grep -Eq '(^|[^0-9])[0-9]+ warnings?:' "$log"; then
            echo "::error::makensis warned while building the installers"
            grep -E -A40 '(^|[^0-9])[0-9]+ warnings?:' "$log"
            exit 1
          fi
          asset=${SANDBOX_EXE%.exe}-${{ matrix.arch }}.exe
          cp "crates/desktop/${sig%.sig}" "$OUT/$asset"
          cp "crates/desktop/$sig" "$OUT/$asset.sig"
          ls -l "$OUT"

      - name: SignPath, the installers (S20a)
        if: needs.check.outputs.mode == 'release' && vars.SIGNPATH_ENABLED == 'true'
        run: |
          echo "::error::SIGNPATH_ENABLED is true, but S20a has not added the SignPath step yet"
          exit 1

      # Last, over the installer as it ships: the currentUser one, the one that updates itself.
      - name: Sign the currentUser installer for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.check.outputs.mode == 'release' && secrets.TAURI_SIGNING_PRIVATE_KEY || needs.check.outputs.mode == 'test' && secrets.TAURI_SIGNING_PRIVATE_KEY_TEST || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.check.outputs.mode == 'release' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || needs.check.outputs.mode == 'test' && secrets.TAURI_SIGNING_PRIVATE_KEY_TEST_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [ "$MODE" = dry ]; then
            TAURI_SIGNING_PRIVATE_KEY=$(cat "$RUNNER_TEMP/dry-updater.key")
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$(cat "$RUNNER_TEMP/dry-updater.password")
            export TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::no updater key for a $MODE run"; exit 1; }
          pnpm -C ui tauri signer sign --app-version "$VERSION" "$OUT/Clauseo_${VERSION}_${{ matrix.arch }}-setup.exe"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.OUT }}
          if-no-files-found: error

      # A dry run's throwaway public key, for assemble to check this leg's signatures with. Never
      # on a Release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.MODE == 'dry'
        with:
          name: dry-updater-pub-${{ matrix.target }}
          path: ${{ runner.temp }}/dry-updater.key.pub
          if-no-files-found: error

      - name: Sizes to the job summary
        run: |
          set -euo pipefail
          {
            echo "### Installers, $TARGET"
            echo "| file | bytes | MB |"
            echo "|---|---|---|"
            for asset in "$OUT"/*.exe; do
              bytes=$(wc -c < "$asset" | tr -d ' ')
              echo "| $(basename "$asset") | $bytes | $(awk -v b="$bytes" 'BEGIN { printf "%.2f", b / 1000000 }') |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # The Release: latest.json, SHA256SUMS.txt, an attestation per asset, then a draft (release) or
  # a public pre-release (test). A dry run stops at the artifact dist-assets.
  assemble:
    name: assemble
    needs: [check, build, sign-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      MODE: ${{ needs.check.outputs.mode }}
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/package.json
          package-manager-cache: false

      # Each leg in a folder of its own: both macOS legs hold a Clauseo.app.tar.gz.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: ${{ runner.temp }}/legs

      # A dry run signs each Windows leg with that leg's throwaway key; a release or a test run
      # takes its public key from the repo.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.MODE == 'dry'
        with:
          pattern: dry-updater-pub-*
          path: ${{ runner.temp }}/pub

      # 7-Zip reads NSIS installers: the next step looks inside them.
      - name: Install 7-Zip
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends p7zip-full

      - name: Name the assets, write latest.json and SHA256SUMS.txt
        run: |
          set -euo pipefail
          mkdir dist
          for leg in "$RUNNER_TEMP"/legs/release-*; do
            case "$leg" in
              *-aarch64-apple-darwin) arch=aarch64 ;;
              *-x86_64-apple-darwin) arch=x64 ;;
              *) arch="" ;;
            esac
            if [ -n "$arch" ]; then
              mv "$leg/Clauseo.app.tar.gz" "$leg/Clauseo_${VERSION}_${arch}.app.tar.gz"
              mv "$leg/Clauseo.app.tar.gz.sig" "$leg/Clauseo_${VERSION}_${arch}.app.tar.gz.sig"
            fi
            mv "$leg"/* dist/
          done
          # A dry run publishes nothing; its URLs point at a tag that does not exist.
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/${TAG:-dry-run}"
          node .github/scripts/latest-json.mjs dist "$VERSION" "$base" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$SANDBOX_EXE" > missing.txt
          # Nothing but the table's assets, their .sig and latest.json.
          known=$(node --input-type=module -e "
            import { assets } from './.github/scripts/latest-json.mjs';
            for (const a of assets(process.argv[1], process.argv[2])) console.log(a.platforms || a.signed ? a.name + '\n' + a.name + '.sig' : a.name);
          " "$VERSION" "$SANDBOX_EXE")
          for file in dist/*; do
            name=$(basename "$file")
            [ "$name" = latest.json ] || grep -qxF "$name" <<< "$known" ||
              { echo "::error::$name is not an asset latest-json.mjs lists"; exit 1; }
          done
          (cd dist && sha256sum -- * > ../SHA256SUMS.txt) && mv SHA256SUMS.txt dist/
          (cd dist && sha256sum -c SHA256SUMS.txt)
          # S15's sandbox tool: per architecture, both installers must place exactly the published
          # exe and its .sig at the install folder's root, and the .sig (and the currentUser
          # installer's) must hold under this mode's updater public key. A tier 2 leg that failed
          # left none of these files; latest-json.mjs has already required the tier 1 ones.
          updater_pub() {
            case "$MODE" in
              dry) cat "$RUNNER_TEMP/pub/dry-updater-pub-$1/dry-updater.key.pub" ;;
              test) cat crates/desktop/release/updater-test.pub ;;
              release) jq -r .plugins.updater.pubkey crates/desktop/tauri.conf.json ;;
            esac
          }
          inside=()
          for arch in x64 arm64; do
            case $arch in
              x64) target=x86_64-pc-windows-msvc label="Windows x64" ;;
              arm64) target=aarch64-pc-windows-msvc label="Windows ARM64" ;;
            esac
            exe=dist/${SANDBOX_EXE%.exe}-$arch.exe
            files=("dist/Clauseo_${VERSION}_${arch}-setup.exe" "dist/Clauseo_${VERSION}_${arch}-machine-setup.exe" "$exe" "$exe.sig")
            present=0
            for file in "${files[@]}"; do [ ! -f "$file" ] || present=$((present + 1)); done
            [ "$present" != 0 ] || continue
            [ "$present" = 4 ] || { echo "::error::the $arch leg left only some of ${files[*]}"; exit 1; }
            pub=$RUNNER_TEMP/updater-$arch.pub
            updater_pub "$target" > "$pub" || true
            [ -n "$(tr -d '[:space:]' < "$pub")" ] || { echo "::error::no updater public key for $arch in a $MODE run"; exit 1; }
            # Each signed for this version, under the name it was signed as (the trusted comment's
            # file:): the sandbox tool as installed, the installer as published.
            node .github/scripts/latest-json.mjs --verify "$exe" "$pub" "$SANDBOX_EXE" "$VERSION" ||
              { echo "::error::$(basename "$exe").sig does not hold under the $MODE updater key for file:$SANDBOX_EXE, version:$VERSION"; exit 1; }
            node .github/scripts/latest-json.mjs --verify "${files[0]}" "$pub" "$(basename "${files[0]}")" "$VERSION" ||
              { echo "::error::$(basename "${files[0]}").sig does not hold under the $MODE updater key"; exit 1; }
            # The updater key ID the tool was built with (its VERSIONINFO string UpdaterKeyId, stage
            # C) must be this mode's: test's updater-test.pub, release's tauri.conf.json pubkey, dry's
            # the same when set, else build.rs's placeholder (latest-json.mjs, expectedKeyId). A tool
            # without the string (3) fails too: crates/sandbox/build.rs writes it into every msvc build.
            status=0
            node .github/scripts/latest-json.mjs --key-id "$exe" "$MODE" || status=$?
            case $status in
              0) ;;
              3) echo "::error::$(basename "$exe") has no UpdaterKeyId, so its updater key ID can't be compared with the $MODE key"; exit 1 ;;
              *) echo "::error::$(basename "$exe") does not carry the $MODE updater key ID (see above)"; exit 1 ;;
            esac
            for installer in "${files[0]}" "${files[1]}"; do
              listing=$(7z l -slt -ba "$installer" | sed -n 's/^Path = //p')
              for inner in "$SANDBOX_EXE" "$SANDBOX_EXE.sig"; do
                published=$exe; [ "$inner" = "$SANDBOX_EXE" ] || published=$exe.sig
                grep -qxF "$inner" <<< "$listing" ||
                  { echo "::error::$(basename "$installer") has no $inner at the install folder's root"; exit 1; }
                7z e -so -spd "$installer" "$inner" | cmp - "$published" ||
                  { echo "::error::$inner in $(basename "$installer") is not the published $(basename "$published")"; exit 1; }
              done
            done
            inside+=("| $label | \`$(basename "$exe")\` | \`$(sha256sum < "$exe" | cut -d ' ' -f 1)\` |")
          done
          {
            echo "Clauseo $VERSION, built from $GITHUB_SHA by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
            echo
            echo "Check a download with \`sha256sum -c SHA256SUMS.txt --ignore-missing\`."
            echo
            echo "## Which Windows installer"
            echo
            echo "- **For your own Windows account** (most people): \`Clauseo_${VERSION}_x64-setup.exe\`, or \`Clauseo_${VERSION}_arm64-setup.exe\` on Windows on ARM."
            echo "- **For every account on the computer** (IT, run as an administrator): \`Clauseo_${VERSION}_x64-machine-setup.exe\`, or \`Clauseo_${VERSION}_arm64-machine-setup.exe\`."
            if [ -s missing.txt ]; then
              echo
              echo "Not in this release (a tier 2 build failed):"
              sed 's/^missing /- /' missing.txt
            fi
            echo
            echo "## Inside the Windows installers"
            echo
            echo "Both Windows installers of an architecture, per-user and per-machine, place the same \`$SANDBOX_EXE\`, Clauseo's sandbox tool, and its signature \`$SANDBOX_EXE.sig\` in the install folder. Both are on this release too, under the asset name below. IT can compare a copy restored from quarantine with this SHA-256 (\`Get-FileHash\` in PowerShell)."
            echo
            echo "| architecture | asset | SHA-256 of $SANDBOX_EXE |"
            echo "|---|---|---|"
            printf '%s\n' "${inside[@]}"
          } > notes.md
          {
            echo "### Release assets, $MODE"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-assets
          path: dist
          if-no-files-found: error

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.MODE != 'dry'
        with:
          subject-path: dist/*

      - name: Create the GitHub Release
        if: env.MODE != 'dry'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$MODE" = release ]; then kind=--draft; else kind=--prerelease; fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag "$kind" \
            --title "Clauseo $VERSION" --notes-file notes.md

  # Publishes a v* draft once Rohan approves it (environment release-publish). Refuses while a DMG
  # is missing or not notarised and stapled: no release before the Apple account (QF.2 (a)).
  publish:
    name: publish
    needs: [check, assemble]
    if: needs.check.outputs.mode == 'release'
    runs-on: macos-15
    timeout-minutes: 20
    environment: release-publish
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every DMG is notarised and stapled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --dir "$RUNNER_TEMP/dmg"
          [ -f "$RUNNER_TEMP/dmg/Clauseo_${VERSION}_aarch64.dmg" ] ||
            { echo "::error::the draft has no Clauseo_${VERSION}_aarch64.dmg"; exit 1; }
          for dmg in "$RUNNER_TEMP"/dmg/*.dmg; do
            xcrun stapler validate "$dmg" || { echo "::error::$(basename "$dmg") is not notarised and stapled"; exit 1; }
          done

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: vars.COUNTS_RELEASES_ENABLED == 'true'
        with:
          node-version-file: ui/package.json
          package-manager-cache: false

      # S23's script, POST /v1/releases. Skipped until Rohan's Cloudflare set-up turns it on.
      - name: Record the release (S23)
        if: vars.COUNTS_RELEASES_ENABLED == 'true'
        env:
          CLAUSEO_RELEASE_ACCESS_CLIENT_ID: ${{ secrets.CLAUSEO_RELEASE_ACCESS_CLIENT_ID }}
          CLAUSEO_RELEASE_ACCESS_CLIENT_SECRET: ${{ secrets.CLAUSEO_RELEASE_ACCESS_CLIENT_SECRET }}
        run: node .github/scripts/record-release.mjs "$VERSION" stable

  # S24's measuring builds: the shipped ui, release flags and profile, with `marks` on macOS and
  # `e2e` on Windows, each with fake_agent beside it. No environment, no secret, never on a
  # Release.
  measure-builds:
    name: measure-builds (${{ matrix.target }})
    needs: [check, ui, blocklist]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15, feature: marks, exe: "" }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025, feature: e2e, exe: .exe }
    env:
      TARGET: ${{ matrix.target }}
      RUSTFLAGS: "-C force-frame-pointers=yes"
      RELEASE_DIR: target/${{ matrix.target }}/release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain from rust-toolchain.toml, and the target
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/package.json
          package-manager-cache: false

      - name: Install the ui workspace and fetch the crates
        run: |
          pnpm -C ui install --frozen-lockfile
          cargo fetch --locked

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ui/app/dist

      # The same snapshot as the shipped builds, so the measured app starts as they do.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blocklist-snapshot
          path: crates/desktop/blocklist

      - name: Build the app with ${{ matrix.feature }}, and fake_agent
        run: |
          set -euo pipefail
          pnpm -C ui tauri build --ci --target "$TARGET" --features "${{ matrix.feature }}" \
            --config release/release.conf.json --config release/blocklist.conf.json --no-bundle -- --locked
          cargo build --release --locked -p clauseo-fake_agent --target "$TARGET"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clauseo-${{ matrix.feature }}-${{ matrix.target }}
          path: |
            ${{ env.RELEASE_DIR }}/Clauseo${{ matrix.exe }}
            ${{ env.RELEASE_DIR }}/fake_agent${{ matrix.exe }}
          if-no-files-found: error
