# Nightly fuzzing of the parsers that read input we don't control: agent stdout (acp), the wire
# types (protocol), matter folders and their history (matters), the store's SQLite file (store),
# settings files (settings) and reducer snapshots (reducer). The targets, seeds and how to run
# them locally are in fuzz/README.md.
#
# - Runs only on the schedule and by hand (workflow_dispatch, which needs write access). No pull
#   request or push event, so nothing a fork can open or push starts it.
# - 01:23 UTC: the org's quietest hour, and done before ci.yml's nightly at 03:17.
# - First checks nightly.sh's reporting with stand-in fuzzers (fuzz/test-nightly.sh), then builds
#   every target (a harness that no longer compiles fails the job before any fuzzing), then
#   fuzzes each for FUZZ_SECONDS, as many at once as the runner has cores (fuzz/nightly.sh).
# - The corpus is an artifact, fuzz-corpus, kept 14 days. Each night downloads it from the newest
#   fuzz run on main that has one, cuts it to the inputs that add coverage, and uploads it again.
#   Only main's artifacts are ever used: a run dispatched from another branch uploads one too,
#   but nothing reads it. The committed seeds in fuzz/seeds/ start the corpus when there is none,
#   and the job summary says which. (Not the Actions cache: CI's caches fill it past its 10 GB
#   limit, and a once-a-night entry was evicted within minutes.)
# - A panic, timeout or out-of-memory stop uploads its input, log and minimised input (kept 14
#   days), fails the job, and the report job opens one issue or comments on the open one. This
#   repo is public, so all of that is public. Withheld: sanitizer reports, the panics of Rust's
#   UB checks, and crashes with no panic. Their log and input stay on the runner, the issue
#   names only the target, and that night's corpus is not uploaded.
#   Moving crash reports private before the private beta: clauseo-ai/clauseo-acp-private#180.
# - The fuzz job can read the repo and its Actions runs (to find and download the corpus), and
#   nothing else. Only the report job can write, and only to issues. It checks out nothing, runs no code from the repo, and posts the fuzz job's text only
#   in the shapes nightly.sh writes. No secrets are used.
name: fuzz

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds of fuzzing per target (1 to 900)
        required: false
        default: "480"

permissions: {}

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read # to find the newest fuzz run on main and download its corpus artifact
    outputs:
      found: ${{ steps.run.outputs.found }}
      title: ${{ steps.run.outputs.title }}
      issue: ${{ steps.run.outputs.issue }}
    env:
      # The cargo-fuzz release the targets are built with. The nightly Rust it needs is pinned in
      # fuzz/rust-toolchain.toml.
      CARGO_FUZZ_VERSION: 0.13.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check what nightly.sh reports and withholds
        working-directory: fuzz
        run: ./test-nightly.sh

      - name: Install the nightly Rust from fuzz/rust-toolchain.toml
        working-directory: fuzz
        run: rustup toolchain install

      - name: Install cargo-fuzz
        working-directory: fuzz
        run: cargo install --locked cargo-fuzz --version "$CARGO_FUZZ_VERSION"

      # cargo fuzz build has no --locked: fetching first fails the job if fuzz/Cargo.lock no
      # longer covers the crates, instead of resolving new versions quietly.
      - name: Fetch the locked dependencies
        working-directory: fuzz
        run: cargo fetch --locked

      - name: Build every target
        working-directory: fuzz
        run: cargo fuzz build --fuzz-dir . -O --debug-assertions

      # Only runs of this workflow on main are looked at (schedule, or dispatched with main as the
      # ref), newest first; the first with an unexpired fuzz-corpus artifact is used. This run is
      # still in progress, so it is not among them.
      - name: Download the newest corpus from main
        id: corpus
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          from=""
          runs=$(gh run list --workflow fuzz.yml --branch main --status completed --limit 30 \
            --json databaseId,headBranch,event \
            --jq '.[] | select(.headBranch == "main" and (.event == "schedule" or .event == "workflow_dispatch")) | .databaseId')
          for run in $runs; do
            if [[ -n $(gh api "repos/$GH_REPO/actions/runs/$run/artifacts" \
              --jq '.artifacts[] | select(.name == "fuzz-corpus" and (.expired | not)) | .id') ]]; then
              gh run download "$run" --name fuzz-corpus --dir fuzz/corpus
              from=$run
              break
            fi
          done
          echo "from=$from" >>"$GITHUB_OUTPUT"

      - name: Fuzz
        id: run
        working-directory: fuzz
        env:
          FUZZ_SECONDS: ${{ inputs.seconds || '480' }}
          CORPUS_RUN: ${{ steps.corpus.outputs.from }}
        run: |
          set -euo pipefail
          if [[ ! $FUZZ_SECONDS =~ ^[0-9]{1,4}$ ]] || ((10#$FUZZ_SECONDS < 1 || 10#$FUZZ_SECONDS > 900)); then
            echo "seconds must be a whole number from 1 to 900" >&2
            exit 1
          fi
          ./nightly.sh "$((10#$FUZZ_SECONDS))"
          {
            echo "Corpus: ${CORPUS_RUN:+the artifact of run }${CORPUS_RUN:-none on main, so the run started from fuzz/seeds/}"
            echo
            cat out/summary.md
          } >>"$GITHUB_STEP_SUMMARY"
          echo "found=$(cat out/found)" >>"$GITHUB_OUTPUT"
          echo "withheld=$(cat out/withheld)" >>"$GITHUB_OUTPUT"
          if [[ -s out/title.txt ]]; then
            delimiter="issue-$(openssl rand -hex 16)"
            {
              echo "title=$(cat out/title.txt)"
              echo "issue<<$delimiter"
              cat out/issue.md
              echo "$delimiter"
            } >>"$GITHUB_OUTPUT"
            {
              echo
              cat out/issue.md
            } >>"$GITHUB_STEP_SUMMARY"
          fi

      # The corpus never holds a crashing input (libFuzzer writes those to fuzz/artifacts/), so it
      # is uploaded on finding nights too, but not after a withheld finding: this repo's artifacts
      # are public, and the corpus holds the inputs that crash was found from. overwrite: a re-run
      # of this run replaces the first attempt's corpus.
      - name: Upload the corpus
        if: always() && steps.run.outcome == 'success' && steps.run.outputs.withheld != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus
          path: fuzz/corpus/
          retention-days: 14
          overwrite: true

      - name: Upload the findings
        if: always() && hashFiles('fuzz/out/upload/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ github.run_id }}-${{ github.run_attempt }}
          path: fuzz/out/upload/
          retention-days: 14

      - name: Fail on a finding
        if: steps.run.outputs.found == 'true'
        run: |
          echo "fuzzing found problems; see the job summary" >&2
          exit 1

  report:
    name: report
    needs: fuzz
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # to open the fuzz issue or comment on it
    steps:
      # One issue at a time: the open issue this workflow opened gets a comment, otherwise a new
      # one opens. A failure with no finding (a build that breaks, a step that errors) reports too.
      # The fuzz job's title and text are used only in the shapes nightly.sh writes; anything else
      # gets the generic text.
      - name: Open or update the fuzz issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FOUND: ${{ needs.fuzz.outputs.found }}
          FINDING_TITLE: ${{ needs.fuzz.outputs.title }}
          FINDING_TEXT: ${{ needs.fuzz.outputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Byte-wise matching, so the character classes below hold only printable ASCII.
          export LC_ALL=C
          marker='<!-- fuzz-nightly -->'
          title="nightly fuzz: the job failed"
          text="The fuzz job failed. The run below has the details."
          title_re='^nightly fuzz: ([a-z_]+ (panicked|timed out|ran out of memory|crashed|stopped with an error)|findings in [a-z_]+(, [a-z_]+)*)$'
          # shellcheck disable=SC2016 # the backticks in line_re are literal, not command substitution
          line_re='^- `[a-z_]+`( panicked at `[ -_a-~]{0,300}`|: an input ran past its timeout\.|: an input went over the memory limit \(2048 MB\)\.| crashed\. Its report and input are not posted\.|: the fuzzer stopped with an error before its time was up\.)$'
          if [[ $FOUND == true && $FINDING_TITLE =~ $title_re && -n $FINDING_TEXT ]] &&
            (($(printf '%s\n' "$FINDING_TEXT" | wc -l) <= 7)) &&
            ! printf '%s\n' "$FINDING_TEXT" | grep -Evq "$line_re"; then
            title=$FINDING_TITLE
            text=$FINDING_TEXT
          fi
          printf '%s\n%s\n\nRun: %s\n' "$marker" "$text" "$RUN_URL" >body.md
          number=$(gh api -X GET "repos/$GH_REPO/issues" -f state=open -f creator='github-actions[bot]' \
            -f per_page=100 --jq "map(select(.pull_request == null and .user.login == \"github-actions[bot]\"
              and ((.body // \"\") | startswith(\"$marker\")))) | .[0].number // empty")
          if [[ -n $number ]]; then
            printf '%s\n\n' "$title" | cat - body.md >comment.md
            gh issue comment "$number" --body-file comment.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
