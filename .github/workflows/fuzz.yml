# Nightly fuzzing of the parsers that read input we don't control: agent stdout (acp), the wire
# types (protocol), matter folders and their history (matters), the store's SQLite file (store),
# settings files (settings) and reducer snapshots (reducer). The targets, seeds and how to run
# them locally are in fuzz/README.md.
#
# - Runs only on the schedule and by hand (workflow_dispatch, which needs write access). No pull
#   request or push event, so nothing a fork can open or push starts it.
# - 01:23 UTC: the org's quietest hour, and done before ci.yml's nightly at 03:17.
# - Builds every target first (a harness that no longer compiles fails the job before any fuzzing),
#   then fuzzes each for FUZZ_SECONDS, as many at once as the runner has cores (fuzz/nightly.sh).
# - The corpus lives in the Actions cache, cut to the inputs that add coverage each night, in one
#   entry. The committed seeds in fuzz/seeds/ start it when there is no cache.
# - A finding uploads its input, minimised input and log (kept 14 days), fails the job, and the
#   report job opens one issue or comments on the open one. This repo is public, so all of that
#   is public. Sanitizer reports are withheld: no log, no input, only the target's name.
#   Moving crash reports private before the private beta: clauseo-ai/clauseo-acp-private#180.
# - The fuzz job can read the repo and nothing else. Only the report job can write, and only to
#   issues. It checks out nothing and runs no code from the repo. No secrets are used.
name: fuzz

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds of fuzzing per target (1 to 900)
        required: false
        default: "480"

permissions: {}

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    outputs:
      found: ${{ steps.run.outputs.found }}
      title: ${{ steps.run.outputs.title }}
      issue: ${{ steps.run.outputs.issue }}
    env:
      # The cargo-fuzz release the targets are built with. The nightly Rust it needs is pinned in
      # fuzz/rust-toolchain.toml.
      CARGO_FUZZ_VERSION: 0.13.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the nightly Rust from fuzz/rust-toolchain.toml
        working-directory: fuzz
        run: rustup toolchain install

      - name: Install cargo-fuzz
        working-directory: fuzz
        run: cargo install --locked cargo-fuzz --version "$CARGO_FUZZ_VERSION"

      - name: Build every target
        working-directory: fuzz
        run: cargo fuzz build --fuzz-dir . -O --debug-assertions

      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-

      - name: Fuzz
        id: run
        working-directory: fuzz
        env:
          FUZZ_SECONDS: ${{ inputs.seconds || '480' }}
        run: |
          set -euo pipefail
          if [[ ! $FUZZ_SECONDS =~ ^[0-9]+$ ]] || ((FUZZ_SECONDS < 1 || FUZZ_SECONDS > 900)); then
            echo "seconds must be a whole number from 1 to 900" >&2
            exit 1
          fi
          ./nightly.sh "$FUZZ_SECONDS"
          cat out/summary.md >>"$GITHUB_STEP_SUMMARY"
          echo "found=$(cat out/found)" >>"$GITHUB_OUTPUT"
          if [[ -s out/title.txt ]]; then
            delimiter="issue-$(openssl rand -hex 16)"
            {
              echo "title=$(cat out/title.txt)"
              echo "issue<<$delimiter"
              cat out/issue.md
              echo "$delimiter"
            } >>"$GITHUB_OUTPUT"
            {
              echo
              cat out/issue.md
            } >>"$GITHUB_STEP_SUMMARY"
          fi

      # Saved on finding nights too: the corpus never holds a crashing input (libFuzzer writes those
      # to fuzz/artifacts/), and it keeps the night's coverage.
      - name: Save the corpus
        if: always() && steps.run.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the findings
        if: steps.run.outputs.found == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ github.run_id }}-${{ github.run_attempt }}
          path: fuzz/out/upload/
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail on a finding
        if: steps.run.outputs.found == 'true'
        run: |
          echo "fuzzing found crashes; see the job summary" >&2
          exit 1

  report:
    name: report
    needs: fuzz
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # to open the fuzz issue or comment on it
    steps:
      # One issue at a time: the open one carrying the marker gets a comment, otherwise a new one
      # opens. A failure with no findings (a build that breaks, a step that errors) reports too.
      - name: Open or update the fuzz issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FOUND: ${{ needs.fuzz.outputs.found }}
          FINDING_TITLE: ${{ needs.fuzz.outputs.title }}
          FINDING_TEXT: ${{ needs.fuzz.outputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker='<!-- fuzz-nightly -->'
          if [[ $FOUND == true ]]; then
            title=$FINDING_TITLE
            text=$FINDING_TEXT
          else
            title="nightly fuzz: the job failed before fuzzing finished"
            text="The fuzz job failed without a finding, so a build or a step broke."
          fi
          printf '%s\n%s\n\nRun: %s\n' "$marker" "$text" "$RUN_URL" >body.md
          number=$(gh issue list --state open --limit 200 --json number,body \
            --jq "map(select(.body | startswith(\"$marker\"))) | .[0].number // empty")
          if [[ -n $number ]]; then
            printf '%s\n\n' "$title" | cat - body.md >comment.md
            gh issue comment "$number" --body-file comment.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
