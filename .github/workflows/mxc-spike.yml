# Throwaway spike (branch exp-mxc-spike, never merged), G6 part two step 1: can the free GitHub
# Windows runners run tier A, MXC's process container? spikes/mxc-spike/probe.ps1 prints the OS
# build and UBR, processmodel.dll and the PSEC exports, `wxc-exec --probe` (MXC v1.0.1), contained
# cmd and node smoke runs when the tier is base-container, and Codex 0.162.1's strict MXC check.
# The job always passes; the answer is in the log, the step summary and the probe-*.json artifact.
name: mxc-spike

on:
  push:
    branches: [exp-mxc-spike]
    paths:
      - "spikes/mxc-spike/**"
      - ".github/workflows/mxc-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mxc-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Step 1, answered (run 42341399286): on demand only now.
  probe:
    name: probe (${{ matrix.runner }})
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-11-arm, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: OS build
        run: |
          [Environment]::OSVersion
          $cv = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          "$($cv.ProductName) | $($cv.EditionID) | $($cv.InstallationType) | $($cv.DisplayVersion) | build $($cv.CurrentBuildNumber).$($cv.UBR)"
          "processmodel.dll in System32: $(Test-Path "$env:SystemRoot\System32\processmodel.dll")"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: spikes/mxc-spike

      - name: Probe
        run: ./spikes/mxc-spike/probe.ps1 -Out "$env:RUNNER_TEMP/probe-${{ matrix.runner }}.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: probe-${{ matrix.runner }}
          path: ${{ runner.temp }}/probe-${{ matrix.runner }}.json
          if-no-files-found: warn

  # Step 2: the rows on the runner that qualified (25H2 26200.9725, base-container). Whole agents
  # (Node 24.22.0 ARM64, Clauseo's npm pins, codex.exe ARM64) inside wxc-exec with UI on,
  # proxy-only egress to proxy-mock.mjs, and a scripted model server instead of a login.
  rows:
    name: rows (windows-11-arm)
    runs-on: windows-11-arm
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: OS build
        run: |
          $cv = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          "$($cv.ProductName) | $($cv.InstallationType) | $($cv.DisplayVersion) | build $($cv.CurrentBuildNumber).$($cv.UBR)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            spikes/mxc-spike
            crates/limits/tests/live

      - name: Rows
        run: ./spikes/mxc-spike/rows.ps1 -Repo "$env:GITHUB_WORKSPACE" -Logs "$env:RUNNER_TEMP/mxc-rows-logs" -Out "$env:RUNNER_TEMP/mxc-rows-logs/rows.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rows-windows-11-arm
          path: ${{ runner.temp }}/mxc-rows-logs
          if-no-files-found: warn
