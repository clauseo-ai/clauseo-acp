# setup-exe repro: builds clauseo-sandbox-setup.exe, the elevated set-up the installer ships,
# twice from clean on each Windows release target, both times in the release's target dir
# (target/, wiped between the builds), and fails unless the two exes have the same SHA-256; on a
# mismatch it uploads both. The builds are release.yml's (the same profile environment and
# RUSTFLAGS, through `node .github/scripts/sidecars.mjs --setup-exe`, which adds the path remaps
# and SOURCE_DATE_EPOCH); crates/sandbox/build.rs adds /Brepro and /DEBUG:NONE. The
# toolchain is rust-toolchain.toml's.
#
# The same path, not two: the goal is that rebuilding a release commit in CI gives the same hash.
# A different target dir gives a different exe (crates/sandbox/build.rs says why: RUSTFLAGS'
# remaps miss the host's proc macros under --target).
#
# Manual only (`gh workflow run setup-exe-repro.yml --ref <branch>`): two cold LTO builds per
# target are too slow for every pull request, and the exe changes rarely. Run it when the
# sandbox crate, its build script, the release profile or the toolchain changes.
# Every action is pinned by commit SHA, with its tag in a comment, copied from release.yml.

name: setup-exe-repro

on:
  workflow_dispatch:
  push:
    branches: ["exp-setup-repro"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # release.yml's.
  CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
  CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: packed
  RUSTFLAGS: "-C force-frame-pointers=yes"

jobs:
  repro:
    name: repro (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, runner: windows-2025 }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm }
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain from rust-toolchain.toml, and the target
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/package.json
          package-manager-cache: false

      - name: Build the exe twice from clean in target/, and compare
        id: repro
        run: |
          mkdir -p "$RUNNER_TEMP/setup-exe"
          for run in a b; do
            rm -rf target
            exe=$(node .github/scripts/sidecars.mjs --setup-exe "$TARGET" | tail -n 1)
            cp "$exe" "$RUNNER_TEMP/setup-exe/clauseo-sandbox-setup-$run.exe"
          done
          cd "$RUNNER_TEMP/setup-exe"
          a=$(sha256sum clauseo-sandbox-setup-a.exe | cut -d' ' -f1)
          b=$(sha256sum clauseo-sandbox-setup-b.exe | cut -d' ' -f1)
          if [ "$a" != "$b" ]; then
            echo "::error::two clean builds of clauseo-sandbox-setup.exe differ: $a and $b"
            exit 1
          fi
          echo "clauseo-sandbox-setup.exe ($TARGET) builds the same twice: $a" >> "$GITHUB_STEP_SUMMARY"

      # Both exes, for the next diagnosis.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.repro.outcome == 'failure'
        with:
          name: setup-exe-mismatch-${{ matrix.target }}
          path: ${{ runner.temp }}/setup-exe
          if-no-files-found: warn
