# The app end to end on Windows: built with the `e2e` feature, started, and driven by Playwright
# over CDP (ui/e2e), on x64 and, after the merge, ARM64. One launch warms up the new exe
# unmeasured; then the tests run once as is and once with --disable-gpu, and each run writes the
# control's numbers (time to #app-root, memory of the process tree, JS heap, DOM nodes) to
# e2e-results-<runner>-<mode>.json. The numbers are recorded, not gated. The window's specs drive
# the scripted fake_agent, built beside the app: each test gets a scratch CLAUSEO_DATA_DIR whose
# settings.json starts fake_agent on that test's scenario as agents.claude, and a scratch
# E2E_MATTER_DIR (ui/e2e/app-windows/scratch.ts), so no run touches the runner's real data folder.
# The job scoreboard-windows plays the speed scoreboard (R13, ui/e2e/app-windows/scoreboard.spec.ts)
# with smoke's app on windows-2025 and uploads scoreboard-windows.json as the artifact
# scoreboard-windows, which the pull request's scoreboard comment reads (scoreboard-comment.yml).
#
# - No version is written here, as in ci.yml: Rust comes from rust-toolchain.toml, pnpm from
#   "packageManager" and Node from "engines.node" in ui/package.json, Playwright from
#   ui/e2e/package.json.
# - `tauri build` turns on `custom-protocol`, so the binary embeds ui/app/dist. A plain
#   `cargo build` would load devUrl instead.
# - On a pull request and a push to main, the x64 smoke test's app is a release build with LTO
#   off and 16 codegen units (CARGO_PROFILE_RELEASE_* below): optimised, panic=abort and a GUI exe
#   like the shipped app, about 4 times faster to build than full LTO with a warm cache
#   (ci-perfmax's notes). scoreboard-windows plays that same build on both. Nightly, on demand and
#   on ARM64 the smoke test builds full LTO, the shipping profile, and runs the full suite on it;
#   scoreboard.yml plays a full-LTO build nightly, on demand and on labelled pull requests.
# - Every action is pinned by commit SHA, with its tag in a comment.

name: e2e-windows

# Every pull request gets the check `smoke (windows-2025)`, the x64 smoke test. Branch protection on
# main requires it (#51). The job e2e-changes runs .github/scripts/changes.sh (as ci.yml's
# `changes` does) for two outputs:
# - `app`: the pull request touches the app: the desktop crate, the crates it runs on and
#   fake_agent, ui/, Cargo.toml, Cargo.lock, the Rust config, or CI itself. The smoke steps run.
# - `product`: it touches product code (crates/, ui/, Cargo.toml, Cargo.lock: the paths for which
#   scoreboard-comment.yml comments, comment.ts's isProductPath). With `app`, scoreboard-windows
#   plays smoke's build.
# A pull request that touches neither starts smoke and skips every step, so the check reports in
# seconds. A path no rule knows, or a failed decision, runs everything, so the check always
# reports. smoke is never skipped as a whole: a job skipped that way reports under the literal name
# `smoke (${{ matrix.runner }})`, and a required check that never reports blocks the merge.
# scoreboard-windows is not a required check, so it is skipped as a whole when it has nothing to do.
# Every push to main, the nightly run and a run on demand cover x64 and ARM64 (windows-11-arm). A
# push to main plays the scoreboard on x64, which gives the comment its baseline, and saves the
# Rust cache pull requests restore; nothing else saves one, and ARM64 keeps none.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A pull request keeps only its newest run. Each push to main, nightly run and run on demand has a
# group of its own, as in ci.yml.
concurrency:
  group: e2e-windows-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Not named changes (ci.yml's required check). The same script decides for both workflows.
  e2e-changes:
    name: e2e-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
      product: ${{ steps.filter.outputs.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/

      # A push, the nightly run and a run on demand run everything; a pull request runs what its
      # changed paths need. ci.yml's `changes` job tests the rules against their fixtures.
      - name: Decide whether the smoke test and the scoreboard run
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            printf '%s\n' app=true product=true | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          scripts=$PWD/.github/scripts
          git init -q "$RUNNER_TEMP/work"
          cd "$RUNNER_TEMP/work"
          git fetch -q --no-tags --filter=blob:none "$REPO_URL" \
            "+refs/heads/${BASE_REF}:refs/ci/base" \
            "+${HEAD_SHA}:refs/ci/head"
          # --no-renames lists both sides of a rename, so a file renamed out of an app path still
          # runs the smoke test.
          git diff --no-renames -z --name-only refs/ci/base...refs/ci/head > "$RUNNER_TEMP/changed"
          bash "$scripts/changes.sh" < "$RUNNER_TEMP/changed" | tee -a "$GITHUB_OUTPUT"

  smoke:
    name: smoke (${{ matrix.runner }})
    needs: e2e-changes
    if: ${{ !cancelled() }}
    # A pull request that leaves the app alone only skips, on an ubuntu runner, which starts faster
    # than a Windows one. A failed e2e-changes runs everything on Windows.
    runs-on: ${{ (github.event_name == 'pull_request' && needs.e2e-changes.result == 'success' && needs.e2e-changes.outputs.app != 'true') && 'ubuntu-24.04' || matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # x64 always; ARM64 on every event but a pull request. One JSON list per case, because an
      # `include` entry that matches no other entry is added as a combination of its own.
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
            && '[{"runner": "windows-2025", "target": "x86_64-pc-windows-msvc"}]'
            || '[{"runner": "windows-2025", "target": "x86_64-pc-windows-msvc"},
                 {"runner": "windows-11-arm", "target": "aarch64-pc-windows-msvc"}]') }}
    env:
      # A failed decision runs everything, so the check always reports.
      RUN: ${{ needs.e2e-changes.result != 'success' || needs.e2e-changes.outputs.app == 'true' }}
      TARGET: ${{ matrix.target }}
      # LTO off and 16 codegen units on a pull request and a push to main (x64), so main saves the
      # Rust cache under the key pull requests look up (rust-cache hashes CARGO_* variables into
      # it) and scoreboard-windows plays the same kind of build on both. Nightly, on demand and on
      # ARM64: full LTO and 1 codegen unit, the shipping profile, under the full suite.
      CARGO_PROFILE_RELEASE_LTO: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && matrix.runner == 'windows-2025' && 'false' || 'true' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && matrix.runner == 'windows-2025' && '16' || '1' }}
      E2E_APP: ${{ github.workspace }}/target/${{ matrix.target }}/release/clauseo-desktop.exe
      # The scripted agent the window's specs launch through settings.json (fixture.ts).
      E2E_FAKE_AGENT: ${{ github.workspace }}/target/${{ matrix.target }}/release/fake_agent.exe
      OUT: ${{ github.workspace }}/e2e-out
    defaults:
      run:
        shell: bash
    steps:
      - name: Skip, the app is unchanged
        if: env.RUN != 'true'
        run: echo "No change to the app's crates, fake_agent, ui/, the Rust config or CI; nothing to smoke-test."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'
        with:
          persist-credentials: false

      - name: Install the Rust toolchain from rust-toolchain.toml, and the target
        if: env.RUN == 'true'
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.RUN == 'true'
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.RUN == 'true'
        with:
          node-version-file: ui/package.json
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # x64 only, saved by a push to main only: the key pull requests restore. The nightly full-LTO
      # build saves nothing (its CARGO_* values give it another key, and it would only push a
      # second entry into the 10 GB cache). ARM64 runs after the merge and keeps no cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: env.RUN == 'true' && matrix.runner == 'windows-2025'
        with:
          key: e2e-${{ matrix.target }}
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

      - name: Install the ui workspace
        if: env.RUN == 'true'
        run: pnpm -C ui install --frozen-lockfile

      - name: Typecheck ui/e2e
        if: env.RUN == 'true'
        run: pnpm -C ui/e2e run typecheck

      - name: Unit tests of the harness
        if: env.RUN == 'true'
        run: pnpm -C ui/e2e run test:unit

      # No other job builds the Windows-only e2e code, so it is linted here.
      - name: Clippy with the e2e feature
        if: env.RUN == 'true'
        run: cargo clippy -p clauseo-desktop --all-targets --features e2e --target "$TARGET" -- -D warnings

      # VITE_CLAUSEO_HAND_CHECKS=1 builds in the room's hooks for checks by hand (__clauseoDisplay,
      # __clauseoAxe: ui/app/src/room/start.ts), each in a chunk the page loads after its start; a
      # release build carries neither.
      - name: Build the app with the e2e feature
        id: build
        if: env.RUN == 'true'
        env:
          VITE_CLAUSEO_HAND_CHECKS: "1"
        run: pnpm -C ui tauri build --no-bundle --features e2e --target "$TARGET"

      # Same profile and target, beside the app: E2E_FAKE_AGENT above. The specs run it as
      # agents.claude.
      - name: Build fake_agent
        id: fake_agent
        if: env.RUN == 'true'
        run: cargo build --release --locked -p clauseo-fake_agent --target "$TARGET"

      - name: Make the results folder
        if: env.RUN == 'true'
        run: mkdir -p "$OUT"

      # The first start of a freshly built exe is slower than the rest, so the smoke test runs once
      # before the measured runs and its launch is not measured.
      - name: Warm-up launch (smoke test, not measured)
        if: env.RUN == 'true'
        run: pnpm -C ui/e2e test smoke.spec.ts

      # Runs even when the warm-up failed, so a failure there still leaves the numbers.
      - name: Tests and numbers
        if: ${{ env.RUN == 'true' && !cancelled() && steps.build.outcome == 'success' && steps.fake_agent.outcome == 'success' }}
        env:
          E2E_RESULTS: ${{ env.OUT }}/e2e-results-${{ matrix.runner }}-normal.json
        run: pnpm -C ui/e2e test

      # Runs even when the run before failed: GitHub's Windows runners have no GPU, and the two runs
      # tell apart a failure of the GPU path from a failure of the app.
      - name: Tests and numbers with --disable-gpu
        if: ${{ env.RUN == 'true' && !cancelled() && steps.build.outcome == 'success' && steps.fake_agent.outcome == 'success' }}
        env:
          E2E_DISABLE_GPU: "1"
          E2E_RESULTS: ${{ env.OUT }}/e2e-results-${{ matrix.runner }}-disable-gpu.json
        run: pnpm -C ui/e2e test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ env.RUN == 'true' && !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: e2e-results-${{ matrix.runner }}
          path: ${{ env.OUT }}
          if-no-files-found: warn

      # The app and fake_agent scoreboard-windows plays (x64 only), kept one day.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ env.RUN == 'true' && matrix.runner == 'windows-2025' && !cancelled() && steps.build.outcome == 'success' && steps.fake_agent.outcome == 'success' }}
        with:
          name: e2e-app-${{ matrix.target }}
          path: |
            ${{ env.E2E_APP }}
            ${{ env.E2E_FAKE_AGENT }}
          if-no-files-found: error
          retention-days: 1

  # The speed scoreboard (R13): one warm-up and three measured plays of fake_agent's scoreboard
  # session, each a fresh launch, normal mode (ui/e2e/app-windows/scoreboard.spec.ts). It plays
  # smoke's app and fake_agent (the artifact e2e-app-x86_64-pc-windows-msvc), so it builds nothing:
  # pull requests and main measure the same LTO-off release build, and the comment compares like
  # with like. scoreboard.yml plays a full-LTO build nightly, on demand and on pull requests labelled
  # `scoreboard`, for the absolute numbers. Runs on pull requests that touch the app's product code
  # and on every push to main. Its numbers report and alert and never block a merge: the job is not
  # a required check, and continue-on-error keeps a failure from turning the run red (a red run on
  # main would hide that run's numbers from the comment, which reads main's successful runs only).
  # The comment then shows this pull request's Windows numbers as not run.
  scoreboard-windows:
    name: scoreboard-windows
    needs: [e2e-changes, smoke]
    # On a push it waits for the ARM64 leg of smoke too, which costs nothing that matters: the
    # comment reads main's numbers only from a completed, successful run, so the baseline is usable
    # only once the whole run has ended, ARM64 included. An ARM64 failure does not skip this job
    # (!cancelled() below); only a missing x64 artifact fails it, at the download.
    # Pull requests and pushes to main only: nightly and on demand, smoke's build is full LTO, and
    # its numbers would become main's baseline for the next pull requests (the comment reads main's
    # newest run); scoreboard.yml's scoreboard-windows-lto plays full LTO then.
    if: >-
      ${{ !cancelled() && needs.smoke.result != 'skipped'
      && (github.event_name == 'pull_request' || github.event_name == 'push')
      && (needs.e2e-changes.result != 'success'
      || (needs.e2e-changes.outputs.app == 'true' && needs.e2e-changes.outputs.product == 'true')) }}
    runs-on: windows-2025
    continue-on-error: true
    # The four plays took about 2.5 minutes inside smoke (run 41383564166 and earlier).
    timeout-minutes: 30
    env:
      E2E_APP: ${{ github.workspace }}/target/x86_64-pc-windows-msvc/release/clauseo-desktop.exe
      E2E_FAKE_AGENT: ${{ github.workspace }}/target/x86_64-pc-windows-msvc/release/fake_agent.exe
      SCOREBOARD_OUT: ${{ github.workspace }}/scoreboard-out
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-app-x86_64-pc-windows-msvc
          path: target/x86_64-pc-windows-msvc/release

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/package.json
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install the ui workspace
        run: pnpm -C ui install --frozen-lockfile

      - name: Speed scoreboard
        run: |
          status=0
          pnpm -C ui/e2e test scoreboard.spec.ts || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Speed scoreboard failed::scoreboard.spec.ts exited with $status; no scoreboard-windows.json"
            exit "$status"
          fi

      # comment.ts reads scoreboard-windows.json from the artifact scoreboard-windows.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scoreboard-windows
          path: ${{ github.workspace }}/scoreboard-out/scoreboard-windows.json
          if-no-files-found: error

      # Each play's raw run and debug numbers (warm-up included), for checking the medians by hand.
      # A separate artifact the comment never reads; uploaded after a failed play too.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: scoreboard-windows-runs
          path: ${{ github.workspace }}/scoreboard-out/runs
          if-no-files-found: warn
