# The blank app end to end on Windows: built with the `e2e` feature, started, and driven by
# Playwright over CDP (ui/e2e), on x64 and, after the merge, ARM64. One launch warms up the new
# exe unmeasured; then the tests run once as is and once with --disable-gpu, and each run writes
# the control's numbers (time to #app-root, memory of the process tree, JS heap, DOM nodes) to
# e2e-results-<runner>-<mode>.json. The numbers are recorded, not gated.
#
# - No version is written here, as in ci.yml: Rust comes from rust-toolchain.toml, pnpm from
#   "packageManager" and Node from "engines.node" in ui/package.json, Playwright from
#   ui/e2e/package.json.
# - `tauri build` turns on `custom-protocol`, so the binary embeds ui/app/dist. A plain
#   `cargo build` would load devUrl instead.
# - Every action is pinned by commit SHA, with its tag in a comment.

name: e2e-windows

# Every pull request gets the check `smoke (windows-2025)`, the x64 smoke test. Branch protection on
# main requires it (#51). The job e2e-changes decides whether the steps run: a pull request that
# touches none of crates/desktop/, ui/ or this workflow starts the job and skips every step, so the
# check reports in seconds. One that touches them runs the smoke test in full, on x64 only. A failed
# decision runs the full test, so the check always reports. A change elsewhere that breaks the app
# (another crate, Cargo.lock, the toolchain) shows up on the next push to main. smoke is never
# skipped as a whole: a job skipped that way reports under the literal name
# `smoke (${{ matrix.runner }})`, and a required check that never reports blocks the merge.
# Every push to main, the nightly run and a run on demand cover x64 and ARM64 (windows-11-arm),
# which gives the budgets their baseline and keeps main's Rust cache, the one pull requests can
# read, warm.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A pull request keeps only its newest run. Each push to main, nightly run and run on demand has a
# group of its own, as in ci.yml.
concurrency:
  group: e2e-windows-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Not named changes (ci.yml's required check). Copies ci.yml's fetch and diff: fix both together.
  e2e-changes:
    name: e2e-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      # A push, the nightly run and a run on demand run the smoke test; a pull request runs it only
      # when it changes the desktop crate, the ui or this workflow.
      - name: Decide whether the smoke test runs
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git init -q work
          cd work
          git fetch -q --no-tags --filter=blob:none "$REPO_URL" \
            "+refs/heads/${BASE_REF}:refs/ci/base" \
            "+${HEAD_SHA}:refs/ci/head"
          # --no-renames lists both sides of a rename, so a file renamed out of crates/desktop/ or
          # ui/ still runs the smoke test.
          changed=$(git diff --no-renames -z --name-only refs/ci/base...refs/ci/head | tr '\0' '\n')
          app=$(printf '%s\n' "$changed" \
            | grep -E '^(crates/desktop/|ui/|\.github/workflows/e2e-windows\.yml$)' || true)
          if [ -n "$app" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change to crates/desktop/, ui/ or this workflow: the steps skip."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  smoke:
    name: smoke (${{ matrix.runner }})
    needs: e2e-changes
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # x64 always; ARM64 on every event but a pull request. One JSON list per case, because an
      # `include` entry that matches no other entry is added as a combination of its own.
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
            && '[{"runner": "windows-2025", "target": "x86_64-pc-windows-msvc"}]'
            || '[{"runner": "windows-2025", "target": "x86_64-pc-windows-msvc"},
                 {"runner": "windows-11-arm", "target": "aarch64-pc-windows-msvc"}]') }}
    env:
      RUN: ${{ needs.e2e-changes.result == 'success' && needs.e2e-changes.outputs.run || 'true' }}
      TARGET: ${{ matrix.target }}
      E2E_APP: ${{ github.workspace }}/target/${{ matrix.target }}/release/clauseo-desktop.exe
      OUT: ${{ github.workspace }}/e2e-out
    defaults:
      run:
        shell: bash
    steps:
      - name: Skip, crates/desktop, ui and this workflow are unchanged
        if: env.RUN != 'true'
        run: echo "No change to crates/desktop/, ui/ or this workflow; nothing to smoke-test."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'
        with:
          persist-credentials: false

      - name: Install the Rust toolchain from rust-toolchain.toml, and the target
        if: env.RUN == 'true'
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.RUN == 'true'
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.RUN == 'true'
        with:
          node-version-file: ui/package.json
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: env.RUN == 'true'
        with:
          key: e2e-${{ matrix.target }}
          cache-bin: "false"

      - name: Install the ui workspace
        if: env.RUN == 'true'
        run: pnpm -C ui install --frozen-lockfile

      - name: Typecheck ui/e2e
        if: env.RUN == 'true'
        run: pnpm -C ui/e2e run typecheck

      - name: Unit tests of the harness
        if: env.RUN == 'true'
        run: pnpm -C ui/e2e run test:unit

      # No other job builds the Windows-only e2e code, so it is linted here.
      - name: Clippy with the e2e feature
        if: env.RUN == 'true'
        run: cargo clippy -p clauseo-desktop --all-targets --features e2e --target "$TARGET" -- -D warnings

      - name: Build the app with the e2e feature
        id: build
        if: env.RUN == 'true'
        run: pnpm -C ui tauri build --no-bundle --features e2e --target "$TARGET"

      - name: Make the results folder
        if: env.RUN == 'true'
        run: mkdir -p "$OUT"

      # The first start of a freshly built exe is slower than the rest, so the smoke test runs once
      # before the measured runs and its launch is not measured.
      - name: Warm-up launch (smoke test, not measured)
        if: env.RUN == 'true'
        run: pnpm -C ui/e2e test smoke.spec.ts

      # Runs even when the warm-up failed, so a failure there still leaves the numbers.
      - name: Tests and numbers
        if: ${{ env.RUN == 'true' && !cancelled() && steps.build.outcome == 'success' }}
        env:
          E2E_RESULTS: ${{ env.OUT }}/e2e-results-${{ matrix.runner }}-normal.json
        run: pnpm -C ui/e2e test

      # Runs even when the run before failed: GitHub's Windows runners have no GPU, and the two runs
      # tell apart a failure of the GPU path from a failure of the app.
      - name: Tests and numbers with --disable-gpu
        if: ${{ env.RUN == 'true' && !cancelled() && steps.build.outcome == 'success' }}
        env:
          E2E_DISABLE_GPU: "1"
          E2E_RESULTS: ${{ env.OUT }}/e2e-results-${{ matrix.runner }}-disable-gpu.json
        run: pnpm -C ui/e2e test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ env.RUN == 'true' && !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: e2e-results-${{ matrix.runner }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
