# The app end to end on Windows: built with the `e2e` feature, started, and driven by Playwright
# over CDP (ui/e2e), on x64 and, after the merge, ARM64. One launch warms up the new exe
# unmeasured; then the tests run once as is and once with --disable-gpu, and each run writes the
# control's numbers (time to #app-root, memory of the process tree, JS heap, DOM nodes) to
# e2e-results-<runner>-<mode>.json. The numbers are recorded, not gated. The window's specs drive
# the scripted fake_agent, built beside the app: each test gets a scratch CLAUSEO_DATA_DIR whose
# settings.json starts fake_agent on that test's scenario as agents.claude, and a scratch
# E2E_MATTER_DIR (ui/e2e/app-windows/scratch.ts), so no run touches the runner's real data folder.
# On windows-2025 the job then plays the speed scoreboard (R13, ui/e2e/app-windows/scoreboard.spec.ts)
# and uploads scoreboard-windows.json as the artifact scoreboard-windows, which the pull request's
# scoreboard comment reads (scoreboard-comment.yml).
#
# - No version is written here, as in ci.yml: Rust comes from rust-toolchain.toml, pnpm from
#   "packageManager" and Node from "engines.node" in ui/package.json, Playwright from
#   ui/e2e/package.json.
# - `tauri build` turns on `custom-protocol`, so the binary embeds ui/app/dist. A plain
#   `cargo build` would load devUrl instead.
# - Every action is pinned by commit SHA, with its tag in a comment.

name: e2e-windows

# Every pull request gets the check `smoke (windows-2025)`, the x64 smoke test. Branch protection on
# main requires it (#51). The job e2e-changes decides whether the steps run, with two outputs:
# - `run`: the pull request touches the app's paths (crates/desktop/, the crates it runs on and
#   fake_agent, ui/, this workflow).
# - `scoreboard`: it touches product code (crates/, ui/, Cargo.toml, Cargo.lock: the paths for
#   which scoreboard-comment.yml comments, comment.ts's isProductPath).
# The steps run, on x64 only, when either is true: the smoke test in full, then the speed
# scoreboard (windows-2025, normal mode) when `scoreboard` is true. So a pull request that touches
# product code outside the app's paths (another crate, Cargo.lock) runs the smoke test too. One
# that touches neither starts the job and skips every step, so the check reports in seconds. A
# failed decision runs everything, so the check always reports. A change elsewhere that breaks the
# app (the toolchain, another workflow) shows up on the next push to main. smoke is never skipped
# as a whole: a job skipped that way reports under the literal name `smoke (${{ matrix.runner }})`,
# and a required check that never reports blocks the merge.
# Every push to main, the nightly run and a run on demand cover x64 and ARM64 (windows-11-arm) and
# play the scoreboard on x64, which gives the budgets their baseline and keeps main's Rust cache,
# the one pull requests can read, warm.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A pull request keeps only its newest run. Each push to main, nightly run and run on demand has a
# group of its own, as in ci.yml.
concurrency:
  group: e2e-windows-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Not named changes (ci.yml's required check). Copies ci.yml's fetch and diff: fix both together.
  e2e-changes:
    name: e2e-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
      scoreboard: ${{ steps.filter.outputs.scoreboard }}
    steps:
      # A push, the nightly run and a run on demand run the smoke test and the scoreboard; a pull
      # request runs the smoke test only when it changes the desktop crate, a crate the app runs
      # (host and what it uses), fake_agent, the ui or this workflow, and the scoreboard only when it
      # changes product code (crates/, ui/, Cargo.toml, Cargo.lock; comment.ts's isProductPath).
      - name: Decide whether the smoke test and the scoreboard run
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "scoreboard=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git init -q work
          cd work
          git fetch -q --no-tags --filter=blob:none "$REPO_URL" \
            "+refs/heads/${BASE_REF}:refs/ci/base" \
            "+${HEAD_SHA}:refs/ci/head"
          # --no-renames lists both sides of a rename, so a file renamed out of an app path still
          # runs the smoke test.
          changed=$(git diff --no-renames -z --name-only refs/ci/base...refs/ci/head | tr '\0' '\n')
          # The crates here are clauseo-desktop and its path dependencies: update the list with
          # crates/desktop/Cargo.toml's dependencies.
          app=$(printf '%s\n' "$changed" \
            | grep -E '^(crates/(desktop|host|protocol|acp|process|reducer|store|matters|settings|fake_agent)/|ui/|\.github/workflows/e2e-windows\.yml$)' || true)
          if [ -n "$app" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change to the app's crates, fake_agent, ui/ or this workflow: the steps skip."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
          product=$(printf '%s\n' "$changed" | grep -E '^(crates/|ui/|Cargo\.toml$|Cargo\.lock$)' || true)
          if [ -n "$product" ]; then
            echo "scoreboard=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change to product code (crates/, ui/, Cargo.toml, Cargo.lock): no scoreboard."
            echo "scoreboard=false" >> "$GITHUB_OUTPUT"
          fi

  smoke:
    name: smoke (${{ matrix.runner }})
    needs: e2e-changes
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    # The scoreboard's four plays add about five minutes on windows-2025.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # x64 always; ARM64 on every event but a pull request. One JSON list per case, because an
      # `include` entry that matches no other entry is added as a combination of its own.
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
            && '[{"runner": "windows-2025", "target": "x86_64-pc-windows-msvc"}]'
            || '[{"runner": "windows-2025", "target": "x86_64-pc-windows-msvc"},
                 {"runner": "windows-11-arm", "target": "aarch64-pc-windows-msvc"}]') }}
    env:
      # A failed decision runs everything, so the check always reports.
      RUN: ${{ needs.e2e-changes.result != 'success' || needs.e2e-changes.outputs.run == 'true' || needs.e2e-changes.outputs.scoreboard == 'true' }}
      SCOREBOARD: ${{ matrix.runner == 'windows-2025' && (needs.e2e-changes.result != 'success' || needs.e2e-changes.outputs.scoreboard == 'true') }}
      TARGET: ${{ matrix.target }}
      E2E_APP: ${{ github.workspace }}/target/${{ matrix.target }}/release/clauseo-desktop.exe
      # The scripted agent the window's specs launch through settings.json (fixture.ts).
      E2E_FAKE_AGENT: ${{ github.workspace }}/target/${{ matrix.target }}/release/fake_agent.exe
      OUT: ${{ github.workspace }}/e2e-out
    defaults:
      run:
        shell: bash
    steps:
      - name: Skip, the app's crates, ui, product code and this workflow are unchanged
        if: env.RUN != 'true'
        run: echo "No change to the app's crates, fake_agent, ui/, product code or this workflow; nothing to smoke-test."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'
        with:
          persist-credentials: false

      - name: Install the Rust toolchain from rust-toolchain.toml, and the target
        if: env.RUN == 'true'
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.RUN == 'true'
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.RUN == 'true'
        with:
          node-version-file: ui/package.json
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: env.RUN == 'true'
        with:
          key: e2e-${{ matrix.target }}
          cache-bin: "false"

      - name: Install the ui workspace
        if: env.RUN == 'true'
        run: pnpm -C ui install --frozen-lockfile

      - name: Typecheck ui/e2e
        if: env.RUN == 'true'
        run: pnpm -C ui/e2e run typecheck

      - name: Unit tests of the harness
        if: env.RUN == 'true'
        run: pnpm -C ui/e2e run test:unit

      # No other job builds the Windows-only e2e code, so it is linted here.
      - name: Clippy with the e2e feature
        if: env.RUN == 'true'
        run: cargo clippy -p clauseo-desktop --all-targets --features e2e --target "$TARGET" -- -D warnings

      - name: Build the app with the e2e feature
        id: build
        if: env.RUN == 'true'
        run: pnpm -C ui tauri build --no-bundle --features e2e --target "$TARGET"

      # Release, same target, beside the app: E2E_FAKE_AGENT above. The specs run it as agents.claude.
      - name: Build fake_agent
        id: fake_agent
        if: env.RUN == 'true'
        run: cargo build --release --locked -p clauseo-fake_agent --target "$TARGET"

      - name: Make the results folder
        if: env.RUN == 'true'
        run: mkdir -p "$OUT"

      # The first start of a freshly built exe is slower than the rest, so the smoke test runs once
      # before the measured runs and its launch is not measured.
      - name: Warm-up launch (smoke test, not measured)
        if: env.RUN == 'true'
        run: pnpm -C ui/e2e test smoke.spec.ts

      # Runs even when the warm-up failed, so a failure there still leaves the numbers.
      - name: Tests and numbers
        if: ${{ env.RUN == 'true' && !cancelled() && steps.build.outcome == 'success' && steps.fake_agent.outcome == 'success' }}
        env:
          E2E_RESULTS: ${{ env.OUT }}/e2e-results-${{ matrix.runner }}-normal.json
        run: pnpm -C ui/e2e test

      # Runs even when the run before failed: GitHub's Windows runners have no GPU, and the two runs
      # tell apart a failure of the GPU path from a failure of the app.
      - name: Tests and numbers with --disable-gpu
        if: ${{ env.RUN == 'true' && !cancelled() && steps.build.outcome == 'success' && steps.fake_agent.outcome == 'success' }}
        env:
          E2E_DISABLE_GPU: "1"
          E2E_RESULTS: ${{ env.OUT }}/e2e-results-${{ matrix.runner }}-disable-gpu.json
        run: pnpm -C ui/e2e test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ env.RUN == 'true' && !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: e2e-results-${{ matrix.runner }}
          path: ${{ env.OUT }}
          if-no-files-found: warn

      # The speed scoreboard (R13): one warm-up and three measured plays of fake_agent's scoreboard
      # session, each a fresh launch, normal mode (ui/e2e/app-windows/scoreboard.spec.ts). Its numbers
      # report and alert and never block a merge, so a failure here leaves the check green with a
      # warning on the run; the comment then shows this pull request's Windows numbers as not run.
      - name: Speed scoreboard
        id: scoreboard
        if: ${{ env.RUN == 'true' && env.SCOREBOARD == 'true' && !cancelled() && steps.build.outcome == 'success' && steps.fake_agent.outcome == 'success' }}
        continue-on-error: true
        env:
          SCOREBOARD_OUT: ${{ github.workspace }}/scoreboard-out
        run: |
          status=0
          pnpm -C ui/e2e test scoreboard.spec.ts || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Speed scoreboard failed::scoreboard.spec.ts exited with $status; no scoreboard-windows.json"
            exit "$status"
          fi

      # comment.ts reads scoreboard-windows.json from the artifact scoreboard-windows.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.scoreboard.outcome == 'success' }}
        with:
          name: scoreboard-windows
          path: ${{ github.workspace }}/scoreboard-out/scoreboard-windows.json
          if-no-files-found: error

      # Each play's raw run and debug numbers (warm-up included), for checking the medians by hand.
      # A separate artifact the comment never reads; uploaded after a failed play too.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.scoreboard.outcome != 'skipped' }}
        with:
          name: scoreboard-windows-runs
          path: ${{ github.workspace }}/scoreboard-out/runs
          if-no-files-found: warn
