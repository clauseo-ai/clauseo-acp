# scratch: why the hmr probe times out on windows-2025. Dropped before review.
name: diag-hmr

on:
  push:
    branches: [S3-g5-build-numbers]

permissions:
  contents: read

jobs:
  hmr:
    name: hmr (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/package.json
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Machine, Chrome and Defender
        run: |
          echo "$(uname -sm), $(nproc) CPUs, node $(node -v)"
          powershell -NoProfile -Command "(Get-Item 'C:\Program Files\Google\Chrome\Application\chrome.exe').VersionInfo.ProductVersion; Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, AntivirusEnabled | Format-List"
          pnpm -C ui install --frozen-lockfile
      - name: cargo xtask buildtime web, rerun
        run: cargo xtask buildtime web --runs 5 --json | tee web.json
        continue-on-error: true
      - name: Hot reload, step by step
        if: ${{ !cancelled() }}
        run: node ui/app/scripts/diag-hmr.mjs
