# Mutation tests of the code that compiles only on Windows or only on macOS, each on its own OS
# (clauseo-acp-private#139). CI's mutants job and `cargo xtask mutants` run on Linux, where a
# `cfg(windows)` or `cfg(target_os = "macos")` mutant builds the same binary as the code and comes
# back missed. Here those files are mutated where they compile.
#
# - Weekly, Sundays at 02:07 UTC, and by hand (workflow_dispatch, which needs write access). A
#   dispatch can run one job (`only`), to check a pull request's tests against that job's
#   mutants; the other jobs then run on ubuntu and skip every step, so they hold no Windows or
#   macOS runner. No pull request or push event, so it never takes a runner from a pull request:
#   the org has 20 job slots and 5 macOS runners. 02:07 is after fuzz.yml's nightly (01:23, about
#   25 minutes) and before ci.yml's at 03:17. The longer jobs run past 03:17; then ci.yml (2 macOS
#   jobs) and scoreboard.yml (1) plus this workflow's one macOS job still fit the 5.
# - Four jobs, each one runner and one cargo-mutants run over the files in its matrix entry
#   (`--file`), with `--jobs 2` (process: 1): three on windows-2025 (the runner of e2e-windows.yml's
#   smoke test), one on macos-15 (ci.yml's). Each file list comes from a grep of `cfg(windows)`,
#   `cfg(not(unix))` and `cfg(target_os = "macos")`, outside tests, in the crates the issue names
#   (process, matters, settings, store), plus the files whose mutants need a case-insensitive file
#   system (writeback.rs, undo.rs, refuse.rs). A whole file is mutated, so mutants Linux already
#   tests run again here; that keeps the lists simple. Left out:
#   crates/limits/src/readers/paths.rs's `cfg!(windows)` site, since limits was not in the issue.
# - The config is .cargo/mutants.toml without its `exclude_globs` entries for the files mutated
#   here (the settings OS shims, excluded on Linux because they are not compiled there), so the
#   shims' own mutants run, and with the job's `skip_re` added to its `exclude_re`. That
#   `exclude_re` still applies, including SystemDirs' `home` and `known_folder` in
#   crates/settings/src/system.rs: no test reads the real OS folders on any OS (tests use their own
#   `PlatformDirs`), so those mutants stay excluded on Windows too. Its platform block holds the
#   mutants of this code that no OS's tests can tell apart (equivalent or unobservable).
# - Each job's `skip_re` lists the mutants it misses only because of its OS: code another OS's
#   `cfg` block keeps out of its build (a file is mutated whole), or code equivalent on this OS
#   but caught on another OS or on Linux. They apply to that job only. Each entry has its reason
#   in a comment. A regex that matches no mutant of the job fails the job before any mutant runs,
#   and the error names the regex: the code moved, so fix or drop the entry.
#   .github/scripts/mutants-platform.sh writes the config, checks the skip list, and fails a file
#   that gives no mutant.
# - It only reports: a missed or timed-out mutant shows in the job summary and the artifact
#   mutants-platform-<job> (mutants.out, kept 14 days), and never fails the job. A failed setup,
#   or a cargo-mutants exit other than 0 (all caught), 2 (some missed) or 3 (some timed out),
#   fails it: 1 is a usage error, 4 a baseline whose tests already fail, 70 an internal error
#   (cargo-mutants 27.1.0, src/exit_code.rs).
# - No version is written here, as in ci.yml: Rust comes from rust-toolchain.toml, cargo-mutants
#   and nextest from xtask/src/setup.rs through .github/actions/install-pinned-tools.
# - No Rust cache: each mutant builds in a copy of the tree with its own target/ (`gitignore` in
#   .cargo/mutants.toml leaves target/ out), so a cache would speed up only the xtask build.
# - Every third-party action is pinned by commit SHA, with its tag in a comment. No secrets.
name: mutants-platform

on:
  schedule:
    - cron: "7 2 * * 0"
  workflow_dispatch:
    inputs:
      only:
        description: One job to run, or all
        type: choice
        default: all
        options: [all, windows-process, windows-matters, windows-matters-settings, macos]

permissions: {}

# One run at a time: a dispatch while the weekly run is going waits for it.
concurrency:
  group: mutants-platform
  cancel-in-progress: false

jobs:
  mutants:
    # A job a dispatch did not pick says so in its name, so its green check reads as skipped.
    name: >-
      mutants (${{ matrix.name }})${{ (inputs.only || 'all') != 'all'
      && inputs.only != matrix.name && ' (skipped)' || '' }}
    # The same test as PICKED below, which job-level `if` cannot make: it has no matrix context.
    runs-on: >-
      ${{ ((inputs.only || 'all') == 'all' || inputs.only == matrix.name)
      && matrix.runner || 'ubuntu-24.04' }}
    permissions:
      contents: read
    # Timeouts, from an estimate. CI's Linux runner (4 vCPU) took 7 to 24 s per mutant at 2 jobs
    # (xtask/src/mutants.rs, run 41166189760). Assumed here: about 45 s per mutant on windows-2025,
    # where builds and links are slower, and 25 s on macos-15 (3 cores), so 22 and 12 s of wall
    # time each at 2 jobs; plus about 15 minutes of setup and cold baseline build. The step's
    # timeout is about 2.5 times the estimate, the job's 20 minutes more so the summary and the
    # artifact still run (job_minutes), and both stay well under GitHub's 6 hours.
    # - process: 71 mutants, ~55 min (its tests start and stop real processes);
    # - matters: 200, ~90 min;  matters-settings: 219, ~100 min;  macos: 276, ~70 min.
    # The first run (41563489415, 2026-11-03) took 7, 52, 34 and 45 minutes, process at 2 workers;
    # process now runs at 1 (its entry says why), which at twice its measured time still sits far
    # inside its 140 minutes.
    timeout-minutes: ${{ matrix.job_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # S7's job objects, the shutdown ladder and the launch rules.
          - name: windows-process
            runner: windows-2025
            minutes: 140
            job_minutes: 160
            # One at a time: `resume`'s mutants (os/windows.rs) can resume the suspended threads
            # of every process on the runner, so one worker's mutant can resume the other worker's
            # hung agents and turn a caught mutant into a missed one (run 41563489415,
            # os/windows.rs:140).
            jobs: 1
            fake_agent: true
            packages: clauseo-process
            files: >-
              crates/process/src/os/windows.rs
              crates/process/src/handle.rs
              crates/process/src/launch.rs
            skip_re:
              # `#[cfg(unix)]` `signal`, not compiled here; Linux catches it. Line 203 is Windows' own.
              - 'crates/process/src/handle\.rs:197:5: replace signal -> Option<i32> with '
              # Always None on Windows, whose `signal` has no signal to give; Linux catches it.
              - 'crates/process/src/handle\.rs:\d+:\d+: replace ExitReport::signal -> Option<i32> with None$'
          # Cloud placeholders, drive roots, hidden folders, and the case-insensitive file
          # system's respelled names (writeback.rs, undo.rs).
          - name: windows-matters
            runner: windows-2025
            minutes: 220
            job_minutes: 240
            fake_agent: false
            packages: clauseo-matters
            files: >-
              crates/matters/src/write.rs
              crates/matters/src/write/windows.rs
              crates/matters/src/probe.rs
              crates/matters/src/refuse.rs
              crates/matters/src/fsync.rs
              crates/matters/src/matter/json.rs
              crates/matters/src/writeback.rs
              crates/matters/src/undo.rs
            skip_re:
              # Their Windows bodies are already `Ok(())` (full_flush_dir settles `Ok(())`); macOS catches them.
              - 'crates/matters/src/fsync\.rs:\d+:\d+: replace (sync_dir|barrier|full_flush|full_flush_dir) -> io::Result<\(\)> with Ok\(\(\)\)$'
              # The macOS block of `is_cloud_only`, not compiled here; lines 47 and 48 are Windows' own.
              - 'crates/matters/src/probe\.rs:41:\d+: replace (!= with ==|& with \||& with \^) in <impl PlaceholderProbe for OsProbe>::is_cloud_only$'
              # `is_mount_point` is Linux only, not compiled here.
              - 'crates/matters/src/refuse\.rs:\d+:\d+: (replace is_mount_point -> .*|.* in is_mount_point)$'
              # `is_macos_volume_key` is macOS only, not compiled here.
              - 'crates/matters/src/refuse\.rs:\d+:\d+: (replace is_macos_volume_key -> .*|.* in is_macos_volume_key)$'
              # The macOS `/System/Volumes/Data` block of `keys_by`, not compiled here.
              - 'crates/matters/src/refuse\.rs:\d+:\d+: replace == with != in keys_by$'
              # The `cfg(unix)` line of `same_entry`, not compiled here; line 176's `==` is Windows' own.
              - 'crates/matters/src/writeback\.rs:171:\d+: replace (&& with \|\||== with !=) in same_entry$'
          # Files with one Windows-only branch each, and settings' policy and folders.
          - name: windows-matters-settings
            runner: windows-2025
            minutes: 240
            job_minutes: 260
            fake_agent: false
            packages: clauseo-matters clauseo-settings
            files: >-
              crates/matters/src/locks.rs
              crates/matters/src/stat.rs
              crates/matters/src/history/durable.rs
              crates/matters/src/history/blob.rs
              crates/settings/src/policy.rs
              crates/settings/src/policy/windows.rs
              crates/settings/src/system.rs
              crates/settings/src/system/windows.rs
            skip_re:
              # The `cfg(unix)` `same_file`, not compiled here; Linux catches it. Line 97 is Windows' own.
              - 'crates/matters/src/history/blob\.rs:90:5: replace same_file -> bool with false$'
              # The comparisons of that `same_file`, not compiled here; Linux catches them.
              - 'crates/matters/src/history/blob\.rs:\d+:\d+: replace == with != in same_file$'
              # Only an ACL deny gives a stat error other than NotFound here; Linux catches it. Line 121 is caught.
              - 'crates/matters/src/history/durable\.rs:105:21: replace match guard err\.kind\(\) == io::ErrorKind::NotFound with true in present$'
          # One macOS job, so this workflow takes one of the org's 5 macOS runners. no_download,
          # F_FULLFSYNC, /Volumes, the case-insensitive names, the managed-preferences policy, and
          # the store's fullfsync pragma.
          - name: macos
            runner: macos-15
            minutes: 180
            job_minutes: 200
            fake_agent: false
            packages: clauseo-matters clauseo-settings clauseo-store
            files: >-
              crates/matters/src/no_download.rs
              crates/matters/src/no_download/macos.rs
              crates/matters/src/fsync.rs
              crates/matters/src/refuse.rs
              crates/matters/src/probe.rs
              crates/matters/src/write.rs
              crates/matters/src/writeback.rs
              crates/matters/src/undo.rs
              crates/settings/src/policy.rs
              crates/settings/src/policy/macos.rs
              crates/store/src/open.rs
            skip_re:
              # No runner can make a dataless file; Windows catches it with an offline file.
              - 'crates/matters/src/probe\.rs:\d+:\d+: replace <impl PlaceholderProbe for OsProbe>::is_cloud_only -> bool with false$'
              # The Windows block of `is_cloud_only`, not compiled here; line 41 is macOS's own.
              - 'crates/matters/src/probe\.rs:4[78]:\d+: replace (& with \||& with \^|\| with &|!= with ==) in <impl PlaceholderProbe for OsProbe>::is_cloud_only$'
              # The not-macOS branch of `is_drive_root`, not compiled here.
              - 'crates/matters/src/refuse\.rs:\d+:\d+: replace && with \|\| in is_drive_root$'
              # `is_mount_point` is Linux only, not compiled here.
              - 'crates/matters/src/refuse\.rs:\d+:\d+: (replace is_mount_point -> .*|.* in is_mount_point)$'
              # `fold`: `cfg!(target_os = "macos")` makes the parenthesis true here, and NFC keeps ASCII as it is; Windows catches both.
              - 'crates/matters/src/refuse\.rs:\d+:\d+: replace (== with !=|&& with \|\|) in fold$'
              # `open_exclusive` is Windows only, not compiled here.
              - 'crates/matters/src/write\.rs:\d+:\d+: replace open_exclusive -> io::Result<File> with Ok\(Default::default\(\)\)$'
              # `hide_dir`'s body is Windows only, so here it is already empty; Windows catches it.
              - 'crates/matters/src/write\.rs:\d+:\d+: replace hide_dir with \(\)$'
              # The Windows block of `hide_dir`, not compiled here.
              - 'crates/matters/src/write\.rs:\d+:\d+: delete ! in hide_dir$'
              # The `cfg(not(unix))` line of `same_entry`, not compiled here; line 171's `==` is macOS's own.
              - 'crates/matters/src/writeback\.rs:176:44: replace == with != in same_entry$'
    env:
      PACKAGES: ${{ matrix.packages }}
      FILES: ${{ matrix.files }}
      # The job's skip_re, as a JSON array (null when it has none); the script reads it with jq.
      SKIP_RE: ${{ toJSON(matrix.skip_re) }}
      # 'true' unless a dispatch asked for another job (`only`); every step checks it.
      PICKED: ${{ (inputs.only || 'all') == 'all' || inputs.only == matrix.name }}
      JOBS: ${{ matrix.jobs || 2 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.PICKED == 'true'
        with:
          persist-credentials: false

      - name: Install the Rust toolchain from rust-toolchain.toml
        if: env.PICKED == 'true'
        run: rustup toolchain install

      # cargo-mutants runs each mutant's tests with nextest (`test_tool` in .cargo/mutants.toml).
      # `./`, as in ci.yml: actionlint 1.7.12 rejects the `$/` form zizmor's self-repository audit
      # asks for, and the checkout above is this run's own commit.
      - name: Install cargo-mutants and nextest at their pins
        if: env.PICKED == 'true'
        uses: ./.github/actions/install-pinned-tools # zizmor: ignore[self-repository]
        with:
          tools: cargo-mutants cargo-nextest

      # process's tests start fake_agent, which `-p clauseo-process` does not build. The binary
      # stays in this tree's target/, which the mutants' copies leave out, so it is named by path.
      - name: Build fake_agent for process's tests
        if: matrix.fake_agent && env.PICKED == 'true'
        env:
          EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          set -euo pipefail
          cargo build --locked -p clauseo-fake_agent --bin fake_agent
          bin="$GITHUB_WORKSPACE/target/debug/fake_agent$EXE"
          test -f "$bin"
          echo "CLAUSEO_FAKE_AGENT_BIN=$bin" >> "$GITHUB_ENV"

      - name: Write the config and list the mutants per file
        if: env.PICKED == 'true'
        run: .github/scripts/mutants-platform.sh "$RUNNER_TEMP/mutants.toml"

      # $PACKAGES and $FILES are split on purpose, into one -p and one --file per word.
      - name: cargo mutants
        id: mutants
        if: env.PICKED == 'true'
        timeout-minutes: ${{ matrix.minutes }}
        run: |
          set -uo pipefail
          args=()
          for package in $PACKAGES; do args+=(-p "$package"); done
          for file in $FILES; do args+=(--file "$file"); done
          # `|| code=$?`: GitHub runs `shell: bash` with -e, so a bare non-zero exit (2 when a
          # mutant is missed) would end the step here and fail it before the case below.
          code=0
          cargo mutants --config "$RUNNER_TEMP/mutants.toml" --jobs "$JOBS" "${args[@]}" || code=$?
          case "$code" in
            0) echo "every mutant caught" ;;
            2) echo "some mutants missed (reported, not a failure)" ;;
            3) echo "some mutants timed out (reported, not a failure)" ;;
            *) echo "::error::cargo mutants exited $code (1 usage, 4 baseline failed, 70 internal)"
               exit "$code" ;;
          esac

      - name: Summarise the mutants
        if: ${{ !cancelled() && env.PICKED == 'true' }}
        env:
          NAME: ${{ matrix.name }}
          OUTCOME: ${{ steps.mutants.outcome }}
        run: |
          {
            if [ "$OUTCOME" != "success" ]; then
              echo "partial run: the step timed out or failed; counts cover only the mutants tested"
              echo
            fi
            echo "## Mutants on their own OS: $NAME"
            if [ -f mutants.out/outcomes.json ]; then
              jq -r '"\(.total_mutants) mutants: \(.caught) caught, \(.missed) missed,"
                + " \(.unviable) unviable, \(.timeout) timed out"' mutants.out/outcomes.json
            else
              echo "No mutants.out/outcomes.json: cargo mutants did not finish its run."
            fi
            for kind in missed timeout; do
              if [ -s "mutants.out/$kind.txt" ]; then
                echo
                echo "### $kind"
                echo
                echo '```'
                cat "mutants.out/$kind.txt"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && env.PICKED == 'true' }}
        with:
          name: mutants-platform-${{ matrix.name }}
          path: mutants.out
          retention-days: 14
          if-no-files-found: warn
