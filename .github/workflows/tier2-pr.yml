# Windows ARM64's check on a pull request. Windows ARM64 runs Windows x64's tests, elevated tests
# included, in the merge group (without clippy and the keychain smoke test, which run nightly and
# on demand; ci.yml's notes, since 2026-11-08), not on a pull request: there ci.yml's
# build matrix leaves it out, and this job reports its check instead. Skipped by `if`, it takes no
# runner and reports as skipped, which also passes the check once it is required. It builds and
# tests nothing. It runs on pull requests only, so in a merge group ci.yml's real job alone
# reports `build (aarch64-pc-windows-msvc)`.
name: tier 2 on pull requests
on:
  pull_request:
permissions: {}
jobs:
  tier2-aarch64-pc-windows-msvc:
    name: build (aarch64-pc-windows-msvc)
    # Never true (no event is named never); actionlint rejects a constant `false`.
    if: github.event_name == 'never'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Windows ARM64 builds and tests in the merge group, nightly and on demand, not on a pull request."
