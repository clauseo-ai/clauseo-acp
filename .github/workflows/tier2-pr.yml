# Windows ARM64's check on a pull request. Tier 2 runs nightly and on demand (ci.yml's notes): on
# a pull request ci.yml's build matrix leaves Windows ARM64 out, and this job reports its check
# instead. Skipped by `if`, it takes no runner and reports as skipped. It builds and tests
# nothing, so Rohan's CI decision (2026-11-04) leaves it as it is.
name: tier 2 on pull requests
on:
  pull_request:
permissions: {}
jobs:
  tier2-aarch64-pc-windows-msvc:
    name: build (aarch64-pc-windows-msvc)
    # Never true (no event is named never); actionlint rejects a constant `false`.
    if: github.event_name == 'never'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Windows ARM64 is tier 2; it builds and tests nightly and on demand."
