# Engines publish: signs G16's pins (crates/limits/tests/live/package.json, its lock, engines.seq)
# and the snapshot's SIZES as the engine list engines.json (format clauseo-engines/1) and uploads it
# with its updater signature to the GitHub release `engines`, where installed apps take newer
# engines without an app release (crates/engines checks it). The logic is in
# .github/scripts/engines-publish.mjs, so it runs locally too; engines-publish.test.mjs tests it and
# lints this file.
#
# PRECONDITIONS (admin side, Rohan's decision; until they are done, publish is refused at the
# environment):
# - The environments `release` and `release-test` must allow deployments from `main`: today
#   `release` allows only tag:v* and `release-test` only tag:test-v*.
# - `release-test` must get a required reviewer too (`release` has its own already).
#
# - By hand only (workflow_dispatch), on main of clauseo-ai/clauseo-acp only (a fork's copy does
#   nothing). Never on a push or a pull request. After an engine bump (engine-watch.yml) merges,
#   the CI thread or stage F dispatches it with lane engines.
# - Lanes: `engines` (the release `engines`, environment `release`, the app's updater key, apps =
#   tauri.conf.json's version plus the latest v<X.Y.Z> release's) and `engines-test` (the release
#   `engines-test`, environment `release-test`, the throwaway test key, apps = the apps input).
# - Seq: engines.seq when the lane has no live list (<lane>/engines.json and its .sig both absent),
#   else max(engines.seq, live + 1), where live comes only from a live list that verifies in plan
#   (the lane's key, the exact trusted comment, the self-check); one file alone, or a list that
#   does not verify, fails the run. The new seq must be above live and at most 2^16 above it (the
#   verifier's ceiling); plan prints the choice and why, and publish re-downloads the live list
#   right before signing and refuses if it is not the one plan saw. rollback_to=<n> publishes the archived <lane>-<n>.json
#   again (its signature checked under the lane's key; its apps, pins and sizes kept) with seq =
#   live + 1 and generated = now.
# - Two jobs. `plan` (no environment, no secret, contents: read) builds and self-checks
#   engines.json, prints what will be signed to the job summary (seq old -> new, versions, apps,
#   commit, sha256, the whole file) and hands the file on as an artifact. `publish` is the only
#   job with an environment, so its approval comes after plan's summary and before any step: it
#   refuses an artifact whose sha256 is not plan's, checks the key signs for the lane's public key
#   (a scratch file, as release.yml's custody does), signs exactly that file with no
#   --app-version (the trusted comment must be timestamp:<n>\tfile:engines.json), verifies it,
#   and uploads <lane>-<seq>.json and its .sig, then engines.json.sig and engines.json. The release
#   is a pre-release made with --latest=false and never marked latest.
# - Permissions: plan contents: read, publish contents: write. checkout keeps no credentials; the
#   signing key and its password reach only the probe and sign steps, through env:. No expression
#   is written inside a run: script. Every action is pinned by its full commit SHA.

name: Engines publish

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "engines (the app's key, environment release) or engines-test (the test key, environment release-test)"
        type: choice
        options: [engines, engines-test]
        default: engines
      rollback_to:
        description: "Publish the archived list of this seq again, as live + 1 (empty: the list from main)"
        type: string
        required: false
        default: ""
      apps:
        description: "engines-test only: the app versions, comma-separated (X.Y.Z or X.Y.Z-dev.<sha>)"
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: engines-publish-${{ inputs.lane }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    if: github.repository == 'clauseo-ai/clauseo-acp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      seq: ${{ steps.plan.outputs.seq }}
      live_seq: ${{ steps.plan.outputs.live_seq }}
      live_sha256: ${{ steps.plan.outputs.live_sha256 }}
      sha256: ${{ steps.plan.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/package.json
          package-manager-cache: false

      # The seq gate, the rollback's rebuild and the self-check are in the script. GH_TOKEN (the
      # job's read-only token) only reads the latest release through the API.
      - name: Build engines.json and print what will be signed
        id: plan
        env:
          LANE: ${{ inputs.lane }}
          ROLLBACK_TO: ${{ inputs.rollback_to }}
          APPS: ${{ inputs.apps }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/engines-publish.mjs --plan "$RUNNER_TEMP/engines"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engines-json
          path: ${{ runner.temp }}/engines/engines.json
          if-no-files-found: error

  publish:
    name: publish
    needs: plan
    if: github.repository == 'clauseo-ai/clauseo-acp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.lane == 'engines-test' && 'release-test' || 'release' }}
    permissions:
      contents: write
    env:
      LANE: ${{ inputs.lane }}
      SEQ: ${{ needs.plan.outputs.seq }}
      LIVE_SEQ: ${{ needs.plan.outputs.live_seq }}
      PLANNED_LIVE_SHA256: ${{ needs.plan.outputs.live_sha256 }}
      PLANNED_SHA256: ${{ needs.plan.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/package.json
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engines-json
          path: ${{ runner.temp }}/engines

      # What the approver saw in plan's summary, byte for byte, or nothing is signed.
      - name: The artifact is the file plan printed
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$PLANNED_SHA256" =~ ^[0-9a-f]{64}$ ]] || fail "plan gave no sha256"
          [[ "$SEQ" =~ ^[1-9][0-9]*$ ]] || fail "plan gave no seq"
          [ "$(find "$RUNNER_TEMP/engines" -type f | wc -l)" = 1 ] || fail "the artifact holds more than engines.json"
          got=$(sha256sum "$RUNNER_TEMP/engines/engines.json" | cut -d' ' -f1)
          [ "$got" = "$PLANNED_SHA256" ] || fail "the artifact's sha256 is $got, not plan's $PLANNED_SHA256"
          node .github/scripts/engines-publish.mjs --self-check "$RUNNER_TEMP/engines/engines.json"
          node .github/scripts/engines-publish.mjs --pubkey "$LANE" "$RUNNER_TEMP/lane.pub"

      # Before the key: the Tauri CLI from the lock file.
      - name: Install the ui workspace
        run: pnpm -C ui install --frozen-lockfile

      # The key only here and in the next step. tauri signer's output (a signature, public) goes
      # nowhere; nothing prints the key or its password.
      - name: The lane's key signs, and the lane's public key verifies it
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.lane == 'engines-test' && secrets.TAURI_SIGNING_PRIVATE_KEY_TEST || inputs.lane == 'engines' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.lane == 'engines-test' && secrets.TAURI_SIGNING_PRIVATE_KEY_TEST_PASSWORD || inputs.lane == 'engines' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || fail "the $LANE lane's environment has no signing key"
          dir=$RUNNER_TEMP/probe
          mkdir -p "$dir"
          name=probe-$GITHUB_RUN_ID.txt
          echo "Clauseo $LANE, probe of run $GITHUB_RUN_ID" > "$dir/$name"
          pnpm -s -C ui tauri signer sign "$dir/$name" > /dev/null ||
            fail "tauri signer could not sign with the $LANE key (a wrong password, or not a key)"
          node .github/scripts/latest-json.mjs --verify "$dir/$name" "$RUNNER_TEMP/lane.pub" ||
            fail "the $LANE lane's signing key is not the key of its public key"
          rm -rf "$dir"
          echo "probe: the $LANE key signs, and the lane's public key verifies it" | tee -a "$GITHUB_STEP_SUMMARY"

      # Right before signing: the live list (downloaded and verified again) is the one plan saw, by
      # sha256 or both none, and SEQ is still above it and at most 2^16 above it. The repository is
      # public, so the download needs no token.
      - name: The live list is still the one plan saw
        run: node .github/scripts/engines-publish.mjs --live-check

      # Exactly the checked file, and nothing else, with no --app-version.
      - name: Sign engines.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.lane == 'engines-test' && secrets.TAURI_SIGNING_PRIVATE_KEY_TEST || inputs.lane == 'engines' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.lane == 'engines-test' && secrets.TAURI_SIGNING_PRIVATE_KEY_TEST_PASSWORD || inputs.lane == 'engines' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          pnpm -s -C ui tauri signer sign "$RUNNER_TEMP/engines/engines.json" > /dev/null
          [ -s "$RUNNER_TEMP/engines/engines.json.sig" ] || { echo "::error::tauri signer wrote no engines.json.sig"; exit 1; }

      - name: Verify the signature and its trusted comment
        run: |
          set -euo pipefail
          got=$(sha256sum "$RUNNER_TEMP/engines/engines.json" | cut -d' ' -f1)
          [ "$got" = "$PLANNED_SHA256" ] || { echo "::error::engines.json changed after plan"; exit 1; }
          node .github/scripts/latest-json.mjs --verify "$RUNNER_TEMP/engines/engines.json" "$RUNNER_TEMP/lane.pub"
          node .github/scripts/engines-publish.mjs --check-signature "$RUNNER_TEMP/engines/engines.json" "$RUNNER_TEMP/lane.pub"
          node .github/scripts/engines-publish.mjs --self-check "$RUNNER_TEMP/engines/engines.json"

      # The archive first, then the signature, then the list. A pre-release that is never latest:
      # installed apps read latest.json through releases/latest.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src=$RUNNER_TEMP/engines
          arc=$RUNNER_TEMP/archive
          mkdir -p "$arc"
          if ! gh release view "$LANE" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$LANE" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --target main \
              --title "Engine list ($LANE)" \
              --notes "Clauseo's signed engine list (engines.json), published by engines-publish.yml. Not an app release."
          fi
          cp "$src/engines.json" "$arc/$LANE-$SEQ.json"
          cp "$src/engines.json.sig" "$arc/$LANE-$SEQ.json.sig"
          gh release upload "$LANE" "$arc/$LANE-$SEQ.json" "$arc/$LANE-$SEQ.json.sig" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$LANE" "$src/engines.json.sig" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$LANE" "$src/engines.json" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Name what was published in the job summary
        run: |
          set -euo pipefail
          { echo "Published \`$LANE/engines.json\`, seq $LIVE_SEQ → $SEQ (\`$LANE-$SEQ.json\` archived),"
            echo "sha256 \`$PLANNED_SHA256\`; plan's summary lists its versions and apps."; } >> "$GITHUB_STEP_SUMMARY"
          echo "Published $LANE seq $LIVE_SEQ -> $SEQ"
