# Build-loop numbers on GitHub's shared runners, started by hand: a cold build of the app,
# `cargo xtask buildtime all`, `cargo xtask buildtime worktree`, and on both Windows runners the
# Rust half again linked with MSVC's link.exe, to compare with rust-lld, the default there
# (.cargo/config.toml). Shared runners report; they never gate, so this runs on demand only.
#
# - The cold build is timed with Perl's Time::HiRes: the macOS runner's bash is 3.2, which has no
#   EPOCHREALTIME, and Perl ships with macOS and Git for Windows.
# - No version is written here, as in ci.yml: Rust comes from rust-toolchain.toml, pnpm from
#   "packageManager" and Node from "engines.node" in ui/package.json.
# - No build cache: the cold build must start from an empty target/.
# - Each job writes every probe to its step summary, with a warning for each failed or skipped
#   probe, and uploads `buildtime-<machine>`: the JSON of every buildtime run, a TSV with the cold
#   build in seconds, and on Windows the `cargo build -v` log of the link.exe build.
# - Every action is pinned by commit SHA, with its tag in a comment.

name: buildtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: measure (${{ matrix.machine }})
    runs-on: ${{ matrix.runner }}
    # About twice the slowest job so far: windows-11-arm took about 24 minutes in run 41168653043.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, machine: macos-15-runner }
          - { runner: windows-2025, machine: windows-2025-runner }
          - { runner: windows-11-arm, machine: windows-11-arm-runner }
    env:
      # Cargo turns incremental off whenever CI is set, and buildtime refuses to measure without it.
      CARGO_INCREMENTAL: "1"
      MACHINE: ${{ matrix.machine }}
      # Relative to the checkout, untracked, and outside target/, which `cargo clean` empties.
      OUT: buildtime-out
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/package.json
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Show the machine and the tools
        run: |
          echo "runner $MACHINE: $(uname -sm), $(nproc 2>/dev/null || sysctl -n hw.ncpu) CPUs, bash $BASH_VERSION"
          rustc -V
          echo "pnpm $(pnpm -v), node $(node -v), $(perl -v | grep -m1 'This is')"

      # Downloads stay out of the timings: the crates are fetched and the ui workspace installed first.
      - name: Fetch the crates and install the ui workspace
        run: |
          cargo fetch --locked
          pnpm -C ui install --frozen-lockfile

      - name: Cold build of the app after cargo clean
        run: |
          now() { perl -MTime::HiRes=time -e 'printf "%.6f\n", time'; }
          mkdir -p "$OUT"
          cargo clean
          start=$(now)
          cargo build -p clauseo-desktop
          awk -v a="$start" -v b="$(now)" 'BEGIN { printf "cold_build_desktop\t%.3f\n", b - a }' >> "$OUT/steps.tsv"

      - name: cargo xtask buildtime all
        run: cargo xtask buildtime all --runs 5 --json > "$OUT/buildtime-$MACHINE.json"

      # A failed probe fails the step, but the other numbers are still worth having, so the steps
      # after it run unless the run was cancelled. The worktree runs before the link.exe build,
      # since changing the linker rebuilds every crate and its warm-up would rebuild them again.
      - name: cargo xtask buildtime worktree
        if: ${{ !cancelled() }}
        run: cargo xtask buildtime worktree --runs 5 --json > "$OUT/buildtime-$MACHINE-worktree.json"

      # Git Bash has its own /usr/bin/link, so the step checks that cargo passed link.exe to rustc;
      # rustc finds MSVC's link.exe through the Visual Studio install, and GNU link would fail the
      # build, since it takes two file names and no options.
      - name: cargo xtask buildtime rust, linked with MSVC's link.exe
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: link.exe
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER: link.exe
        run: |
          # A failed probe still leaves the linker to check; the step fails at the end.
          cargo xtask buildtime rust --runs 5 --json > "$OUT/buildtime-$MACHINE-link-exe.json" || status=$?
          touch crates/desktop/src/lib.rs
          cargo build -v -p clauseo-desktop 2>&1 | tee "$OUT/link-exe-build-v.log"
          if ! grep -e '--crate-name clauseo_desktop' "$OUT/link-exe-build-v.log" \
            | grep -e '--crate-type bin' | grep -q -e '-C linker=link.exe'; then
            echo "::error::cargo build -v shows no -C linker=link.exe for the clauseo-desktop binary"
            exit 1
          fi
          echo "cargo build -v: the clauseo-desktop binary was linked with -C linker=link.exe"
          exit "${status:-0}"

      - name: Write every probe to the step summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## buildtime on $MACHINE"
            echo
            if [ -f "$OUT/steps.tsv" ]; then
              echo "Cold build after cargo clean: $(cut -f2 "$OUT/steps.tsv") s"
            else
              echo "Cold build after cargo clean: no number"
            fi
            echo
            echo "| run | probe | status | median | min | max | unit | budget |"
            echo "|---|---|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for run in "" -worktree -link-exe; do
            [ "$run" = -link-exe ] && [ "$RUNNER_OS" != Windows ] && continue
            file="$OUT/buildtime-$MACHINE$run.json"
            name="${run#-}"
            name="${name:-all}"
            if [ ! -s "$file" ]; then
              echo "::warning title=buildtime $name::$file is missing or empty"
              continue
            fi
            if ! jq empty "$file" 2>/dev/null; then
              echo "::warning title=buildtime $name::$file is not valid JSON"
              continue
            fi
            jq -r --arg run "$name" '
              ((.probes // []) + (.web.probes // []))[]
              | "| \($run) | \(.probe) | \(.status) | \(.median // "") | \(.min // "") | \(.max // "") | \(.unit) | \(.budget // "") |"
            ' "$file" >> "$GITHUB_STEP_SUMMARY"
            jq -r --arg run "$name" '
              (((.probes // []) + (.web.probes // []))[]
                | select(.status == "failed" or .status == "skipped")
                | "::warning title=\($run) \(.probe) \(.status)::\(.reason // "no reason given")"),
              (((.errors // []) + (.web.errors // []))[] | "::warning title=\($run) error::\(.)")
            ' "$file"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: buildtime-${{ matrix.machine }}
          path: ${{ env.OUT }}
          # A job that fails before the cold build makes $OUT has nothing to upload, and its own
          # error says why.
          if-no-files-found: warn
          retention-days: 30
