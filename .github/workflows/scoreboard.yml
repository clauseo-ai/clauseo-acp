# The speed scoreboard (R13) where it needs a macOS runner or a full-LTO build. The pull request
# comment (scoreboard-comment.yml) reads scoreboard-macos from here; e2e-windows.yml's
# scoreboard-windows job plays smoke's LTO-off build on every product pull request and main.
#
# - scoreboard-macos: the `marks` build of the app plays fake_agent's scoreboard session by itself,
#   one warm-up and three measured launches (ui/e2e/scoreboard/macos.ts), and the job uploads
#   scoreboard-macos.json as the artifact scoreboard-macos. The marks feature's clippy and tests
#   run in ci.yml (macOS build job and Linux build job), where a failure counts. Every push to main, nightly, on demand, and pull requests
#   labelled `scoreboard`: macOS runners are capped at 5 for the whole org, and their queue was the
#   slowest part of a pull request's checks, so an unlabelled pull request takes at most one
#   (ci.yml's `build (aarch64-apple-darwin)`, which also clippies the marks feature).
# - scoreboard-windows-lto: the full-LTO release build with the e2e feature, the shipping-grade
#   binary, played as scoreboard-windows plays smoke's; uploaded as scoreboard-windows-lto, which
#   the comment does not read. Nightly, on demand, and pull requests labelled `scoreboard`.
# - Its own workflow, so the label trigger stays out of ci.yml and e2e-windows.yml: `labeled`
#   there would re-run them for any label, and their cancel-in-progress would kill the run in
#   progress. Here a label other than `scoreboard` starts a run whose jobs are all skipped, in a
#   concurrency group of its own, so it cancels nothing and takes no runner; scoreboard-comment.yml
#   skips such a run too. Adding the label starts a run; each push to a labelled pull request
#   starts another.
# - The numbers report and alert, so a failure leaves the run green (continue-on-error): a red run
#   on main would hide its numbers from the comment, which reads main's successful runs only. Not a
#   required check.
# - No version is written here, as in ci.yml. Every action is pinned by commit SHA, with its tag in
#   a comment.

name: scoreboard

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A pull request keeps only its newest run, except that a run started by another label gets a
# group of its own (its run id), so it never cancels a scoreboard in progress. Each push to main,
# nightly run and run on demand has a group of its own, as in ci.yml.
concurrency:
  group: >-
    scoreboard-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.sha) }}${{
    (github.event.action == 'labeled' && github.event.label.name != 'scoreboard') && format('-other-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scoreboard-macos:
    name: scoreboard-macos
    if: >-
      github.event_name != 'pull_request'
      || (github.event.action == 'labeled' && github.event.label.name == 'scoreboard')
      || (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'scoreboard'))
    runs-on: macos-15
    continue-on-error: true
    # About 12 minutes of build and tests, then at worst 4 plays × 3 launches × 240 s
    # (PLAY_TIMEOUT_MS and PLAY_ATTEMPTS in ui/e2e/scoreboard/macos.ts): 60 minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/package.json
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # Its own key: the marks feature changes the desktop crate's build. Saved on main only.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: scoreboard-macos
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the ui workspace
        run: pnpm -C ui install --frozen-lockfile

      # `tauri build` embeds ui/app/dist (custom-protocol); `marks` turns on e2e as well.
      - name: Build the app with the marks feature
        run: pnpm -C ui tauri build --no-bundle --features marks

      - name: Build fake_agent
        run: cargo build --release --locked -p clauseo-fake_agent

      # Plain Node, no install: macos.ts imports Node's own modules and ui/e2e files only.
      - name: Speed scoreboard
        env:
          MARKS_APP: ${{ github.workspace }}/target/release/clauseo-desktop
          MARKS_FAKE_AGENT: ${{ github.workspace }}/target/release/fake_agent
          SCOREBOARD_OUT: ${{ runner.temp }}/scoreboard-out
        # The runner stretches short sleeps: in PR #106's runs, 200 sleeps of 5 ms took 5.5 to 6.2 s
        # (App Nap off and `taskpolicy -a` changed nothing), so the stream ran about 85 s instead
        # of 13 s. macos.ts then reports first token, React commits per frame and IPC as not
        # measured and keeps the rest. The probe prints this run's figure first.
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # Perl's variables, not the shell's.
          probe='use Time::HiRes qw(sleep time); my $t = time; sleep(0.005) for 1..200; printf "200 sleeps of 5 ms: %.0f ms\n", (time - $t) * 1000'
          perl -e "$probe"
          node ui/e2e/scoreboard/macos.ts

      # comment.ts reads scoreboard-macos.json from the artifact scoreboard-macos.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: scoreboard-macos
          path: ${{ runner.temp }}/scoreboard-out/scoreboard-macos.json
          if-no-files-found: warn

      # Each play's run file as the app wrote it (warm-up included), for checking the medians by
      # hand. A separate artifact the comment never reads.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: scoreboard-macos-runs
          path: ${{ runner.temp }}/scoreboard-out/runs
          if-no-files-found: warn

  scoreboard-windows-lto:
    name: scoreboard-windows-lto
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event.action == 'labeled' && github.event.label.name == 'scoreboard')
      || (github.event_name == 'pull_request' && github.event.action != 'labeled'
          && contains(github.event.pull_request.labels.*.name, 'scoreboard'))
    runs-on: windows-2025
    continue-on-error: true
    # About 8 minutes of build, then the four plays with room for slow ones.
    timeout-minutes: 45
    env:
      TARGET: x86_64-pc-windows-msvc
      E2E_APP: ${{ github.workspace }}/target/x86_64-pc-windows-msvc/release/clauseo-desktop.exe
      E2E_FAKE_AGENT: ${{ github.workspace }}/target/x86_64-pc-windows-msvc/release/fake_agent.exe
      SCOREBOARD_OUT: ${{ github.workspace }}/scoreboard-out
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain from rust-toolchain.toml, and the target
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/package.json
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # Its own key: the full-LTO release build shares no dependency builds with smoke's. Saved by
      # the nightly run (on main) only.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: scoreboard-windows-lto
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the ui workspace
        run: pnpm -C ui install --frozen-lockfile

      - name: Build the app with the e2e feature (full LTO)
        run: pnpm -C ui tauri build --no-bundle --features e2e --target "$TARGET"

      - name: Build fake_agent
        run: cargo build --release --locked -p clauseo-fake_agent --target "$TARGET"

      - name: Speed scoreboard
        run: |
          status=0
          pnpm -C ui/e2e test scoreboard.spec.ts || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Speed scoreboard failed::scoreboard.spec.ts exited with $status; no scoreboard-windows.json"
            exit "$status"
          fi

      # The same file as scoreboard-windows, under a name the comment does not read.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scoreboard-windows-lto
          path: ${{ github.workspace }}/scoreboard-out/scoreboard-windows.json
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: scoreboard-windows-lto-runs
          path: ${{ github.workspace }}/scoreboard-out/runs
          if-no-files-found: warn
