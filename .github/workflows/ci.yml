# CI: the fast lane (`cargo xtask check` on Linux) and the blank app built and tested on every
# target. Nightly and on demand, it also runs the mutation tests of main's last 24 hours.
#
# - No version is written here. Rust comes from rust-toolchain.toml, pnpm from "packageManager" and
#   Node from "engines.node" in ui/package.json, and the cargo tools and gitleaks from
#   xtask/src/setup.rs, which .github/actions/install-pinned-tools reads with
#   `cargo xtask setup --list=json` and installs as prebuilt binaries. The WebKitGTK packages come
#   from .github/actions/install-tauri-linux-deps.
# - Tier 1 (macOS Apple silicon, Windows x64) and Linux build and test on every pull request.
#   Tier 2 (Intel macOS, Windows ARM64) waits for the merge: on a pull request its build jobs start
#   but skip every step, and they run in full on each push to main, nightly and on demand. The
#   Apple silicon job checks on each pull request that the workspace still compiles for Intel macOS.
# - A pull request that touches only Markdown or docs/ still runs the fast lane, and the build jobs
#   still start but skip every step. A job skipped as a whole would report its check under the
#   unexpanded name "build (${{ matrix.target }})", and a required check that never reports blocks
#   the merge.
# - The mutants job has no matrix, so it is skipped as a whole on pull requests and pushes, where it
#   still reports its check as "mutants". It only reports: a missed mutant never fails the run.
# - The Linux job runs the tests with the network cut off, so a test that reaches the network fails.
# - reducer-bench counts clauseo-reducer's instructions under Valgrind on every run and, on a pull
#   request, compares them with the merge-base on main. It uploads the counts as the
#   reducer-bench-summary artifact, which the speed scoreboard's comment reads
#   (scoreboard-comment.yml).
# - scoreboard-macos plays the speed scoreboard on macOS Apple silicon (R13): the `marks` build of
#   the app plays fake_agent's scoreboard session by itself, one warm-up and three measured launches
#   (ui/e2e/scoreboard/macos.ts), and the job uploads scoreboard-macos.json as the artifact
#   scoreboard-macos for the scoreboard comment. It runs on pull requests that touch product code
#   (crates/, ui/, Cargo.toml, Cargo.lock; the `product` output of changes), on every push to
#   main, nightly and on demand. It is not a required check: on other pull requests it is skipped
#   as a whole.
# - Every third-party action is pinned by commit SHA, with its tag in a comment.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Nightly, on main: the tier-2 builds and the mutants of the last 24 hours.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A pull request keeps only its newest run. Each push to main has a group of its own: in a shared
# group, GitHub keeps one pending run and cancels it when a newer push arrives, even without
# cancel-in-progress, so a commit merged between two others would never be checked. A nightly or
# on-demand run has its own group too, so it never cancels or waits on the push of the same commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.filter.outputs.build }}
      product: ${{ steps.filter.outputs.product }}
    steps:
      # A push, the nightly run and a run on demand build everything; a pull request builds unless
      # it changes only Markdown or docs/. `product` (the scoreboard) is true for a push, nightly,
      # on demand, and a pull request that touches crates/, ui/, Cargo.toml or Cargo.lock (the
      # paths of comment.ts's isProductPath).
      - name: Decide whether the build jobs run
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "product=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git init -q work
          cd work
          git fetch -q --no-tags --filter=blob:none "$REPO_URL" \
            "+refs/heads/${BASE_REF}:refs/ci/base" \
            "+${HEAD_SHA}:refs/ci/head"
          # --no-renames lists both sides of a rename, so a code file renamed to .md or moved under
          # docs/ still runs the builds.
          changed=$(git diff --no-renames --name-only refs/ci/base...refs/ci/head)
          code=$(printf '%s\n' "$changed" | grep -vE '\.md$|^docs/' || true)
          if [ -n "$code" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only Markdown or docs/ changed: the build jobs skip their steps."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
          product=$(printf '%s\n' "$changed" | grep -E '^(crates/|ui/|Cargo\.toml$|Cargo\.lock$)' || true)
          if [ -n "$product" ]; then
            echo "product=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change to product code (crates/, ui/, Cargo.toml, Cargo.lock): no macOS scoreboard."
            echo "product=false" >> "$GITHUB_OUTPUT"
          fi

  fast-lane:
    name: fast-lane
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Full history: `cargo xtask check` diffs against the merge-base with origin/main, and a
      # shallow clone has none.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # clippy builds the desktop crate, which links WebKitGTK.
      - name: Install the Linux system packages Tauri needs
        uses: ./.github/actions/install-tauri-linux-deps

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/package.json
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Show the pnpm and Node versions against ui/package.json
        run: |
          echo "pnpm $(pnpm -v), ui/package.json wants $(node -p 'require("./ui/package.json").packageManager')"
          echo "node $(node -v), ui/package.json wants $(node -p 'require("./ui/package.json").engines.node')"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"

      # Every pinned tool, as prebuilt binaries; nothing is built from source.
      - name: Install the pinned tools
        uses: ./.github/actions/install-pinned-tools

      - name: cargo xtask check
        run: CI=1 cargo xtask check

  build:
    name: build (${{ matrix.target }})
    needs: changes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # `tier2`: skipped on pull requests, built in full on push to main, nightly and on demand.
        include:
          - { target: aarch64-apple-darwin, runner: macos-15, native: true, tier2: false }
          # Cross-compiled on the arm64 runner, so it is built but not linted or tested.
          - { target: x86_64-apple-darwin, runner: macos-15, native: false, tier2: true }
          # The oldest glibc we support; release packages are built here later.
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04, native: true, tier2: false }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025, native: true, tier2: false }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm, native: true, tier2: true }
    env:
      TARGET: ${{ matrix.target }}
      EXE: clauseo-desktop${{ contains(matrix.target, '-windows-') && '.exe' || '' }}
      CODE: ${{ needs.changes.outputs.build }}
      TIER2_WAITS: ${{ matrix.tier2 && github.event_name == 'pull_request' }}
      BUILD: ${{ needs.changes.outputs.build == 'true' && !(matrix.tier2 && github.event_name == 'pull_request') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Skip, only Markdown or docs/ changed
        if: env.CODE != 'true'
        run: echo "Only Markdown or docs/ changed; nothing to build."

      - name: Skip, a tier-2 target builds after the merge
        if: env.CODE == 'true' && env.TIER2_WAITS == 'true'
        run: echo "$TARGET is tier 2; it builds on push to main, nightly and on demand."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.BUILD == 'true'
        with:
          persist-credentials: false

      - name: Install the Rust toolchain from rust-toolchain.toml, and the target
        if: env.BUILD == 'true'
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - name: Install the Linux system packages Tauri needs
        if: env.BUILD == 'true' && runner.os == 'Linux'
        uses: ./.github/actions/install-tauri-linux-deps
        with:
          extra-packages: xvfb

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.BUILD == 'true'
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.BUILD == 'true'
        with:
          node-version-file: ui/package.json
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: env.BUILD == 'true'
        with:
          key: ${{ matrix.target }}
          cache-bin: "false"

      - name: Install the ui workspace
        if: env.BUILD == 'true'
        run: pnpm -C ui install --frozen-lockfile

      # `tauri build` turns on `custom-protocol`, so the binary embeds ui/app/dist. A plain
      # `cargo build` would load devUrl instead.
      - name: Build the app
        if: env.BUILD == 'true'
        run: pnpm -C ui tauri build --no-bundle --target "$TARGET"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.BUILD == 'true'
        with:
          name: clauseo-desktop-${{ matrix.target }}
          path: target/${{ env.TARGET }}/release/${{ env.EXE }}
          if-no-files-found: error

      # One developer works on an Intel Mac, so main must always compile there; the full Intel
      # build waits for the merge. After the app build, which writes the ui/app/dist the desktop
      # crate embeds.
      - name: Check that the workspace compiles for Intel macOS
        if: env.BUILD == 'true' && matrix.target == 'aarch64-apple-darwin' && github.event_name == 'pull_request'
        run: |
          rustup target add x86_64-apple-darwin
          cargo check --workspace --all-targets --target x86_64-apple-darwin --locked

      # The app must still be running when the timeout stops it (exit 124), without a panic.
      - name: Launch the app under xvfb
        if: env.BUILD == 'true' && runner.os == 'Linux'
        run: |
          status=0
          xvfb-run -a timeout 15 "target/$TARGET/release/$EXE" > launch.log 2>&1 || status=$?
          cat launch.log
          if [ "$status" -ne 124 ]; then
            echo "::error::the app exited with $status before the 15 s timeout; expected 124"
            exit 1
          fi
          if grep -n 'panicked' launch.log; then
            echo "::error::the app panicked"
            exit 1
          fi

      # cfg-gated code is linted only on its own OS.
      - name: clippy
        if: env.BUILD == 'true' && matrix.native
        run: cargo clippy --workspace --all-targets --target "$TARGET" -- -D warnings

      # The tests need only one pinned tool, nextest, as a prebuilt binary.
      - name: Install nextest at its pin
        if: env.BUILD == 'true' && matrix.native
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: cargo-nextest

      - name: Test
        if: env.BUILD == 'true' && matrix.native && runner.os != 'Linux'
        run: cargo nextest run --workspace --profile ci --no-tests=pass

      # Twice: tauri's generate_context! writes each compressed asset into the crate's OUT_DIR
      # while that crate compiles, and only if the file is missing (tauri-codegen 2.7.3,
      # embedded_assets.rs:355). On a fresh OUT_DIR cargo then finds the asset newer than the start
      # of that compile and marks the unit stale, even when nothing else builds beside it. The
      # second pass rebuilds it with every asset in place, writes nothing, and leaves the offline
      # run nothing to build.
      - name: Build the tests
        if: env.BUILD == 'true' && runner.os == 'Linux'
        run: |
          cargo nextest run --workspace --profile ci --no-tests=pass --no-run
          cargo nextest run --workspace --profile ci --no-tests=pass --no-run

      # A new network namespace with only loopback, entered as root and then dropped back to the
      # runner user, without its supplementary groups (docker's socket would reach the network) and
      # with no_new_privs (sudo could otherwise nsenter back out). sudo may replace PATH, HOME and
      # the cargo and rustup homes, so they go through RUN_* variables. The script reads every value
      # from the environment; none is pasted in.
      - name: Test without the network
        if: env.BUILD == 'true' && runner.os == 'Linux'
        run: |
          RUN_UID=$(id -u) RUN_GID=$(id -g) RUN_PATH=$PATH RUN_HOME=$HOME \
          RUN_CARGO_HOME=${CARGO_HOME:-$HOME/.cargo} RUN_RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup} \
            sudo --preserve-env unshare --net -- sh -euc '
              ip link set lo up
              ip -brief address show dev lo
              as_runner() {
                setpriv --reuid="$RUN_UID" --regid="$RUN_GID" --clear-groups --no-new-privs \
                  env PATH="$RUN_PATH" HOME="$RUN_HOME" CARGO_HOME="$RUN_CARGO_HOME" \
                  RUSTUP_HOME="$RUN_RUSTUP_HOME" CARGO_NET_OFFLINE=true "$@"
              }
              echo "uid inside the namespace: $(as_runner id -u)"
              as_runner cargo nextest run --workspace --profile ci --no-tests=pass
            '

  # The speed scoreboard on macOS (R13). The `marks` build plays the session itself and writes each
  # run to MARKS_OUT; macos.ts launches it four times and writes the medians. Its numbers report and
  # alert, so a failure leaves the run green (continue-on-error, as mutants): a red CI run on main
  # would also hide that run's reducer-bench-summary from the comment, which reads main's
  # successful runs only. The job is not a required check. It also runs the desktop crate's tests
  # and clippy with the marks feature, which no other job builds: a failure there marks this job
  # failed and skips the plays, and the run stays green as above.
  scoreboard-macos:
    name: scoreboard-macos
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: macos-15
    continue-on-error: true
    # About 12 minutes of build and tests, then at worst 4 plays × 3 launches × 240 s
    # (PLAY_TIMEOUT_MS and PLAY_ATTEMPTS in ui/e2e/scoreboard/macos.ts): 60 minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/package.json
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # Its own key: the marks feature changes the desktop crate's build.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: scoreboard-macos
          cache-bin: "false"

      - name: Install the ui workspace
        run: pnpm -C ui install --frozen-lockfile

      # `tauri build` embeds ui/app/dist (custom-protocol); `marks` turns on e2e as well.
      - name: Build the app with the marks feature
        run: pnpm -C ui tauri build --no-bundle --features marks

      - name: Build fake_agent
        run: cargo build --release --locked -p clauseo-fake_agent

      # The desktop crate's marks-only code and tests, which no other job compiles. After the app
      # build, which writes the ui/app/dist the crate embeds.
      - name: Install nextest at its pin
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: cargo-nextest

      # The permission tests start fake_agent from target/debug (test_support.rs), which only a
      # workspace run builds, so the dev build comes first; the release one above is for the plays.
      - name: Test the desktop crate with the marks feature
        run: |
          cargo build --locked -p clauseo-fake_agent
          cargo nextest run -p clauseo-desktop --features marks --locked --profile ci

      - name: clippy the desktop crate with the marks feature
        run: cargo clippy -p clauseo-desktop --all-targets --features marks --locked -- -D warnings

      # Plain Node, no install: macos.ts imports Node's own modules and ui/e2e files only.
      - name: Speed scoreboard
        env:
          MARKS_APP: ${{ github.workspace }}/target/release/clauseo-desktop
          MARKS_FAKE_AGENT: ${{ github.workspace }}/target/release/fake_agent
          SCOREBOARD_OUT: ${{ runner.temp }}/scoreboard-out
        # The runner stretches short sleeps: in PR #106's runs, 200 sleeps of 5 ms took 5.5 to 6.2 s
        # (App Nap off and `taskpolicy -a` changed nothing), so the stream ran about 85 s instead
        # of 13 s. macos.ts then reports first token, React commits per frame and IPC as not
        # measured and keeps the rest. The probe prints this run's figure first.
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # Perl's variables, not the shell's.
          probe='use Time::HiRes qw(sleep time); my $t = time; sleep(0.005) for 1..200; printf "200 sleeps of 5 ms: %.0f ms\n", (time - $t) * 1000'
          perl -e "$probe"
          node ui/e2e/scoreboard/macos.ts

      # comment.ts reads scoreboard-macos.json from the artifact scoreboard-macos.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: scoreboard-macos
          path: ${{ runner.temp }}/scoreboard-out/scoreboard-macos.json
          if-no-files-found: warn

      # Each play's run file as the app wrote it (warm-up included), for checking the medians by
      # hand. A separate artifact the comment never reads.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: scoreboard-macos-runs
          path: ${{ runner.temp }}/scoreboard-out/runs
          if-no-files-found: warn

  # cargo-mutants on main's changes of the last 24 hours, nightly and on demand. It only reports:
  # a missed mutant, or a run that reaches `MUTANTS_TIMEOUT` in xtask/src/mutants.rs, shows in the
  # job summary and the `mutants-report` artifact and never fails the run.
  # - `cargo xtask mutants` diffs against the merge-base with origin/main, so origin/main is moved
  #   back to main's last commit from before the window; the diff is then the window's changes.
  # - Linux only: a second OS would double the runner minutes for the same mutants. cargo-mutants
  #   also does not build on Windows ARM64 (#41).
  mutants:
    name: mutants
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    continue-on-error: true
    # Must exceed the setup (apt, xtask's build) plus `MUTANTS_TIMEOUT` and `MUTANTS_KILL_GRACE`
    # in xtask/src/mutants.rs, so that xtask stops a long run itself and prints the missed mutants
    # found so far, before GitHub cancels the job.
    timeout-minutes: 35
    steps:
      # Full history: `cargo xtask mutants` diffs against the merge-base with origin/main, and a
      # shallow clone has none.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The newest first-parent commit older than 24 hours, or the first commit when there is none.
      # With no commit in the window it is HEAD, and `cargo xtask mutants` finds nothing to test.
      - name: Point origin/main at main as of 24 hours ago
        run: |
          set -euo pipefail
          base=$(git rev-list -1 --first-parent --before='24 hours ago' HEAD)
          if [ -z "$base" ]; then
            base=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          fi
          git update-ref refs/remotes/origin/main "$base"
          echo "Mutating the changes from $base to $(git rev-parse HEAD):"
          git log --oneline "$base..HEAD"

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # A mutant in the desktop crate builds and tests it, which links WebKitGTK.
      - name: Install the Linux system packages Tauri needs
        uses: ./.github/actions/install-tauri-linux-deps

      # Saves the crate registry downloads and xtask's own build. It does not speed up the mutants:
      # each one builds in a copy of the tree with its own target/.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: mutants
          cache-bin: "false"

      # cargo-mutants runs each mutant's tests with nextest (`test_tool` in .cargo/mutants.toml), so
      # both are installed, and no other pinned tool.
      - name: Install cargo-mutants and nextest at their pins
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: cargo-mutants cargo-nextest

      - name: cargo xtask mutants
        id: mutants
        continue-on-error: true
        run: |
          set -o pipefail
          cargo xtask mutants 2>&1 | tee mutants.log

      - name: Summarise the mutants
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.mutants.outcome }}
        run: |
          {
            echo "## Mutants of main's last 24 hours: \`cargo xtask mutants\` $OUTCOME"
            for f in target/xtask/mutants.out/outcomes.json target/xtask/wire/mutants.out/outcomes.json; do
              [ -f "$f" ] || continue
              jq -r --arg f "$f" '"- \($f): \(.total_mutants) mutants, \(.caught) caught, \(.missed) missed, \(.timeout) timed out, \(.unviable) unviable"' "$f"
            done
            echo
            echo "Last 100 lines of its output (all of it is in the mutants-report artifact):"
            echo
            echo '```'
            tail -n 100 mutants.log 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutants-report
          path: |
            mutants.log
            target/xtask/mutants.diff
            target/xtask/mutants.out
            target/xtask/wire/mutants.out
          if-no-files-found: warn

  # clauseo-reducer's instruction counts under Valgrind (gungraun), on every run: the hard limits in
  # crates/reducer_bench/benches/apply.rs always apply. On a pull request whose merge-base on main
  # has the bench, it first saves main's counts as the baseline `main`, then fails the head on more
  # than 2% more `ir` in any case (the soft limit in apply.rs) unless the pull request carries the
  # label `bench-ok`. A label added after the run started takes effect when the job is re-run.
  # - Both runs share one CARGO_TARGET_DIR: gungraun keeps baselines under it (`gungraun/`), and
  #   the head run reuses the base run's dependency builds.
  # - The soft limit is in apply.rs, not on the command line: gungraun's `--callgrind-limits`
  #   replaces each case's own limits, hard ones included. A run without `--baseline` compares with
  #   nothing, so it checks the hard limits only.
  # - The head run saves each case's summary (`--save-summary=json`); the job keeps each case's
  #   module path, id and Callgrind total `Ir` in one small JSON file and uploads it as
  #   reducer-bench-summary, even when the bench failed, so the scoreboard comment shows this
  #   run's counts next to main's (scoreboard-comment.yml). Both steps continue on error: the
  #   job's result stays the bench's.
  reducer-bench:
    name: reducer-bench
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      # Full history: the baseline is built at the merge-base with origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # Its own key: bench builds use the bench profile, which no other job builds. It keeps
      # ~/.cargo/bin, so the runner installed below is not rebuilt while its version stays.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: reducer-bench

      - name: Install Valgrind
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends valgrind

      # The runner's version must equal the gungraun library's, so it is read from Cargo.lock,
      # the one home of that version.
      - name: Install gungraun-runner at the version of the gungraun library
        run: |
          set -euo pipefail
          version=$(cargo metadata --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "gungraun") | .version')
          echo "gungraun $version"
          cargo install --locked gungraun-runner --version "$version"

      # On a pull request, HEAD is the merge commit GitHub made of the head onto main, and
      # origin/main is main as fetched. While main has not moved since that merge, the merge-base
      # is the merge commit's first parent, the main the change lands on, so the comparison shows
      # the pull request's change alone; if main has moved, it is an older main commit. A push
      # to main, the nightly run and a run on demand have no baseline.
      - name: cargo bench (apply)
        env:
          EVENT: ${{ github.event_name }}
          BENCH_OK: ${{ contains(github.event.pull_request.labels.*.name, 'bench-ok') }}
        run: |
          set -euo pipefail
          # A cached earlier run must not become the baseline.
          rm -rf "$CARGO_TARGET_DIR/gungraun"
          bench=(cargo bench --locked -p clauseo-reducer_bench --bench apply --)
          baseline=false
          if [ "$EVENT" = pull_request ]; then
            base=$(git merge-base HEAD origin/main)
            if git cat-file -e "$base:crates/reducer_bench/Cargo.toml" 2>/dev/null; then
              echo "Baseline: main at $base"
              git worktree add --detach "$RUNNER_TEMP/base" "$base"
              (cd "$RUNNER_TEMP/base" && rustup toolchain install && "${bench[@]}" --save-baseline=main)
              baseline=true
            else
              echo "No baseline: crates/reducer_bench is not at $base"
            fi
          fi
          if [ "$baseline" = true ] && [ "$BENCH_OK" != true ]; then
            "${bench[@]}" --baseline=main --save-summary=json
          else
            if [ "$BENCH_OK" = true ]; then
              echo "Label bench-ok: hard limits only"
            fi
            "${bench[@]}" --save-summary=json
          fi

      # One small file for the artifact, `{"schema": 1, "cases": [{"module_path", "id", "ir"}]}`,
      # from every summary.json of the head run (a full summary is about 15 KB a case). The base
      # run saves none, and the step before removed any from a cached run.
      - name: Collect the instruction counts
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          mapfile -d '' summaries < <(find "$CARGO_TARGET_DIR/gungraun" -name summary.json -print0 2>/dev/null | sort -z)
          if [ "${#summaries[@]}" -eq 0 ]; then
            echo "No gungraun summary.json: the bench did not get as far as a case."
            exit 0
          fi
          jq -s '{schema: 1, cases: map({module_path, id,
            ir: ([.profiles[]? | select(.tool == "Callgrind") | .data.total.metrics.Ir.values.new][0])})}' \
            "${summaries[@]}" > "$RUNNER_TEMP/reducer-bench-summary.json"
          echo "${#summaries[@]} cases in reducer-bench-summary.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: reducer-bench-summary
          path: ${{ runner.temp }}/reducer-bench-summary.json
          if-no-files-found: warn
