# CI: the fast lane (`cargo xtask check` on Linux) and the workspace linted and tested on every
# target. Nightly and on demand, it also runs the mutation tests of main's last 24 hours.
#
# Per event (Rohan's CI decision, 2026-11-04):
# - pull_request: changes, fast-lane, and what the change touches (changes.sh): vitest (newest
#   Node) on a ui change, and on a Rust change Windows x64 clippy only (PR_LINT_ONLY below), so
#   Windows-only lint errors show on the pull request and not as merge-queue ejections. The other
#   build entries take the quick skip on an ubuntu runner and report their required checks green.
# - merge_group: the full OS matrix runs once, here (Linux, Windows x64, macOS ARM64), on what
#   changes.sh says the queued changes need.
# - push to main: nothing (Rohan's CI decision, 2026-11-04). The merge queue already tested the
#   code. (macOS ARM64 ran on push from 17:20Z to 20:52Z that day, while a GitHub runner shortage
#   kept it out of the merge-queue requirement.) The `github.event_name != 'push'` guards below are
#   harmless without the trigger.
# - schedule and workflow_dispatch: everything, tier 2, the release builds, the quarantine job,
#   mutants and reducer-bench. The nightly run (ref main) saves the Rust caches.
#
# - No version is written here. Rust comes from rust-toolchain.toml, pnpm from "packageManager" and
#   Node from "engines.node" in ui/package.json, and the cargo tools and gitleaks from
#   xtask/src/setup.rs, which .github/actions/install-pinned-tools reads with
#   `cargo xtask setup --list=json` and installs as prebuilt binaries. The WebKitGTK packages come
#   from .github/actions/install-tauri-linux-deps.
# - What a pull request runs depends on the paths it changes: .github/scripts/changes.sh decides,
#   in the `changes` job, after its fixtures (changes-test.sh) pass. Without a Rust change (`rust`:
#   crates/, xtask/, Cargo.toml, Cargo.lock, the toolchain and cargo config, CI itself) the build
#   jobs start but skip every step. A path no rule knows runs everything (on a pull request, the
#   Windows clippy), and so does a failed `changes` job. A job skipped as a whole would report its check under the unexpanded name
#   "build (${{ matrix.target }})", and a required check that never reports blocks the merge.
# - In a merge group the build jobs lint and test with the dev profile only: clippy, nextest, and
#   on Linux a debug app that embeds ui/app/dist, launched under xvfb. No pull request or merge
#   group job builds a release app; e2e-windows.yml's smoke test builds and drives the Windows one.
#   The nightly run and a run on demand run the same steps (so main's Rust cache holds what merge
#   groups build) and then the release app, full LTO, uploaded as clauseo-desktop-<target>.
# - Tier 1 (macOS Apple silicon, Windows x64) and Linux build and test in the merge queue when the
#   queued changes touch Rust. Tier 2 (Intel macOS, Windows ARM64) runs nightly and on demand only:
#   on a pull request and in a merge group the matrix leaves it out, and jobs skipped by `if` report
#   its checks without taking a runner (Intel macOS's below, Windows ARM64's in tier2-pr.yml). The
#   Apple silicon job checks on each run that the workspace still compiles for Intel macOS.
# - Rust caches are saved on main only (`save-if`), which with no push run but the macOS one means
#   the nightly run; pull requests and merge groups restore main's and save nothing,
#   so they never evict main's entries from the 10 GB Actions cache. Tier 2 saves none: Intel macOS
#   restores the Apple silicon entry (same host, so its build scripts and proc macros are reused),
#   Windows ARM64 builds cold.
# - The mutants job has no matrix, so it is skipped as a whole on pull requests, merge groups and
#   pushes, where it still reports its check as "mutants". It only reports: a missed mutant never fails the run.
# - The Linux job runs the tests with the network cut off, so a test that reaches the network fails.
# - The fast lane runs on the Node the runner image has cached that "engines.node" allows (the newest
#   24.x today), but a developer's machine may have a newer major (Homebrew's), where a test can pass
#   in CI and fail locally. The vitest (newest Node) job runs ui/app's vitest, ui/components'
#   tests included, on the newest Node release "engines.node" allows (setup-node's check-latest),
#   on every pull request that changes ui/, nightly and on demand.
# - reducer-bench counts clauseo-reducer's instructions under Valgrind, nightly and on demand only
#   (Rohan's CI decision, 2026-11-04: benches, scoreboards, mutants and fuzzing stay off the paths
#   of pull requests and the queue), against the hard limits in apply.rs. It uploads the counts as
#   the reducer-bench-summary artifact.
# - The macOS speed scoreboard is in scoreboard.yml, nightly and on demand only.
# - Every third-party action is pinned by commit SHA, with its tag in a comment.

name: CI

on:
  pull_request:
  # A pull request in main's merge queue: the full OS matrix, run on main plus the pull requests
  # queued ahead of it, so two green pull requests cannot break main together.
  merge_group:
  # Nightly, on main: everything, the tier-2 builds and the mutants of the last 24 hours included.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A pull request keeps only its newest run. Pushes to main (only the macOS ARM64 job) share one group: one run goes on and one
# waits, and a newer push replaces the waiting run (GitHub cancels a pending run when a newer one
# joins the group, even without cancel-in-progress). A burst of merges is then checked once, at its
# newest commit. Every commit on main has already passed every required check as the head of its
# merge group; macOS ARM64, which only a push runs for now, is checked at least once per burst, and
# a red run is pinned to the commits since main's last completed run, not to one. A nightly or on-demand run has its own group, so it never cancels or waits on a
# push, and so has each merge group (its own head commit).
concurrency:
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'push' && format('push-{0}', github.ref)) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    # Not on push (Rohan's CI decision, 2026-11-04): the merge queue already ran it. The macOS
    # build job runs without it (a skipped `changes` builds everything).
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      app: ${{ steps.filter.outputs.app }}
      ui: ${{ steps.filter.outputs.ui }}
      product: ${{ steps.filter.outputs.product }}
    steps:
      # The script, its fixtures, and crates/, which the fixtures read (the crate manifests, and the
      # files outside the crates that Rust code reads); nothing else.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /crates/

      # A rule that would let a code change skip its jobs fails this required check instead.
      - name: Test the path rules against their fixtures
        run: bash .github/scripts/changes-test.sh

      # The nightly run and a run on demand run everything; a pull request runs what its
      # changed paths need (.github/scripts/changes.sh), and so does a merge group, from main's
      # commit it starts on to its head (the queued pull requests up to this one).
      - name: Decide which jobs run
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('refs/heads/{0}', github.event.pull_request.base.ref) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ] && [ "$EVENT" != merge_group ]; then
            printf '%s\n' rust=true app=true ui=true product=true | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          scripts=$PWD/.github/scripts
          git init -q "$RUNNER_TEMP/work"
          cd "$RUNNER_TEMP/work"
          git fetch -q --no-tags --filter=blob:none "$REPO_URL" \
            "+${BASE}:refs/ci/base" \
            "+${HEAD_SHA}:refs/ci/head"
          # --no-renames lists both sides of a rename, so a code file renamed to .md or moved under
          # docs/ still runs the builds.
          git diff --no-renames -z --name-only refs/ci/base...refs/ci/head > "$RUNNER_TEMP/changed"
          echo "Changed paths:"
          tr '\0' '\n' < "$RUNNER_TEMP/changed"
          bash "$scripts/changes.sh" < "$RUNNER_TEMP/changed" | tee -a "$GITHUB_OUTPUT"

  fast-lane:
    name: fast-lane
    # Not on push (Rohan's CI decision, 2026-11-04): the merge queue already ran it on this code.
    if: github.event_name != 'push'
    # The merge group's Linux build and test job's image (ubuntu-22.04, below), so a test that only
    # 22.04 fails shows on the pull request: #441's (2026-11-05) passed here on 24.04 and failed
    # the queue on 22.04.
    runs-on: ubuntu-22.04
    # 40, not 30: the apt step is seconds from the .deb cache, but a new runner image misses it once,
    # and on 2026-11-05 a slow Ubuntu archive took 15 to 30 minutes over a miss (#469, #462).
    timeout-minutes: 40
    steps:
      # Full history: `cargo xtask check` diffs against the merge-base with origin/main, and a
      # shallow clone has none.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # clippy builds the desktop crate, which links WebKitGTK.
      - name: Install the Linux system packages Tauri needs
        uses: ./.github/actions/install-tauri-linux-deps

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/package.json
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Show the pnpm and Node versions against ui/package.json
        run: |
          echo "pnpm $(pnpm -v), ui/package.json wants $(node -p 'require("./ui/package.json").packageManager')"
          echo "node $(node -v), ui/package.json wants $(node -p 'require("./ui/package.json").engines.node')"

      # release.yml runs only on tags and on demand, so its rules (pull request triggers, pinned
      # actions, permissions, secrets on steps, the sidecar seam), latest.json's writer and the
      # sidecar script are tested here, in plain Node, without the network or cargo.
      - name: Test the release scripts and release.yml's rules
        run: node --test .github/scripts/latest-json.test.mjs .github/scripts/sidecars.test.mjs

      # Saved on main only, as every Rust cache here. The key names the image: rust-cache's own key
      # holds only the OS, and build scripts compiled on 24.04 would not run on 22.04's older glibc.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
          key: ubuntu-22.04
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Every pinned tool but cargo-mutants, whose prebuilt Linux binary needs glibc 2.39 (22.04 has
      # 2.35); fast-lane's check never runs it: `cargo xtask mutants` does, in the mutants job on
      # 24.04. The names come from xtask/src/setup.rs, so a new pin is installed here too.
      - name: The pinned tools fast-lane uses
        id: tools
        run: echo "names=$(cargo xtask setup --list=json | jq -r '[.tools[].name, .binaries[].name] | unique | map(select(. != "cargo-mutants")) | join(" ")')" >> "$GITHUB_OUTPUT"

      # As prebuilt binaries; nothing is built from source.
      - name: Install the pinned tools
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: ${{ steps.tools.outputs.names }}

      # The pre-push hook's script, alone and through the pinned lefthook with a local remote: a
      # push of deletes only passes without the check, every other push runs it.
      - name: Test the pre-push hook
        run: bash .github/scripts/pre-push-test.sh

      # launch-xvfb.sh against a fake xvfb-run: the app's own status decides, not xvfb-run's
      # clean-up (#479's group, 2026-11-05).
      - name: Test launch-xvfb.sh
        run: bash .github/scripts/launch-xvfb-test.sh

      # windows-pr-tests.yml's reading of a failed nextest log, against a fake one: a FAIL with a
      # panic and a TMT are named, a FLAKY test is not.
      - name: Test windows-pr-failures.sh
        run: bash .github/scripts/windows-pr-failures-test.sh

      # How reducer-bench reads the label bench-ok at run time, against a fake gh.
      - name: Test reducer-bench's bench-ok read
        run: bash .github/scripts/bench-ok-test.sh

      - name: cargo xtask check
        run: CI=1 cargo xtask check

  # vitest on the newest Node release that "engines.node" allows; see the note at the top.
  vitest-newest-node:
    name: vitest (newest Node)
    needs: changes
    # A failed `changes` runs it, as it runs everything. Not in a merge group (2026-11-04): it is not
    # required there, and the pull request already ran it on the same ui. Not on push either
    # (Rohan's CI decision, 2026-11-04).
    if: ${{ !cancelled() && github.event_name != 'merge_group' && github.event_name != 'push' && (needs.changes.result != 'success' || needs.changes.outputs.ui == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json

      # check-latest: the newest release in the range, not the newest the runner has cached.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Show the Node version against ui/package.json
        run: echo "node $(node -v), the newest release ui/package.json's engines.node $(node -p 'require("./ui/package.json").engines.node') allows"

      - name: Install the ui packages
        run: pnpm -C ui install --frozen-lockfile

      - name: vitest
        run: pnpm -C ui/app run test

  build:
    name: build (${{ matrix.target }})
    needs: changes
    # A failed or skipped `changes` (skipped on push) runs everything (BUILD below), so every check
    # still reports.
    if: ${{ !cancelled() }}
    # A job that only skips takes an ubuntu runner, which starts fastest, never a macOS one: macOS
    # runners are capped at 5 for the whole org. On a pull request the Linux and macOS entries name
    # ubuntu-24.04 as their runner in the matrix, so they always skip there; Windows x64 lints on
    # its own runner when Rust changed. A merge group without a Rust change skips on ubuntu too. A
    # failed `changes` runs everything on the target's own runner.
    runs-on: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.changes.result == 'success' && needs.changes.outputs.rust != 'true' && 'ubuntu-24.04' || matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # One JSON list per event, as in e2e-windows.yml's smoke (Rohan's CI decision, 2026-11-04):
      # - pull_request: the three required checks; Linux and macOS skip on ubuntu, Windows x64
      #   lints only (PR_LINT_ONLY below).
      # - merge_group: tier 1 and Linux in full. Windows ARM64 left the merge-group requirement
      #   (2026-11-04) for the nightly run; a break there goes to its owner.
      # - schedule and workflow_dispatch: everything, tier 2 (Intel macOS, Windows ARM64) included.
      #   The job tier2-x86_64-apple-darwin below and tier2-pr.yml report tier 2's checks elsewhere.
      # `native`: built on its own OS, so linted and tested; Intel macOS is cross-compiled on the
      # arm64 runner, so it is built but not linted or tested. Linux is the oldest glibc we
      # support; release packages are built there later.
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
            && '[{"target": "aarch64-apple-darwin", "runner": "ubuntu-24.04", "native": true},
                 {"target": "x86_64-unknown-linux-gnu", "runner": "ubuntu-24.04", "native": true},
                 {"target": "x86_64-pc-windows-msvc", "runner": "windows-2025", "native": true}]'
            || github.event_name == 'merge_group'
            && '[{"target": "aarch64-apple-darwin", "runner": "macos-15", "native": true},
                 {"target": "x86_64-unknown-linux-gnu", "runner": "ubuntu-22.04", "native": true},
                 {"target": "x86_64-pc-windows-msvc", "runner": "windows-2025", "native": true}]'
            || '[{"target": "aarch64-apple-darwin", "runner": "macos-15", "native": true},
                 {"target": "x86_64-apple-darwin", "runner": "macos-15", "native": false},
                 {"target": "x86_64-unknown-linux-gnu", "runner": "ubuntu-22.04", "native": true},
                 {"target": "x86_64-pc-windows-msvc", "runner": "windows-2025", "native": true},
                 {"target": "aarch64-pc-windows-msvc", "runner": "windows-11-arm", "native": true}]') }}
    # None of these names starts with CARGO or RUST, so none enters rust-cache's key: a pull request
    # and main look up the same entry.
    env:
      TARGET: ${{ matrix.target }}
      EXE: clauseo-desktop${{ contains(matrix.target, '-windows-') && '.exe' || '' }}
      # On a pull request only Windows x64 builds anything, and only its clippy (PR_LINT_ONLY).
      BUILD: ${{ (github.event_name != 'pull_request' || matrix.target == 'x86_64-pc-windows-msvc') && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
      # A pull request's Windows x64 job (Rohan's CI decision, 2026-11-04): checkout, the temp
      # folder on D:, the toolchain, the rust-cache restore and the two clippy steps; no nextest,
      # keychain smoke, app build or other test, which wait for the merge queue. Every step past
      # clippy checks it, directly or through RELEASE, UI or the OS.
      PR_LINT_ONLY: ${{ github.event_name == 'pull_request' }}
      # The full-LTO release app: nightly and on demand only. A merge group runs the dev-profile
      # steps (clippy and the tests).
      RELEASE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      # The ui is built for the release app, and on Linux for the debug app launched under xvfb.
      UI: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(matrix.target, '-linux-') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Skip, nothing to build
        if: env.BUILD != 'true'
        run: echo "No Rust change (crates/, xtask/, Cargo.toml, Cargo.lock, the Rust config), or a pull request, where only Windows x64 lints and the merge queue builds and tests; nothing to build here."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.BUILD == 'true'
        with:
          persist-credentials: false

      # Windows: the temp folder on D:, beside the workspace and target. The runner's TEMP is on
      # C:, the OS disk, about twice as slow at creating and deleting small files as D:, and every
      # test that makes a temp folder (std::env::temp_dir reads TMP, then TEMP) pays for it: one
      # run of the workspace's nextest took 223 s with TEMP on C: and 125 s with it on D:
      # (win-disk-exp, run 41687473859). The disk stalls that time out Windows tests hit the tests
      # that touch the disk; this moves their files off C:.
      - name: Put the temp folder on drive D (Windows)
        if: env.BUILD == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP 't'
          New-Item -ItemType Directory -Force $t | Out-Null
          "TMP=$t" >> $env:GITHUB_ENV
          "TEMP=$t" >> $env:GITHUB_ENV
          "temp folder: $t"

      - name: Install the Rust toolchain from rust-toolchain.toml, and the target
        if: env.BUILD == 'true'
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - name: Install the Linux system packages Tauri needs
        if: env.BUILD == 'true' && runner.os == 'Linux'
        uses: ./.github/actions/install-tauri-linux-deps
        with:
          extra-packages: xvfb

      # A dev-profile check, clippy or nextest embeds no ui (tauri's dev build loads devUrl), so
      # only an app build needs pnpm, Node and the ui workspace.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.BUILD == 'true' && env.UI == 'true'
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.BUILD == 'true' && env.UI == 'true'
        with:
          node-version-file: ui/package.json
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install the ui workspace
        if: env.BUILD == 'true' && env.UI == 'true'
        run: pnpm -C ui install --frozen-lockfile

      # Saved on main only. Intel macOS restores the Apple silicon entry and saves nothing; Windows
      # ARM64 has none (the cache plan is in ci-perfmax's notes: tier 2 would push main past 10 GB).
      # rust-cache never saves over an exact hit, so v1-rust starts fresh entries: main now also
      # builds the Intel check and the Linux debug app, and the v0 entries lack their dependencies.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: env.BUILD == 'true' && matrix.target != 'aarch64-pc-windows-msvc'
        with:
          prefix-key: v1-rust
          key: ${{ matrix.target == 'x86_64-apple-darwin' && 'aarch64-apple-darwin' || matrix.target }}
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.target != 'x86_64-apple-darwin' }}

      # The tests need only one pinned tool, nextest, as a prebuilt binary.
      - name: Install nextest at its pin
        if: env.BUILD == 'true' && matrix.native && env.PR_LINT_ONLY != 'true'
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: cargo-nextest

      # cfg-gated code is linted only on its own OS.
      - name: clippy
        if: env.BUILD == 'true' && matrix.native && !matrix.test_only
        run: cargo clippy --workspace --all-targets --target "$TARGET" -- -D warnings

      # clauseo-agents alone, on its own features: the workspace build unifies them (acp turns on
      # async-channel's std), which hid a macOS compile error in its install example (#258). The
      # example is what the by-hand installs on the Mac mini and clauseo-win-01 run.
      - name: clippy the agents crate on its own features, its example included
        if: env.BUILD == 'true' && matrix.native
        run: cargo clippy -p clauseo-agents --all-targets --target "$TARGET" -- -D warnings

      # The marks build's macOS code (src/marks.rs), which the speed scoreboard plays; that job
      # runs nightly and on demand only, so this keeps it compiling.
      - name: clippy the desktop crate with the marks feature
        if: env.BUILD == 'true' && matrix.target == 'aarch64-apple-darwin'
        run: cargo clippy -p clauseo-desktop --all-targets --features marks --target "$TARGET" -- -D warnings

      # One developer works on an Intel Mac, so main must always compile there; the full Intel
      # build waits for the merge. It runs on main too, so main's cache holds its dependencies.
      - name: Check that the workspace compiles for Intel macOS
        if: env.BUILD == 'true' && matrix.target == 'aarch64-apple-darwin'
        run: |
          rustup target add x86_64-apple-darwin
          cargo check --workspace --all-targets --target x86_64-apple-darwin --locked

      - name: Test
        if: env.BUILD == 'true' && matrix.native && runner.os != 'Linux' && env.PR_LINT_ONLY != 'true'
        run: cargo nextest run --workspace --profile ci --no-tests=pass

      # The OS keychain for real: clauseo-connectors' ignored keychain_smoke test writes, reads and
      # deletes a 2,000-byte item (Keychain Services on macOS, Credential Manager on Windows) under
      # a fresh account name, on every native macOS and Windows entry, Windows ARM64 included.
      # Linux has no keychain store in the crate (not a product target).
      - name: Keychain smoke test (clauseo-connectors)
        if: env.BUILD == 'true' && matrix.native && runner.os != 'Linux' && !matrix.test_only && env.PR_LINT_ONLY != 'true'
        run: cargo nextest run -p clauseo-connectors --profile ci --run-ignored only -E 'test(keychain_smoke)'

      # The desktop crate's tests with the marks feature (the speed scoreboard's build), here on
      # main where a failure turns the run red, with their macOS-only cases. In a merge group the
      # Linux job runs them, off the macOS runner (ci-perfmax's notes: up to about 60 s there).
      - name: Test the desktop crate with the marks feature
        if: env.BUILD == 'true' && matrix.target == 'aarch64-apple-darwin' && env.RELEASE == 'true'
        run: cargo nextest run -p clauseo-desktop --features marks --profile ci --no-tests=pass

      # Twice: tauri's generate_context! writes each compressed asset into the crate's OUT_DIR
      # while that crate compiles, and only if the file is missing (tauri-codegen 2.7.3,
      # embedded_assets.rs:355). On a fresh OUT_DIR cargo then finds the asset newer than the start
      # of that compile and marks the unit stale, even when nothing else builds beside it. The
      # second pass rebuilds it with every asset in place, writes nothing, and leaves the offline
      # run nothing to build.
      - name: Build the tests
        if: env.BUILD == 'true' && runner.os == 'Linux'
        run: |
          cargo nextest run --workspace --profile ci --no-tests=pass --no-run
          cargo nextest run --workspace --profile ci --no-tests=pass --no-run
          cargo nextest run -p clauseo-desktop --features marks --profile ci --no-tests=pass --no-run

      # The desktop crate's tests run a second time with the marks feature (the speed scoreboard's
      # build): its portable cases on every Linux run, so the merge queue tests them; the macOS job
      # runs the macOS ones on main.
      # A new network namespace with only loopback, entered as root and then dropped back to the
      # runner user, without its supplementary groups (docker's socket would reach the network) and
      # with no_new_privs (sudo could otherwise nsenter back out). sudo may replace PATH, HOME and
      # the cargo and rustup homes, so they go through RUN_* variables. The script reads every value
      # from the environment; none is pasted in.
      - name: Test without the network
        if: env.BUILD == 'true' && runner.os == 'Linux'
        run: |
          RUN_UID=$(id -u) RUN_GID=$(id -g) RUN_PATH=$PATH RUN_HOME=$HOME \
          RUN_CARGO_HOME=${CARGO_HOME:-$HOME/.cargo} RUN_RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup} \
            sudo --preserve-env unshare --net -- sh -euc '
              ip link set lo up
              ip -brief address show dev lo
              as_runner() {
                setpriv --reuid="$RUN_UID" --regid="$RUN_GID" --clear-groups --no-new-privs \
                  env PATH="$RUN_PATH" HOME="$RUN_HOME" CARGO_HOME="$RUN_CARGO_HOME" \
                  RUSTUP_HOME="$RUN_RUSTUP_HOME" CARGO_NET_OFFLINE=true "$@"
              }
              echo "uid inside the namespace: $(as_runner id -u)"
              as_runner cargo nextest run --workspace --profile ci --no-tests=pass
              as_runner cargo nextest run -p clauseo-desktop --features marks --profile ci --no-tests=pass
            '

      # `tauri build` turns on `custom-protocol`, so the binary embeds ui/app/dist (a plain
      # `cargo build` would load devUrl). --debug keeps the dev profile, whose dependencies the
      # tests above already built: about 8 s on top of them on an M-series Mac, against 75 s for
      # the full-LTO release build (ci-perfmax's notes).
      - name: Build the debug app
        if: env.BUILD == 'true' && runner.os == 'Linux'
        run: pnpm -C ui tauri build --debug --no-bundle

      # The app must still be running when the timeout stops it (exit 124), without a panic.
      - name: Launch the debug app under xvfb
        if: env.BUILD == 'true' && runner.os == 'Linux'
        env:
          APP: target/debug/${{ env.EXE }}
        run: .github/scripts/launch-xvfb.sh "$APP"

      - name: Build the release app (full LTO)
        if: env.BUILD == 'true' && env.RELEASE == 'true'
        run: pnpm -C ui tauri build --no-bundle --target "$TARGET"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.BUILD == 'true' && env.RELEASE == 'true'
        with:
          name: clauseo-desktop-${{ matrix.target }}
          path: target/${{ env.TARGET }}/release/${{ env.EXE }}
          if-no-files-found: error

      - name: Launch the release app under xvfb
        if: env.BUILD == 'true' && env.RELEASE == 'true' && runner.os == 'Linux'
        env:
          APP: target/${{ env.TARGET }}/release/${{ env.EXE }}
        run: .github/scripts/launch-xvfb.sh "$APP"

  # Tier 2 runs nightly and on demand. On a pull request and in a merge group the build matrix leaves Intel
  # macOS out, and this job reports its required check instead: skipped by `if`, it takes no runner
  # (the org shares 20 concurrent jobs, 5 of them macOS) and reports as skipped, which satisfies a
  # required check. It never runs: on every other event the matrix builds the target under the same
  # check name. Not in the matrix, so it reports its real name; a skipped matrix job would report
  # "build (${{ matrix.target }})" instead. Windows ARM64's stand-in is in tier2-pr.yml, which runs
  # on pull requests only, so that in a merge group the real ARM64 job alone reports its check.
  tier2-x86_64-apple-darwin:
    name: build (x86_64-apple-darwin)
    # Never true (no event is named never); actionlint rejects a constant `false`.
    if: github.event_name == 'never'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Intel macOS is tier 2; it builds nightly and on demand."


  # cargo-mutants on main's changes of the last 24 hours, nightly and on demand. It only reports:
  # a missed mutant, or a run that reaches `MUTANTS_TIMEOUT` in xtask/src/mutants.rs, shows in the
  # job summary and the `mutants-report` artifact and never fails the run.
  # - `cargo xtask mutants` diffs against the merge-base with origin/main, so origin/main is moved
  #   back to main's last commit from before the window; the diff is then the window's changes.
  # - Linux only: a second OS would double the runner minutes for the same mutants. cargo-mutants
  #   also does not build on Windows ARM64 (#41).
  mutants:
    name: mutants
    # On demand only (Rohan's decision, 2026-11-04): mutation testing stops until after the release,
    # and no "kill the mutant" pull requests meanwhile. To bring the nightly run back, put
    # `github.event_name == 'schedule' ||` in front again.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    continue-on-error: true
    # Must exceed the setup (apt, xtask's build) plus `MUTANTS_TIMEOUT` and `MUTANTS_KILL_GRACE`
    # in xtask/src/mutants.rs, so that xtask stops a long run itself and prints the missed mutants
    # found so far, before GitHub cancels the job.
    timeout-minutes: 35
    steps:
      # Full history: `cargo xtask mutants` diffs against the merge-base with origin/main, and a
      # shallow clone has none.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The newest first-parent commit older than 24 hours, or the first commit when there is none.
      # With no commit in the window it is HEAD, and `cargo xtask mutants` finds nothing to test.
      - name: Point origin/main at main as of 24 hours ago
        run: |
          set -euo pipefail
          base=$(git rev-list -1 --first-parent --before='24 hours ago' HEAD)
          if [ -z "$base" ]; then
            base=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          fi
          git update-ref refs/remotes/origin/main "$base"
          echo "Mutating the changes from $base to $(git rev-parse HEAD):"
          git log --oneline "$base..HEAD"

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # A mutant in the desktop crate builds and tests it, which links WebKitGTK.
      - name: Install the Linux system packages Tauri needs
        uses: ./.github/actions/install-tauri-linux-deps

      # Saves the crate registry downloads and xtask's own build. It does not speed up the mutants:
      # each one builds in a copy of the tree with its own target/.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: mutants
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # cargo-mutants runs each mutant's tests with nextest (`test_tool` in .cargo/mutants.toml), so
      # both are installed, and no other pinned tool.
      - name: Install cargo-mutants and nextest at their pins
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: cargo-mutants cargo-nextest

      - name: cargo xtask mutants
        id: mutants
        continue-on-error: true
        run: |
          set -o pipefail
          cargo xtask mutants 2>&1 | tee mutants.log

      - name: Summarise the mutants
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.mutants.outcome }}
        run: |
          {
            echo "## Mutants of main's last 24 hours: \`cargo xtask mutants\` $OUTCOME"
            for f in target/xtask/mutants.out/outcomes.json target/xtask/wire/mutants.out/outcomes.json; do
              [ -f "$f" ] || continue
              jq -r --arg f "$f" '"- \($f): \(.total_mutants) mutants, \(.caught) caught, \(.missed) missed, \(.timeout) timed out, \(.unviable) unviable"' "$f"
            done
            echo
            echo "Last 100 lines of its output (all of it is in the mutants-report artifact):"
            echo
            echo '```'
            tail -n 100 mutants.log 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutants-report
          path: |
            mutants.log
            target/xtask/mutants.diff
            target/xtask/mutants.out
            target/xtask/wire/mutants.out
          if-no-files-found: warn

  # clauseo-reducer's instruction counts under Valgrind (gungraun), nightly and on demand only
  # (Rohan's CI decision, 2026-11-04; the fast lane does not read its output): the hard limits in
  # crates/reducer_bench/benches/apply.rs always apply. The pull request comparison below no longer
  # runs, as the job never starts on a pull request; it stays for a later return. On a
  # pull request whose merge-base on main has the bench, it first saves main's counts as the
  # baseline `main`, then fails the head on more than 2% more `ir` in a large case (the soft limit
  # in apply.rs, on scripted_turn, replay_20k and view_snapshot_20k) unless the pull request
  # carries the label `bench-ok` when the job starts. The job reads the labels through the API
  # (.github/scripts/bench-ok.sh), not from the event, so adding the label and re-running the job
  # works: a re-run keeps the event's payload, labels included (#276 failed its re-run at
  # 2233 -> 2314 Ir with the label on). The one-event cases move by 1.4-1.6% a step from one
  # process to the next on one binary, so they carry hard limits only.
  # - Both runs share one CARGO_TARGET_DIR: gungraun keeps baselines under it (`gungraun/`), and
  #   the head run reuses the base run's dependency builds.
  # - The soft limit is in apply.rs, not on the command line: gungraun's `--callgrind-limits`
  #   replaces each case's own limits, hard ones included. A run without a baseline
  #   (GUNGRAUN_BASELINE) compares with nothing, so it checks the hard limits only.
  # - The head run saves each case's summary (GUNGRAUN_SAVE_SUMMARY=json); the job keeps each
  #   case's module path, id and Callgrind total `Ir` in one small JSON file and uploads it as
  #   reducer-bench-summary, even when the bench failed (scoreboard-comment.yml read it; that
  #   comment is off while the scoreboard runs nightly only). Both steps continue on error: the
  #   job's result stays the bench's.
  reducer-bench:
    name: reducer-bench
    needs: changes
    # Not a required check, so it skips as a whole on pull requests, merge groups and pushes.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      # The pull request's labels at run time (bench-ok.sh).
      pull-requests: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      # Full history: the baseline is built at the merge-base with origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # Its own key: bench builds use the bench profile, which no other job builds. It keeps
      # ~/.cargo/bin, so the runner installed below is not rebuilt while its version stays.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: reducer-bench
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Valgrind
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends valgrind

      # The runner's version must equal the gungraun library's, so it is read from Cargo.lock,
      # the one home of that version.
      - name: Install gungraun-runner at the version of the gungraun library
        run: |
          set -euo pipefail
          version=$(cargo metadata --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "gungraun") | .version')
          echo "gungraun $version"
          cargo install --locked gungraun-runner --version "$version"

      # Its own step, so the token is in no step that builds or runs the code. A failed API call
      # falls back to the event's labels, with a warning.
      - name: Read the label bench-ok now
        id: label
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          BENCH_OK_EVENT: ${{ contains(github.event.pull_request.labels.*.name, 'bench-ok') }}
        run: echo "bench_ok=$(bash .github/scripts/bench-ok.sh)" >> "$GITHUB_OUTPUT"

      # On a pull request, HEAD is the merge commit GitHub made of the head onto main, and
      # origin/main is main as fetched. While main has not moved since that merge, the merge-base
      # is the merge commit's first parent, the main the change lands on, so the comparison shows
      # the pull request's change alone; if main has moved, it is an older main commit. A push
      # to main, the nightly run and a run on demand have no baseline.
      # The base is benched in this same checkout (the merge-base checked out, then HEAD again),
      # with the same command line (the mode goes in GUNGRAUN_SAVE_BASELINE, GUNGRAUN_BASELINE and
      # GUNGRAUN_SAVE_SUMMARY, not in flags): a ~2.4k-Ir case moves by tens of instructions with the
      # length of the paths the bench process sees (argv, the manifest dir, PWD), which shifts its
      # heap and stack layout. From a worktree in $RUNNER_TEMP, turn_ended read 2360 against the
      # head's 2434 (+3.1%, over the 2% soft limit) on a pull request that changed no Rust (run
      # 41394700908).
      - name: cargo bench (apply)
        env:
          EVENT: ${{ github.event_name }}
          BENCH_OK: ${{ steps.label.outputs.bench_ok == 'true' }}
        run: |
          set -euo pipefail
          # A cached earlier run must not become the baseline.
          rm -rf "$CARGO_TARGET_DIR/gungraun"
          bench=(cargo bench --locked -p clauseo-reducer_bench --bench apply)
          baseline=false
          if [ "$EVENT" = pull_request ]; then
            head=$(git rev-parse HEAD)
            base=$(git merge-base HEAD origin/main)
            if git cat-file -e "$base:crates/reducer_bench/Cargo.toml" 2>/dev/null; then
              echo "Baseline: main at $base"
              # Back on HEAD however this step ends, so no later step sees the base's tree.
              trap 'git checkout -q --detach "$head"' EXIT
              git checkout -q --detach "$base"
              rustup toolchain install
              GUNGRAUN_SAVE_BASELINE=main "${bench[@]}"
              git checkout -q --detach "$head"
              rustup toolchain install
              baseline=true
            else
              echo "No baseline: crates/reducer_bench is not at $base"
            fi
          fi
          if [ "$baseline" = true ] && [ "$BENCH_OK" != true ]; then
            GUNGRAUN_BASELINE=main GUNGRAUN_SAVE_SUMMARY=json "${bench[@]}"
          else
            if [ "$BENCH_OK" = true ]; then
              echo "Label bench-ok: hard limits only"
            fi
            GUNGRAUN_SAVE_SUMMARY=json "${bench[@]}"
          fi

      # One small file for the artifact, `{"schema": 1, "cases": [{"module_path", "id", "ir"}]}`,
      # from every summary.json of the head run (a full summary is about 15 KB a case). The base
      # run saves none, and the step before removed any from a cached run.
      - name: Collect the instruction counts
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          mapfile -d '' summaries < <(find "$CARGO_TARGET_DIR/gungraun" -name summary.json -print0 2>/dev/null | sort -z)
          if [ "${#summaries[@]}" -eq 0 ]; then
            echo "No gungraun summary.json: the bench did not get as far as a case."
            exit 0
          fi
          jq -s '{schema: 1, cases: map({module_path, id,
            ir: ([.profiles[]? | select(.tool == "Callgrind") | .data.total.metrics.Ir.values.new][0])})}' \
            "${summaries[@]}" > "$RUNNER_TEMP/reducer-bench-summary.json"
          echo "${#summaries[@]} cases in reducer-bench-summary.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: reducer-bench-summary
          path: ${{ runner.temp }}/reducer-bench-summary.json
          if-no-files-found: warn

  # The quarantined tests (.config/nextest.toml, profile quarantine): left out of every other run
  # until fixed, run here nightly and on demand on Linux and Windows x64, so a fixed one shows as
  # passing and its entry can come out. Reported in the nightly CI run; required nowhere.
  quarantine:
    name: quarantine (${{ matrix.runner }})
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Put the temp folder on drive D (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP 't'
          New-Item -ItemType Directory -Force $t | Out-Null
          "TMP=$t" >> $env:GITHUB_ENV
          "TEMP=$t" >> $env:GITHUB_ENV

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Install the Linux system packages Tauri needs
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-tauri-linux-deps

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          key: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}
          cache-bin: "false"
          save-if: "false"

      - name: Install nextest at its pin
        uses: ./.github/actions/install-pinned-tools
        with:
          tools: cargo-nextest

      - name: The quarantined tests
        run: cargo nextest run --workspace --profile quarantine --no-tests=pass
