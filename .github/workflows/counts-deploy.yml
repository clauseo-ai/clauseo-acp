# Deploys the counts Worker to t.clauseo.chat (docs/counts-worker.md, "Deploying"), or answers
# whether one install or tally id has a row.
#
# - Runs on a push to main that touches the Worker, the crate whose schema it takes
#   (crates/counts, crates/protocol) or this file, so a new value in the crate reaches the
#   Worker with no Worker change; and by hand (workflow_dispatch): `deploy`, or `check` with one
#   install or tally id. Never on a pull request: this is the only workflow with the token.
# - Skipped until Rohan's Cloudflare set-up sets the repository variable COUNTS_DEPLOY_ENABLED to
#   true. The job runs in the environment counts-deploy (main only, Rohan reviews), and the
#   secret CLOUDFLARE_API_TOKEN is set on the steps that call Cloudflare, never on the job.
# - Order: the schema snapshot, then the privacy guard on wrangler.toml, then the account, the
#   D1 database (found by name, else created in the EU; a refused jurisdiction fails the job),
#   the guard again on the generated wrangler.deploy.toml, the migrations, and the deploy.
# - Run logs on this public repo are public. No step prints a database id, an account, a row,
#   a total or an id other than the one `check` was given; `check` prints one count, 0 or 1.
#   No step runs `wrangler whoami` or `wrangler tail`.
name: counts-deploy

on:
  push:
    branches: [main]
    paths:
      - services/counts-worker/**
      - crates/counts/**
      - crates/protocol/**
      - .github/workflows/counts-deploy.yml
  workflow_dispatch:
    inputs:
      action:
        description: deploy, or check one id
        type: choice
        options: [deploy, check]
        default: deploy
      install:
        description: "check: the install id to count in report (or leave empty)"
        required: false
        default: ""
      tally:
        description: "check: the tally id to count in tally (or leave empty)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: counts-deploy
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  WRANGLER_SEND_METRICS: "false"
  # The worker-build release the Worker is built with; it matches the `worker` crate in
  # services/counts-worker/Cargo.lock.
  WORKER_BUILD_VERSION: 0.8.7

jobs:
  deploy:
    name: ${{ inputs.action == 'check' && 'check one id' || 'deploy' }}
    if: vars.COUNTS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: counts-deploy
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/counts-worker
    env:
      ACTION: ${{ inputs.action || 'deploy' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: The committed JSON Schema matches the crate's types
        working-directory: .
        env:
          INSTA_UPDATE: "no"
          CI: "true"
        run: cargo test --locked -p clauseo-counts --lib schema::tests::wire::the_committed_schema_matches

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/package.json
          package-manager-cache: false

      - name: Install wrangler
        run: pnpm install --frozen-lockfile

      - name: Check wrangler.toml's privacy settings
        run: node scripts/check-deploy.mjs

      # Set: wrangler uses it. Not set: wrangler finds the one account the token can see, and
      # fails with "More than one account available" when it sees more. Nothing is printed.
      - name: Find the account ID
        env:
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
            echo "Using the repository variable CLOUDFLARE_ACCOUNT_ID."
          else
            echo "CLOUDFLARE_ACCOUNT_ID is not set: wrangler picks the token's one account."
          fi

      - name: Find or create the D1 database, and write the checked deploy config
        if: env.ACTION == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy.mjs config

      - name: Find the D1 database, and write the checked deploy config
        if: env.ACTION == 'check'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy.mjs config --no-create

      - name: Check the deploy config's privacy settings
        run: node scripts/check-deploy.mjs wrangler.deploy.toml --deployed

      - name: Count the one id given
        if: env.ACTION == 'check'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          INSTALL: ${{ inputs.install }}
          TALLY: ${{ inputs.tally }}
        run: node scripts/deploy.mjs check-id

      - name: Install the wasm target and worker-build
        if: env.ACTION == 'deploy'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install --locked worker-build --version "$WORKER_BUILD_VERSION"

      - name: Apply the migrations
        if: env.ACTION == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler d1 migrations apply clauseo-counts --remote --config wrangler.deploy.toml

      # wrangler deploy runs the build command in wrangler.toml (worker-build --release).
      - name: Deploy
        if: env.ACTION == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy --config wrangler.deploy.toml
